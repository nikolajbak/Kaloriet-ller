/* Billeder. Unsplash foerst, Wikimedia Commons som reserve, ellers en pæn tom plads.
   Unsplashs retningslinjer kraever tre ting, som alle er med herunder: at billedet
   hotlinkes fra deres egne URL'er, at fotografen krediteres med link og utm-parametre,
   og at download-endepunktet kaldes, naar billedet tages i brug. */
var UNSPLASH_STANDARD = "AKpIiZFYDYL7V_EvC6Jd6DVI1aFutfIhq6KkOYeu7mQ";
var UTM = "?utm_source=kaloriedagbog&utm_medium=referral";

function unsplashNoegle(){ return laes(K_UNSPLASH) || UNSPLASH_STANDARD; }

function hentFraUnsplash(soeg){
  var n = unsplashNoegle();
  if (!n) return Promise.resolve(null);
  var u = "https://api.unsplash.com/search/photos?per_page=1&orientation=landscape&content_filter=high"
    + "&query=" + encodeURIComponent(soeg) + "&client_id=" + encodeURIComponent(n);
  return fetch(u).then(function(r){
    if (!r.ok) return null;
    return r.json();
  }).then(function(d){
    var f = d && d.results && d.results[0];
    if (!f) return null;
    /* Paakraevet haendelseskald — taeller kun statistik, henter ikke billedet */
    if (f.links && f.links.download_location){
      fetch(f.links.download_location + "&client_id=" + encodeURIComponent(n)).catch(function(){});
    }
    return {
      url: (f.urls && (f.urls.regular || f.urls.small)) || null,
      fotograf: (f.user && f.user.name) || "Ukendt",
      profil: (f.user && f.user.links && f.user.links.html) || "https://unsplash.com",
      kilde: "unsplash"
    };
  }).catch(function(){ return null; });
}

function hentFraCommons(soeg){
  var u = "https://commons.wikimedia.org/w/api.php?action=query&generator=search"
    + "&gsrnamespace=6&gsrlimit=1&gsrsearch=" + encodeURIComponent("filetype:bitmap " + soeg)
    + "&prop=imageinfo&iiprop=url&iiurlwidth=760&format=json&origin=*";
  return fetch(u).then(function(r){ return r.json(); }).then(function(d){
    var sider = (d && d.query && d.query.pages) || {};
    var f = Object.keys(sider).map(function(k){ return sider[k]; })[0];
    var ii = f && f.imageinfo && f.imageinfo[0];
    if (!ii) return null;
    return { url: ii.thumburl || ii.url, titel: (f.title || "").replace(/^File:/, ""), kilde:"commons" };
  }).catch(function(){ return null; });
}

function hentBillede(soeg, reserve){
  return hentFraUnsplash(soeg).then(function(b){
    if (b && b.url) return b;
    return hentFraCommons(reserve || soeg);
  }).catch(function(){ return null; });
}

function billedKredit(b){
  if (!b) return "";
  if (b.kilde === "unsplash"){
    return 'Foto: <a href="' + esc(b.profil) + UTM + '" target="_blank" rel="noopener">'
      + esc(b.fotograf) + '</a> på <a href="https://unsplash.com' + UTM
      + '" target="_blank" rel="noopener">Unsplash</a>';
  }
  return 'Foto: ' + esc(b.titel) + ' · Wikimedia Commons';
}

/* Vurdering af kosten over tid og eventuelle tilskud. Bygger paa hvad der er
   registreret, som er kalorier og kategorier — ikke maalinger af naeringsstoffer. */
function hentTilskud(a){
  var maaneder = ["januar","februar","marts","april","maj","juni","juli",
                  "august","september","oktober","november","december"];
  var kat = a.kategorier.map(function(k){
    return "- " + k.navn + ": " + Math.round(k.kcal) + " kcal fordelt paa " + k.antal + " maaltider";
  }).join("\n");
  var retter = a.gengangere.slice(0,8).map(function(g){
    return "- " + g.navn + " (" + g.antal + " gange)";
  }).join("\n") || "- ingen gengangere endnu";

  var p = 'Vurder ' + (S.navn || "brugerens") + ' kost over de seneste ' + S.vindue + ' dage.\n\n'
    + 'Der er registreret ' + a.antalDage + ' dage med i alt ' + a.poster.length + ' måltider. '
    + 'Snit ' + Math.round(a.snit) + ' kcal pr. dag mod et mål på ' + S.maal + '.\n'
    + 'Om personen: ' + profiltekst() + '.\n'
    + 'Vi er i ' + maaneder[new Date().getMonth()] + '.\n\n'
    + 'Fordeling på kategorier:\n' + kat + '\n\nGengangere:\n' + retter + '\n\n'
    + kostgrundlag() + '\n\n'
    + 'AFGØRENDE OM DATAGRUNDLAGET: registreringen indeholder kalorier, makronæringsstoffer og '
    + 'en grov kategori pr. måltid. Den indeholder INGEN målinger af vitaminer eller mineraler. '
    + 'Du kan derfor kun tale om mønstre — at der sjældent registreres fisk, eller at grønt '
    + 'fylder lidt — og aldrig konstatere en mangel. Kun en blodprøve hos lægen kan det. '
    + 'Sig det tydeligt, og vær mere forbeholden jo færre dage der er registreret: '
    + 'under 14 dage er et løst indtryk, over 60 dage er et rimeligt billede.\n\n'
    + 'Mad først, tilskud bagefter: peg på hvad der kan spises i stedet, og nævn kun tilskud '
    + 'hvor det er relevant. Hold dig inden for de officielle danske anbefalinger og foreslå '
    + 'aldrig høje doser. D-vitamin i vinterhalvåret gælder alle voksne uanset hvad der står '
    + 'i dagbogen, så den må gerne med, når vi er i oktober til april. Anbefal ikke tilskud '
    + 'på noget, dagbogen ikke kan sige noget om.\n\n'
    + 'Svar udelukkende med JSON, uden markdown:\n'
    + '{"sikkerhed": "loest indtryk"/"nogenlunde"/"rimeligt billede", '
    + '"opsummering": "hvad mønstret viser, max 25 ord", '
    + '"moenstre": [{"emne": "fx fisk og omega-3", "set": "hvad dagbogen viser, max 14 ord", '
    + '"mad": "hvad der kan spises i stedet, max 16 ord", '
    + '"tilskud": "tilskudsråd hvis relevant, ellers tom tekst, max 16 ord"}]}';

  return kald({ model:S.model, max_tokens:1000, messages:[{ role:"user", content:p }] });
}

/* Forslag til lettere alternativer. Tonen er kaek, men gaar altid paa maden
   og aldrig paa personen — det er skrevet ind i selve instruktionen. */
function hentForslag(a){
  var emner = a.toppe.slice(0,4).map(function(t){
    return "- " + t.navn + " (" + Math.round(t.kcal) + " kcal, kategori " + t.kategori + ")";
  }).concat(a.gengangere.slice(0,3).map(function(g){
    return "- " + g.navn + " (" + g.antal + " gange, " + Math.round(g.kcal) + " kcal i alt)";
  })).join("\n");

  var p = 'Du skriver til ' + (S.navn || "brugeren") + 's kaloriedagbog. Her er de poster, der fylder mest '
    + 'i de seneste ' + S.vindue + ' dage:\n' + emner + '\n\n'
    + 'Snit pr. dag: ' + Math.round(a.snit) + ' kcal. Dagligt mål: ' + S.maal + ' kcal.\n\n'
    + 'Giv 3-4 konkrete, lettere alternativer til de tungeste poster. Alternativerne skal være '
    + 'realistisk dansk hverdagsmad, ikke asketiske. Anslå hvor mange kalorier der spares.\n\n'
    + tone() + '\n\n'
    + 'Alternativerne er tilbud, ikke domme.\n\n'
    + 'Svar udelukkende med JSON, uden markdown:\n'
    + '{"overskrift": "en kæk linje på max 14 ord til ' + (S.navn || "brugeren") + ' om hvad der fylder", '
    + '"forslag": [{"fra": "retten der er tung", "til": "det lettere alternativ", '
    + '"spar": heltal kalorier sparet, "kommentar": "kæk bemærkning på max 20 ord"}]}';

  return kald({ model:S.model, max_tokens:900, messages:[{ role:"user", content:p }] });
}

/* Tonen. Drillerierne maa gaa paa personen og hans vaner — det er hele pointen —
   men krop, vaegt og udseende er holdt udenfor, og mad bliver aldrig kaldt synd.
   Et vaerktoej man aabner hver dag maa gerne vaere fraekt, ikke nedgoerende. */
function tone(){
  var n = S.navn || "brugeren";
  var brutal = S.kaekhed === "brutal";
  var skarp = brutal || S.kaekhed === "skarp";
  return 'SPROG: skriv korrekt dansk med æ, ø og å. Aldrig aa, oe eller ae som erstatning.\n\n'
    + 'STEMME — dansk standup-register, tørt og observerende. Otte konkrete greb:\n'
    + '1. VÆR KONKRET. Aldrig "du spiser sent". Hellere "klokken 23.40, stående op, direkte fra gryden". '
    + 'Nævn mængder, klokkeslæt, steder og mærker. Det generelle er ikke morsomt; det genkendelige er.\n'
    + '2. RYTME. To korte sætninger. Så en lang, der løber en anelse længere end den burde og '
    + 'tager et sidespring med. Så en kort, der lukker den.\n'
    + '3. ESKALATION FREM FOR POINTE. Tag en almindelig iagttagelse og før den et skridt længere, '
    + 'end der er dækning for. Selve overdrivelsen er vitsen — der skal ikke være en pointe bagefter.\n'
    + '4. TAL DIREKTE TIL ' + n.toUpperCase() + '. Brug navnet. Stil gerne et retorisk spørgsmål, '
    + 'du ikke venter svar på.\n'
    + '5. TAG DIG SELV MED. Appen er også til grin — den sidder i en telefon og tæller kalorier i '
    + 'et fotografi af aftensmad. Selvudlevering først, drilleri bagefter.\n'
    + '6. PUNKTER DET HØJTIDELIGE. Sundhedssprog, gode forsætter, livsstilssnak og dine egne råd '
    + 'skal stikkes hul på, ikke gentages.\n'
    + '7. TILBAGEKALD. Er der et mønster i dagbogen, så henvis til det. Det, der går igen, er '
    + 'sjovere end det enkeltstående.\n'
    + '8. INGEN FORKLARING. Vitsen forklares aldrig bagefter. Ingen emoji. Højst et udråbstegn. '
    + 'Ingen ordspil for ordspillets skyld.\n'
    + (skarp
        ? '9. VÆR KONTANT. Sig det ligeud uden at pakke det ind. Ironi frem for høflighed. '
          + 'Bandeord som sgu, fandeme og for helvede må bruges sparsomt, hvor de giver rytme — '
          + 'ikke i hver sætning.\n'
        : '9. HOLD DEN TØR. Skarp i iagttagelsen, mild i formen. Ingen bandeord.\n')
    + (brutal
        ? '10. BRUTAL ÆRLIGHED. Ingen indpakning og ingen trøstepræmie. Sig det, en ven ville '
          + 'sige, hvis han var holdt op med at være høflig. Vægten er ikke et ømtåleligt '
          + 'emne: tal ligeud om tallene, om udviklingen og om afstanden til målet. Kald '
          + 'selvbedraget hvad det er — "lige en enkelt" der vejer 900 kalorier, mandagen der '
          + 'aldrig kommer, portionen der blev vurderet med et optimistisk øje, ugen der blev '
          + 'kaldt en undtagelse for fjerde gang. Vær hård ved undskyldningerne. Du behøver '
          + 'ikke afslutte med noget opmuntrende.\n'
        : '')
    + 'Du må drille ' + n + ' personligt: vaner, udflugter, optimistiske portionsvurderinger, '
    + 'gode forsætter der holdt en uge, og de forklaringer folk giver sig selv efter klokken 22.\n'
    + (brutal
        ? 'GRÆNSER: gå efter vanerne, valgene, undskyldningerne og tallene — ikke efter spejlet. '
          + 'Ingen bemærkninger om hvordan ' + n + ' SER UD: kropsform, figur, mave, hage, tøj '
          + 'eller udseende er udenfor, og det samme er hans værdi som menneske. Vægten som TAL '
          + 'og som UDVIKLING er derimod fair game og må siges uden filter. Mad kaldes ikke synd '
          + 'eller forbudt — der er ikke noget moralsk på spil, kun regnskab. Ingen '
          + 'sundhedsprædiken, heller ikke forklædt som en vits.\n'
          + 'Det handler ikke om høflighed: hakken på kroppen virker ikke og er ikke den slags '
          + 'hårdhed der bider. Vanerne og tallene rammer skarpere.'
        : 'GRÆNSER: ingen bemærkninger om krop, vægt, figur eller udseende. Ingen skam over hvad '
          + 'der er spist, og ingen mad kaldes synd, forbudt eller dårlig. Der drilles vaner og '
          + 'valg, aldrig hvordan nogen ser ud. Ingen løftede pegefingre og ingen '
          + 'sundhedsprædiken — heller ikke forklædt som en vits.');
}

/* De officielle danske kostraad og Sundhedsstyrelsens tilskudsanbefalinger.
   Samlet et sted, saa baade maaltidsforslag og tilskudsvurdering hviler paa
   samme grundlag i stedet for at improvisere. */
function kostgrundlag(){
  return 'GRUNDLAG — De officielle Kostråd (Fødevarestyrelsen): spis planterigt, varieret og '
    + 'ikke for meget. 600 g frugt og grønt om dagen, heraf mindst halvdelen grøntsager. '
    + '350 g fisk om ugen, gerne halvdelen fed fisk. Højst 350 g tilberedt oksekød, lammekød '
    + 'og svinekød om ugen. 75 g fuldkorn om dagen. Vælg planteolier og magre mejeriprodukter. '
    + 'Spis mindre af det søde, salte og fede. Sluk tørsten i vand, højst en halv liter '
    + 'sodavand eller saft om ugen.\n'
    + 'Sundhedsstyrelsen og Fødevarestyrelsen anbefaler desuden 5-10 mikrogram D-vitamin dagligt '
    + 'til alle voksne fra oktober til april, 10 mikrogram hele året til personer med mørk hud, '
    + 'gravide og ammende samt folk der sjældent kommer udendørs, og 20 mikrogram plus 800-1000 mg '
    + 'calcium hele året til personer over 70 år. Den øvre sikre grænse for voksne er 100 mikrogram.';
}
function profiltekst(){
  var p = S.profil, d = [];
  if (p.alder) d.push(p.alder + " aar");
  if (p.koen) d.push(p.koen);
  if (p.hoejde) d.push(p.hoejde + " cm");
  var k = kropstal();
  if (k.nu) d.push(kg(k.nu) + " kg");
  if (k.maalvaegt) d.push("maalvaegt " + kg(k.maalvaegt) + " kg");
  d.push(p.hensigt === "holde" ? "vil holde vaegten stabil" : "vil tabe sig");
  return d.join(", ");
}

/* ================= Skaerme ================= */

function tegn(){
  if (harLaas() && !aktivNoegle) return tegnLaas();
  if (!aktivNoegle && !laes(K_NOEGLE)) return tegnOpsaet();
  if (!laes(K_BRUGER)) return tegnOpsaet();
  if (S.skaerm === "historik") tegnHistorik();
  else if (S.skaerm === "trends") tegnTrends();
  else if (S.skaerm === "vaegt") tegnVaegt();
  else tegnHoved();
  animerSkift();
  if (S.ark) tegnArk();
  if (S.indst) tegnIndstillinger();
}

function tegnLaas(){
  var spaerret = spaerretI();
  $("rod").innerHTML =
    '<div class="opsaet"><h1>Kaloriedagbog</h1>'
    + '<p>Skriv din kode for at låse op.</p>'
    + '<input id="l-kode" type="password" inputmode="numeric" autocomplete="off" placeholder="Kode">'
    + '<div id="l-fejl">' + (spaerret
        ? '<div class="note fejl">For mange forsøg. Prøv igen om ' + spaerret + ' sekunder.</div>' : '') + '</div>'
    + '<button class="knap" id="l-op" style="margin-top:16px"' + (spaerret ? " disabled" : "") + '>Lås op</button>'
    + '<button class="knap sek" id="l-glemt" style="margin-top:8px">Jeg har glemt koden</button></div>';

  $("l-op").onclick = function(){
    if (spaerretI()){ tegnLaas(); return; }
    var kode = $("l-kode").value;
    var b = $("l-op");
    b.textContent = "Låser op …"; b.disabled = true;
    dekrypter(kode, laasPakke()).then(function(noegle){
      nulstilFejl();
      aktivNoegle = noegle; aktivKode = kode;
      tegn();
    }).catch(function(){
      var f = noterFejl();
      var rest = 5 - f.antal;
      $("l-fejl").innerHTML = '<div class="note fejl">Forkert kode.'
        + (rest > 0 && rest <= 2 ? ' Efter ' + rest + ' forsøg mere sættes der ventetid på.' : '') + '</div>';
      var k = $("l-op");
      if (k){ k.textContent = "Lås op"; k.disabled = false; }
      if (spaerretI()) tegnLaas();
    });
  };
  $("l-glemt").onclick = function(){
    if (!confirm("Uden koden kan API-nøglen ikke hentes frem igen — den er krypteret med koden. "
      + "Fjerner du låsen, skal du indsætte en ny nøgle fra console.anthropic.com. "
      + "Måltider, vægt og profil bliver stående. Vil du det?")) return;
    fjern(K_LAAS); fjern(K_NOEGLE); nulstilFejl();
    aktivNoegle = null; aktivKode = null;
    tegn();
  };
  var f = $("l-kode"); if (f && !spaerret) setTimeout(function(){ f.focus(); }, 120);
}

function tegnOpsaet(){
  var harN = !!laes(K_NOEGLE);
  $("rod").innerHTML =
    '<div class="opsaet"><h1>Kaloriedagbog</h1>'
    + '<p>Appen bruger din egen API-nøgle til at læse billeder af mad. Nøglen bliver liggende på denne telefon og sendes kun til Anthropic, når du analyserer et måltid.</p>'
    + '<span class="lbl">Dit fornavn — kommentarerne bliver stilet til dig</span>'
    + '<input id="in-navn" autocomplete="given-name" placeholder="Fornavn" value="' + esc(S.navn) + '">'
    + (harN
        ? '<div class="note">Din API-nøgle ligger her allerede. Den skal du ikke røre.</div>'
        : '<span class="lbl">API-nøgle</span>'
          + '<input id="in-noegle" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-...">')
    + '<div id="opsaet-fejl"></div>'
    + '<button class="knap" id="b-gem-noegle" style="margin-top:16px">Tag appen i brug</button>'
    + (harN ? ''
        : '<p style="margin-top:18px;font-size:13px">Nøglen hentes på console.anthropic.com under API keys. Du kan skifte den bagefter.</p>')
    + '</div>';
  $("b-gem-noegle").onclick = function(){
    var navn = $("in-navn").value.trim();
    if (!navn){
      $("opsaet-fejl").innerHTML = '<div class="note fejl">Skriv lige dit fornavn — ellers ved appen ikke, hvem den snakker til.</div>';
      return;
    }
    if (!harN){
      var v = $("in-noegle").value.trim();
      if (v.length < 20){
        $("opsaet-fejl").innerHTML = '<div class="note fejl">Det ligner ikke en hel nøgle. Kopiér hele teksten, der begynder med sk-ant-.</div>';
        return;
      }
      skriv(K_NOEGLE, v);
      aktivNoegle = v;
    }
    S.navn = navn.slice(0,30);
    skriv(K_BRUGER, S.navn);
    tegn();
  };
}

function hoved(venstre){
  return '<div class="top"><span class="datolinje">' + venstre + '</span>'
    + '<button class="txtknap" id="b-indst">Indstillinger</button></div>'
    + '<div class="valg" role="tablist">'
    + [["idag","I dag"],["vaegt","Vægt"],["historik","Historik"],["trends","Trends"]].map(function(t){
        return '<button role="tab" aria-selected="' + (S.skaerm === t[0] ? "true" : "false") + '" '
          + 'data-skaerm="' + t[0] + '" class="' + (S.skaerm === t[0] ? "aktiv" : "") + '">' + t[1] + '</button>';
      }).join("")
    + '</div>';
}
var FANER = ["idag","vaegt","historik","trends"];
function bindHoved(){
  $("b-indst").onclick = function(){ S.indst = true; tegn(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-skaerm]"), function(b){
    b.onclick = function(){
      var ny = b.getAttribute("data-skaerm");
      if (ny === S.skaerm) return;
      /* Retningen foelger fanernes raekkefoelge, saa bevaegelsen svarer til
         den vej man ville skubbe siden med fingeren. */
      S.skiftRetning = FANER.indexOf(ny) > FANER.indexOf(S.skaerm) ? "frem" : "tilbage";
      S.skaerm = ny;
      S.valgt = null; skjulFortryd(); window.scrollTo(0,0); tegn();
    };
  });
}

/* Indgangen spilles kun ved et rigtigt faneskift — ikke hver gang skaermen
   tegnes om efter et gemt maaltid eller en sletning. */
function animerSkift(){
  if (!S.skiftRetning) return;
  var retning = S.skiftRetning;
  S.skiftRetning = null;
  var indhold = document.querySelector(".indhold");
  if (indhold) indhold.classList.add(retning);
  var bund = document.querySelector(".bund");
  if (bund) bund.classList.add("skift");
}

/* --- I dag --- */
function tegnHoved(){
  var poster = hentDag(S.iDag);
  var sum = poster.reduce(function(a,p){
    return { kcal:a.kcal+p.kalorier, pro:a.pro+p.protein_g, kul:a.kul+p.kulhydrat_g, fedt:a.fedt+p.fedt_g };
  }, {kcal:0,pro:0,kul:0,fedt:0});
  var gen = poster.reduce(function(a,p){ return a + p.genstande; }, 0);
  var over = S.maal > 0 && sum.kcal > S.maal;
  var pct = S.maal > 0 ? Math.min(100, sum.kcal / S.maal * 100) : 0;

  var h = '<div class="indhold">' + hoved(langDato(S.iDag))
    + '<div class="hero"><div class="stortal' + (over ? " over" : "") + '">' + tal(sum.kcal) + '</div>'
    + '<div class="maallinje">kalorier i dag · <button class="txtknap" id="b-maal">mål ' + tal(S.maal) + '</button></div>'
    + '<div class="baand"><span class="' + (over ? "over" : "") + '" style="width:' + pct + '%"></span></div>'
    + '<div class="rest"><span class="txt">'
    + (S.maal - sum.kcal >= 0 ? 'tilbage af dagens mål' : 'over dagens mål') + '</span>'
    + '<span class="num' + (over ? " over" : "") + '">' + tal(Math.abs(S.maal - sum.kcal)) + '</span></div>'
    + '<div class="makro"><div>protein <b>' + tal(sum.pro) + ' g</b></div>'
    + '<div>kulhydrat <b>' + tal(sum.kul) + ' g</b></div>'
    + '<div>fedt <b>' + tal(sum.fedt) + ' g</b></div>'
    + (gen > 0 ? '<div>genstande <b>' + kg(gen).replace(",0","") + '</b></div>' : "")
    + '</div></div>'
    + '<h2 class="sek">Dagens måltider</h2>';

  if (!poster.length){
    h += '<div class="tom">Ingen måltider endnu. Tag et billede af det første, så regner appen resten ud.</div>';
  } else {
    poster.forEach(function(p){
      h += '<div class="post">'
        + (p.billede ? '<img src="' + p.billede + '" alt="">' : '<div class="tom-foto"></div>')
        + '<div class="txt" role="button" tabindex="0" aria-label="Ret ' + esc(p.navn) + '" data-red="' + esc(S.iDag) + '|' + esc(p.id) + '"><div class="navn">' + esc(p.navn) + '</div>'
        + '<div class="meta">' + esc(p.tid) + " · " + esc(p.kategori)
        + (portionsTekst(p) ? " · " + portionsTekst(p) : "") + '</div>'
        + (p.kommentar ? '<div class="kom">' + esc(p.kommentar) + '</div>' : "") + '</div>'
        + '<div class="kcal">' + tal(p.kalorier) + '</div>'
        + '<button class="xknap" data-slet="' + esc(p.id) + '" aria-label="Slet ' + esc(p.navn) + '">&times;</button></div>';
    });
  }
  if (poster.length) h += '<p class="grafnote" style="margin:2px 2px 0">Tryk på et måltid for at rette det.</p>';
  h += '<h2 class="sek">Forslag til resten af dagen</h2><div id="spiseboks"></div>'
    + '<p class="fodnote">Tallene er estimater ud fra fotoet. De rammer typisk 20–30 % fra, '
    + 'og lavest ved sovs, olie og skjulte ingredienser. Ret dem, før du gemmer, når du ved bedre.</p></div>'
    + '<div class="bund"><div class="bundindhold">'
    + '<button class="knap" id="b-foto">Tag billede</button>'
    + '<button class="knap sek smal" id="b-skriv">Skriv det</button></div></div>';

  $("rod").innerHTML = h;
  bindHoved();
  $("b-maal").onclick = function(){ S.indst = true; tegn(); };
  $("b-foto").onclick = function(){ $("fil").click(); };
  $("b-skriv").onclick = function(){ S.ark = { status:"skriv", tekst:"" }; tegnArk(); };
  tegnSpiseforslag();
  bindRediger();
  Array.prototype.forEach.call(document.querySelectorAll("[data-slet]"), function(b){
    b.onclick = function(){
      sletPost(S.iDag, b.getAttribute("data-slet"));
      tegn();
    };
  });
}

/* --- Forslag til resten af dagen --- */
function spiseSignatur(){
  var spist = hentDag(S.iDag).reduce(function(a, x){ return a + x.kalorier; }, 0);
  return S.iDag + ":" + spist + ":" + new Date().getHours();
}
function tegnSpiseforslag(){
  var boks = $("spiseboks"); if (!boks) return;
  if (S.spiseStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_SPISE) || "null");
      if (gemt && gemt.sign === spiseSignatur()){ S.spise = gemt.data; S.spiseStatus = "klar"; }
    } catch(e){}
  }
  if (S.spiseStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)" role="status" aria-live="polite">Kigger på resten af dagen …</p>'
      + '<div class="skelet linje" style="width:70%"></div><div class="skelet linje" style="width:50%"></div>';
    return;
  }
  if (S.spiseStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.spiseFejl) + '</div>'
      + '<button class="knap sek" id="b-spise" style="margin-top:10px">Prøv igen</button>';
    $("b-spise").onclick = startSpiseforslag;
    return;
  }
  if (S.spiseStatus === "klar" && S.spise){
    var f = S.spise, ud = f.linje ? '<p class="overskrift">' + esc(f.linje) + '</p>' : "";
    (f.forslag || []).slice(0,4).forEach(function(x, i){
      var aaben = S.aabenRet === i;
      ud += '<div class="kort klik" data-ret="' + i + '">'
        + '<span class="pil">' + (aaben ? "skjul" : "opskrift") + '</span>'
        + (x.kcal ? '<span class="spar" style="color:var(--blaek)">' + tal(x.kcal) + '</span>' : "")
        + '<div class="fra">' + esc(x.ret) + '</div>'
        + (x.hvornaar ? '<div class="til">' + esc(x.hvornaar) + '</div>' : "")
        + (x.hvorfor ? '<div class="kom">' + esc(x.hvorfor) + '</div>' : "")
        + (aaben ? opskriftHtml(i) : "")
        + '</div>';
    });
    ud += '<button class="knap sek" id="b-spise" style="margin-top:6px">Giv mig nogle nye</button>';
    boks.innerHTML = ud;
    $("b-spise").onclick = startSpiseforslag;
    Array.prototype.forEach.call(document.querySelectorAll("[data-ret]"), function(k){
      k.onclick = function(e){
        if (e.target.closest("button.mini")) return;
        var i = Number(k.getAttribute("data-ret"));
        S.aabenRet = S.aabenRet === i ? null : i;
        if (S.aabenRet !== null) aabnOpskrift(i);
        tegnSpiseforslag();
      };
    });
    var tf = $("b-tilfoej"); if (tf) tf.onclick = function(){
      var o = S.opskrifter[S.aabenRet];
      if (!o || !o.data) return;
      var d = o.data;
      var poster = hentDag(S.iDag);
      poster.push(normaliser({
        id: String(Date.now()),
        tid: new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}),
        navn: d.titel || (S.spise.forslag[S.aabenRet] || {}).ret || "Måltid",
        kategori: d.kategori,
        portion: "1 portion efter opskriften",
        kalorier: Number(d.kcal_pr_portion) || 0
      }, 0));
      gemDag(S.iDag, poster);
      S.aabenRet = null;
      nulstilAfledt();
      tegn();
    };
    return;
  }
  boks.innerHTML = '<button class="knap sek" id="b-spise">Hvad kan jeg spise nu</button>';
  $("b-spise").onclick = startSpiseforslag;
}
function opskriftHtml(i){
  var o = S.opskrifter[i];
  if (!o || o.status === "henter") return '<div class="opskrift"><p style="color:var(--daempet);margin:0">Skriver opskriften …</p></div>';
  if (o.status === "fejl") return '<div class="opskrift"><div class="note fejl" style="margin:0">' + esc(o.fejl) + '</div></div>';
  var d = o.data;
  var h = '<div class="opskrift">';
  if (o.billede){
    h += '<img src="' + esc(o.billede.url) + '" alt="' + esc(d.titel || "") + '" loading="lazy">'
      + '<div class="kilde">' + billedKredit(o.billede) + '</div>';
  } else if (o.billedeStatus === "henter"){
    h += '<div class="foto-tom">Leder efter et billede …</div>';
  } else {
    h += '<div class="foto-tom">Der var ikke noget frit billede af netop denne ret</div>';
  }
  h += '<div class="fakta">'
    + (d.tid_min ? '<span><b>' + d.tid_min + '</b> min</span>' : "")
    + (d.portioner ? '<span><b>' + d.portioner + '</b> portioner</span>' : "")
    + (d.kcal_pr_portion ? '<span><b>' + tal(d.kcal_pr_portion) + '</b> kcal pr. portion</span>' : "")
    + '</div>';
  if (Array.isArray(d.ingredienser) && d.ingredienser.length){
    h += '<h4>Ingredienser</h4><ul>'
      + d.ingredienser.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
  }
  if (Array.isArray(d.fremgangsmaade) && d.fremgangsmaade.length){
    h += '<h4>Sådan gør du</h4><ol>'
      + d.fremgangsmaade.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ol>';
  }
  if (d.tip) h += '<div class="tip">' + esc(d.tip) + '</div>';
  h += '<button class="mini" id="b-tilfoej" style="margin-top:14px">Tilføj til dagbogen</button>';
  return h + '</div>';
}

function aabnOpskrift(i){
  if (S.opskrifter[i]) return;
  var x = (S.spise.forslag || [])[i];
  if (!x) return;
  var gemt = null;
  try { gemt = JSON.parse(laes(opskriftNoegle(x.ret)) || "null"); } catch(e){}
  if (gemt){
    S.opskrifter[i] = { status:"klar", data:gemt.data, billede:gemt.billede };
    tegnSpiseforslag();
    return;
  }
  S.opskrifter[i] = { status:"henter" };
  hentOpskrift(x.ret, x.kcal).then(function(d){
    S.opskrifter[i] = { status:"klar", data:d, billede:null, billedeStatus:"henter" };
    tegnSpiseforslag();
    return hentBillede(d.billedsoeg || x.ret, x.ret).then(function(b){
      if (!S.opskrifter[i]) return;
      S.opskrifter[i].billede = b;
      S.opskrifter[i].billedeStatus = "klar";
      skriv(opskriftNoegle(x.ret), JSON.stringify({ data:d, billede:b }));
      ryddOpskrifter();
      if (S.aabenRet === i) tegnSpiseforslag();
    });
  }).catch(function(err){
    S.opskrifter[i] = { status:"fejl", fejl:(err && err.message) || "Opskriften kunne ikke hentes." };
    tegnSpiseforslag();
  });
}
/* Behold de 20 nyeste opskrifter, saa lageret ikke loeber fuldt */
function ryddOpskrifter(){
  var n = alleNoegler().filter(function(k){ return k.indexOf(P_OPSKRIFT) === 0; });
  if (n.length > 20) n.slice(0, n.length - 20).forEach(fjern);
}

function startSpiseforslag(){
  S.spiseStatus = "henter"; S.aabenRet = null; S.opskrifter = {};
  tegnSpiseforslag();
  hentSpiseforslag().then(function(r){
    S.spise = r; S.spiseStatus = "klar";
    skriv(K_SPISE, JSON.stringify({ sign:spiseSignatur(), data:r }));
    tegnSpiseforslag();
  }).catch(function(err){
    S.spiseStatus = "fejl";
    S.spiseFejl = (err && err.message) || "Kunne ikke hente forslag.";
    tegnSpiseforslag();
  });
}

/* --- Vaegt --- */
function tegnVaegt(){
  var k = kropstal();
  var h = '<div class="indhold">' + hoved("Vægt");

  if (!k.liste.length){
    h += '<div class="tom" style="margin-top:18px">Ingen vejninger endnu. Registrér den første, '
      + 'så tegnes kurven her. Én gang om ugen på samme tidspunkt siger mere end hver dag.</div>';
  } else {
    h += '<div class="hero"><div class="stortal mellem">' + kg(k.nu) + '</div>'
      + '<div class="maallinje">kg'
      + (k.maalvaegt > 0 ? ' · <button class="txtknap" id="b-profil">mål ' + kg(k.maalvaegt) + '</button>'
                         : ' · <button class="txtknap" id="b-profil">sæt et mål</button>') + '</div>';
    var linjer = [];
    if (k.aendring !== null && k.liste.length > 1){
      linjer.push((k.aendring > 0 ? "+" : "−") + kg(Math.abs(k.aendring)) + " kg siden "
        + tilDato(k.foerste.dag).toLocaleDateString("da-DK",{day:"numeric",month:"long"}));
    }
    if (k.tilMaal !== null && Math.abs(k.tilMaal) >= 0.1){
      linjer.push(kg(Math.abs(k.tilMaal)) + " kg " + (k.tilMaal > 0 ? "til målet" : "under målet"));
    } else if (k.tilMaal !== null){
      linjer.push("du er ved målet");
    }
    if (linjer.length) h += '<p class="grafnote" style="margin:10px 0 0">' + esc(linjer.join(" · ")) + '</p>';
    h += '</div>' + vaegtgraf(k.liste, k.maalvaegt);

    var celler = [];
    if (k.bmi > 0) celler.push('<div><b>' + kg(k.bmi) + '</b>BMI</div>');
    if (k.tdee > 0) celler.push('<div><b>' + tal(k.tdee) + '</b>anslået forbrug</div>');
    celler.push('<div><b>' + k.liste.length + '</b>vejninger</div>');
    h += '<div class="noegletal">' + celler.join("") + '</div>';

    if (k.tdee > 0){
      h += '<p class="grafnote" style="margin-top:10px">Anslået dagligt forbrug efter Mifflin-St Jeor, '
        + 'ikke en måling — regn med 10–15 % slør. '
        + '<button class="txtknap" id="b-brugtdee">brug som dagligt mål</button></p>';
    }
    if (k.maalBmi > 0 && k.maalBmi < 18.5){
      h += '<div class="note">Målvægten svarer til et BMI på ' + kg(k.maalBmi)
        + '. Under 18,5 regnes som undervægt. Det er dit valg — men det er værd at vende med en læge.</div>';
    }
    h += '<h2 class="sek">Vejninger</h2>';
    k.liste.slice().reverse().slice(0, 20).forEach(function(x, i, arr){
      var forrige = k.liste[k.liste.length - 2 - i];
      var diff = forrige ? x.kg - forrige.kg : null;
      h += '<button class="raekke" data-vdag="' + x.dag + '"><span class="h">'
        + '<span style="display:block">' + kortDato(x.dag) + '</span>'
        + (diff !== null && Math.abs(diff) >= 0.05
            ? '<span class="u">' + (diff > 0 ? "+" : "−") + kg(Math.abs(diff)) + ' kg</span>' : "")
        + '</span><span class="s">' + kg(x.kg) + '</span></button>';
    });
    h += '<p class="fodnote">Tryk på en vejning for at rette eller slette den. '
      + 'Vægten svinger et kilo eller to hen over døgnet, så det er linjen over uger der siger noget.</p>';
  }

  h += '</div><div class="bund"><div class="bundindhold">'
    + '<button class="knap" id="b-vejning">Registrér vægt</button></div></div>';
  $("rod").innerHTML = h;
  bindHoved();
  var bp = $("b-profil"); if (bp) bp.onclick = function(){ S.indst = true; tegn(); };
  var bt = $("b-brugtdee"); if (bt) bt.onclick = function(){
    S.maal = Math.round(k.tdee); skriv(K_MAAL, String(S.maal)); tegn();
  };
  $("b-vejning").onclick = function(){ aabnVejning(S.iDag); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-vdag]"), function(b){
    b.onclick = function(){ aabnVejning(b.getAttribute("data-vdag")); };
  });
}

function aabnVejning(dag){
  var v = hentVaegte(), nu = v[dag] || (vaegtListe().length ? vaegtListe()[vaegtListe().length-1].kg : "");
  var h = '<div class="overlay" id="v-overlay"><div class="panel">'
    + '<h3>Vejning ' + kortDato(dag) + '</h3>'
    + '<span class="lbl">Vægt i kilo</span>'
    + '<input id="v-kg" type="text" inputmode="decimal" value="' + (nu || "") + '" placeholder="fx 84,2">'
    + '<button class="knap" id="v-gem" style="margin-top:16px">Gem</button>'
    + (v[dag] ? '<button class="knap fare" id="v-slet" style="margin-top:8px">Slet denne vejning</button>' : "")
    + '<button class="knap sek" id="v-luk" style="margin-top:8px">Fortryd</button></div></div>';
  var gl = $("v-overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);
  function luk(){ lukBlodt("v-overlay"); }
  $("v-overlay").onclick = function(e){ if (e.target.id === "v-overlay") luk(); };
  $("v-luk").onclick = luk;
  $("v-gem").onclick = function(){
    var kgv = laesKomma($("v-kg").value);
    if (kgv < 20 || kgv > 400){
      alert("Skriv vægten i kilo, fx 84,2.");
      return;
    }
    gemVaegt(dag, kgv); luk(); tegnVaegt();
  };
  var vs = $("v-slet"); if (vs) vs.onclick = function(){
    var gammel = hentVaegte()[dag];
    gemVaegt(dag, 0); luk(); tegnVaegt();
    visFortryd("Vejningen " + kortDato(dag) + " er slettet", function(){ gemVaegt(dag, gammel); });
  };
}

/* --- Ret eller slet en enkelt registrering, ogsaa fra en tidligere dag --- */
function bindRediger(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-red]"), function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var d = b.getAttribute("data-red").split("|");
      aabnRediger(d[0], d.slice(1).join("|"));
    };
  });
}
function aabnRediger(dag, id){
  var poster = hentDag(dag);
  var m = null, i;
  for (i = 0; i < poster.length; i++) if (poster[i].id === id) m = poster[i];
  if (!m) return;

  var h = '<div class="overlay" id="r-overlay"><div class="panel">'
    + '<h3>Ret registrering</h3>'
    + '<p class="grafnote" style="margin:-8px 0 0">' + kortDato(dag)
    + (m.tid ? ' kl. ' + esc(m.tid) : "") + '</p>'
    + (m.billede ? '<img class="foto" src="' + m.billede + '" alt="" style="margin-top:14px">' : "")
    + '<span class="lbl">Måltid</span>'
    + '<input id="r-navn" value="' + esc(m.navn) + '">'
    + '<span class="lbl">Kategori</span><select id="r-kat">'
    + KATEGORIER.map(function(k){
        return '<option value="' + esc(k) + '"' + (m.kategori === k ? " selected" : "") + '>' + esc(k) + '</option>';
      }).join("") + '</select>'
    + '<span class="lbl">Antal portioner — tallene herunder følger med</span>'
    + '<input id="r-ant" type="text" inputmode="decimal" value="' + kg(m.portioner).replace(",0","") + '">'
    + '<span class="lbl">Kalorier i alt</span>'
    + '<input id="r-kcal" type="number" inputmode="numeric" value="' + m.kalorier + '">'
    + '<span class="lbl">Protein · kulhydrat · fedt (g)</span><div class="gitter">'
    + '<input id="r-pro" type="number" inputmode="numeric" value="' + m.protein_g + '">'
    + '<input id="r-kul" type="number" inputmode="numeric" value="' + m.kulhydrat_g + '">'
    + '<input id="r-fedt" type="number" inputmode="numeric" value="' + m.fedt_g + '"></div>'
    + '<span class="lbl">Genstande, hvis der var alkohol</span>'
    + '<input id="r-gen" type="text" inputmode="decimal" value="' + (m.genstande || 0) + '">'
    + '<span class="lbl">Dato og tidspunkt</span>'
    + '<div style="display:flex;gap:8px">'
    + '<input id="r-dato" type="date" style="flex:1.4" value="' + esc(dag) + '" max="' + esc(S.iDag) + '">'
    + '<input id="r-tid" type="time" style="flex:1" value="' + esc(String(m.tid || "12.00").replace(".", ":")) + '">'
    + '</div>'
    + '<button class="knap" id="r-gem" style="margin-top:16px">Gem ændringer</button>'
    + '<button class="knap fare" id="r-slet" style="margin-top:8px">Slet registreringen</button>'
    + '<button class="knap sek" id="r-luk" style="margin-top:8px">Fortryd</button>'
    + '</div></div>';
  var gl = $("r-overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);

  bindPortioner("r-ant", ["r-kcal","r-pro","r-kul","r-fedt","r-gen"]);
  function luk(){ lukBlodt("r-overlay"); }
  function opdater(){
    nulstilAfledt();
    luk(); tegn();
  }
  $("r-overlay").onclick = function(e){ if (e.target.id === "r-overlay") luk(); };
  $("r-luk").onclick = luk;
  $("r-gem").onclick = function(){
    var nyDag = $("r-dato").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(nyDag)) nyDag = dag;
    var opdateret = null;
    var nye = hentDag(dag).map(function(p){
      if (p.id !== id) return p;
      var ant = laesKomma($("r-ant").value) || 1;
      var totaler = {
        kalorier: Number($("r-kcal").value) || 0,
        protein_g: Number($("r-pro").value) || 0,
        kulhydrat_g: Number($("r-kul").value) || 0,
        fedt_g: Number($("r-fedt").value) || 0,
        genstande: laesKomma($("r-gen").value)
      };
      var ny = normaliser({
        id: p.id,
        tid: laesTid("r-tid") || m.tid,
        navn: $("r-navn").value.trim() || "Måltid",
        kategori: $("r-kat").value,
        portion: p.portion,
        kommentar: p.kommentar,
        portioner: ant,
        pr_portion: prPortion(totaler, ant),
        kalorier: totaler.kalorier,
        protein_g: totaler.protein_g,
        kulhydrat_g: totaler.kulhydrat_g,
        fedt_g: totaler.fedt_g,
        genstande: totaler.genstande,
        billede: p.billede
      }, 0);
      opdateret = ny;
      return ny;
    });
    if (nyDag === dag){
      gemDag(dag, nye);
    } else {
      /* Flyttes måltidet, fjernes det fra den gamle dag og lægges på den nye */
      gemDag(dag, hentDag(dag).filter(function(p){ return p.id !== id; }));
      gemDag(nyDag, hentDag(nyDag).concat([opdateret]));
    }
    opdater();
  };
  $("r-slet").onclick = function(){
    luk();
    sletPost(dag, id);
    tegn();
  };
}

/* --- Historik --- */
function tegnHistorik(){
  var perioder = byggPerioder(S.periode);
  var medData = perioder.filter(function(p){ return p.antal > 0; });
  var ialt = medData.reduce(function(a,p){ return a + p.total; }, 0);
  var dageIalt = medData.reduce(function(a,p){ return a + p.antal; }, 0);
  var snit = dageIalt ? ialt / dageIalt : 0;
  var navn = { dag:"30 dage", uge:"12 uger", maaned:"12 måneder" }[S.periode];

  var h = '<div class="indhold">' + hoved("Historik")
    + '<div class="valg" style="margin-top:8px">'
    + ['dag','uge','maaned'].map(function(t){
        return '<button data-per="' + t + '" class="' + (S.periode === t ? "aktiv" : "") + '">'
          + {dag:"Dag",uge:"Uge",maaned:"Måned"}[t] + '</button>';
      }).join("") + '</div>';

  if (!perioder.length){
    h += '<div class="tom" style="margin-top:16px">Der er ikke registreret måltider endnu. Så snart du gemmer det første, tegnes kurven her.</div></div>';
    $("rod").innerHTML = h; bindHoved(); bindPeriode(); return;
  }

  h += '<div class="noegletal"><div><b>' + tal(snit) + '</b>snit pr. dag</div>'
    + '<div><b>' + tal(ialt) + '</b>i alt</div>'
    + '<div><b>' + dageIalt + '</b>dage registreret</div></div>'
    + graf(perioder)
    + '<p class="grafnote">Søjlerne viser snit pr. dag, så målet betyder det samme i alle tre visninger. Seneste ' + navn + '.</p>';

  perioder.slice().reverse().forEach(function(p){
    if (!p.antal && S.periode !== "dag") return;
    var kanAabnes = p.antal || S.periode === "dag";
    h += '<button class="raekke" data-valg="' + esc(p.id) + '">'
      + '<span class="h"><span style="display:block">' + esc(p.titel) + '</span>'
      + (p.under || p.antal > 1 ? '<span class="u">' + esc(p.under)
          + (p.under && p.antal > 1 ? " · " : "")
          + (p.antal > 1 ? p.antal + " dage · snit " + tal(p.snit) : "") + '</span>' : "")
      + '</span><span class="s">' + (p.antal ? tal(p.total) : "–") + '</span></button>';
    if (S.valgt === p.id && !p.antal && S.periode === "dag"){
      h += '<div class="detalje">Ingen registreringer denne dag. '
        + '<button class="mini" data-tilfoej="' + esc(p.id) + '" style="margin-top:8px">'
        + 'Tilføj måltid</button></div>';
    }
    if (S.valgt === p.id && p.antal){
      h += '<div class="detalje">';
      if (S.periode === "dag"){
        hentDag(p.dage[0]).forEach(function(m){
          h += '<button data-red="' + esc(p.dage[0]) + '|' + esc(m.id) + '">'
            + '<span class="navn">' + esc(m.navn) + '</span>'
            + '<span class="tal">' + tal(m.kalorier) + ' ›</span></button>';
        });
        h += '<button class="mini" data-tilfoej="' + esc(p.id) + '" style="margin-top:10px">'
          + 'Tilføj måltid til denne dag</button>';
      } else {
        p.dage.slice().reverse().forEach(function(n){
          h += '<button data-gaadag="' + n + '">'
            + '<span class="navn">' + kortDato(n) + '</span>'
            + '<span class="tal">' + tal(dagSum(n)) + ' ›</span></button>';
        });
      }
      h += '</div>';
    }
  });
  h += '</div>';
  $("rod").innerHTML = h;
  bindHoved(); bindPeriode();
  Array.prototype.forEach.call(document.querySelectorAll("[data-valg]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-valg");
      S.valgt = S.valgt === id ? null : id;
      tegnHistorik();
    };
  });
  bindRediger();
  /* Fra en uge eller maaned kan man springe ned i den enkelte dag */
  Array.prototype.forEach.call(document.querySelectorAll("[data-tilfoej]"), function(b){
    b.onclick = function(e){
      e.stopPropagation();
      S.maalDag = b.getAttribute("data-tilfoej");
      S.ark = { status:"skriv", tekst:"" };
      tegnArk();
    };
  });

/* --- Trends --- */
function tegnTrends(){
  var a = analyseAfVindue(S.vindue);
  var h = '<div class="indhold">' + hoved("Trends")
    + '<div class="valg" style="margin-top:8px">'
    + [7,30,90].map(function(v){
        return '<button data-vin="' + v + '" class="' + (S.vindue === v ? "aktiv" : "") + '">' + v + ' dage</button>';
      }).join("") + '</div>';

  if (!a.poster.length){
    h += '<div class="tom" style="margin-top:16px">Ingen måltider i perioden. Registrér nogle dage, så finder appen mønstrene.</div></div>';
    $("rod").innerHTML = h; bindHoved(); bindVindue(); return;
  }

  var retning = "";
  if (a.aendring !== null && Math.abs(a.aendring) >= 3){
    retning = (a.aendring > 0 ? "↑ " : "↓ ") + Math.abs(Math.round(a.aendring)) + " %";
  }
  h += '<div class="noegletal"><div><b>' + tal(a.snit) + '</b>snit pr. dag</div>'
    + '<div><b>' + a.antalDage + '</b>dage registreret</div>'
    + (retning ? '<div><b>' + retning + '</b>mod forrige periode</div>' : '')
    + '</div>';

  /* kategorier */
  h += '<h2 class="sek">Hvad kalorierne kommer fra</h2>';
  var maks = a.kategorier[0] ? a.kategorier[0].kcal : 1;
  a.kategorier.forEach(function(k, i){
    var pct = a.ialt > 0 ? Math.round(k.kcal / a.ialt * 100) : 0;
    h += '<div class="katraekke' + (i === 0 ? " top" : "") + '">'
      + '<div class="kattop"><span class="katnavn">' + esc(k.navn)
      + (i === 0 ? '<span class="maerke">største post</span>' : "")
      + ' <em>' + k.antal + ' måltider · ' + pct + ' %</em></span>'
      + '<span class="kattal">' + tal(k.kcal) + '</span></div>'
      + '<div class="katbar"><span style="width:' + (k.kcal / maks * 100).toFixed(1) + '%"></span></div></div>';
  });

  /* hoejdespringere */
  h += '<h2 class="sek">Højdespringere</h2>';
  a.toppe.forEach(function(t){
    h += '<div class="raekke" style="cursor:default"><span class="h">'
      + '<span style="display:block">' + esc(t.navn)
      + (t.ekstrem ? '<span class="maerke varm">stikker ud</span>' : "") + '</span>'
      + '<span class="u">' + kortDato(t.dag) + ' · ' + esc(t.kategori) + '</span></span>'
      + '<span class="s">' + tal(t.kcal) + '</span></div>';
  });
  h += '<p class="grafnote" style="margin-top:8px">“Stikker ud” betyder, at måltidet ligger tydeligt over dit eget gennemsnit i perioden — ikke at der er noget galt med det.</p>';

  /* gengangere */
  if (a.gengangere.length){
    h += '<h2 class="sek">Gengangere</h2>';
    a.gengangere.slice(0,5).forEach(function(g){
      h += '<div class="raekke" style="cursor:default"><span class="h">'
        + '<span style="display:block">' + esc(g.navn) + '</span>'
        + '<span class="u">' + g.antal + ' gange · snit ' + tal(g.kcal / g.antal) + '</span></span>'
        + '<span class="s">' + tal(g.kcal) + '</span></div>';
    });
  }

  /* forslag */
  h += '<h2 class="sek">Lettere alternativer</h2><div id="forslag"></div>'
    + '<h2 class="sek">Kost og tilskud</h2><div id="tilskudsboks"></div></div>';
  $("rod").innerHTML = h;
  bindHoved(); bindVindue();
  tegnForslag(a);
  tegnTilskud(a);
}
function tilskudSignatur(a){
  return S.vindue + ":" + a.antalDage + ":" + a.poster.length + ":"
    + a.kategorier.map(function(k){ return k.navn + Math.round(k.kcal / 100); }).join("|");
}
function tegnTilskud(a){
  var boks = $("tilskudsboks"); if (!boks) return;
  if (S.tilskudStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_TILSKUD) || "null");
      if (gemt && gemt.sign === tilskudSignatur(a)){ S.tilskud = gemt.data; S.tilskudStatus = "klar"; }
    } catch(e){}
  }
  if (S.tilskudStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)" role="status" aria-live="polite">Gennemgår kosten …</p>'
      + '<div class="skelet linje" style="width:65%"></div><div class="skelet linje" style="width:80%"></div>'; return;
  }
  if (S.tilskudStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.tilskudFejl) + '</div>'

  }
  if (S.tilskudStatus === "klar" && S.tilskud){
    var t = S.tilskud;
    var mrk = { "loest indtryk":"Løst indtryk", "nogenlunde":"Nogenlunde grundlag",
                "rimeligt billede":"Rimeligt billede" }[t.sikkerhed] || "Løst indtryk";
    var ud = '<span class="maerke stor">' + esc(mrk) + ' · ' + a.antalDage + ' dage</span>'
      + (t.opsummering ? '<p class="overskrift" style="margin-top:12px">' + esc(t.opsummering) + '</p>' : "");
    (t.moenstre || []).slice(0,5).forEach(function(m){
      ud += '<div class="kort"><div class="fra">' + esc(m.emne) + '</div>'
        + (m.set ? '<div class="kom" style="font-style:normal">' + esc(m.set) + '</div>' : "")
        + (m.mad ? '<div class="til">→ <b>' + esc(m.mad) + '</b></div>' : "")
        + (m.tilskud ? '<div class="kom">Tilskud: ' + esc(m.tilskud) + '</div>' : "")
        + '</div>';
    });

      + '<p class="fodnote">Dagbogen måler kalorier og kategorier, ikke vitaminer. Det her er mønstre '
      + 'i det, du har registreret — ikke en konstatering af mangel. Kun en blodprøve hos lægen '
      + 'kan afgøre det, og tal med lægen eller apoteket, før du lægger tilskud til fast medicin.</p>';

    $("b-tilskud").onclick = function(){ startTilskud(a); };
    return;
  }
  boks.innerHTML = '<p style="color:var(--daempet);font-size:14px;margin:0 0 10px">'
    + 'Appen kan se på, hvad kosten peger på over tid, og om et tilskud giver mening. '
    + 'Vurderingen bliver skarpere, jo flere dage du registrerer. Det koster ét API-kald.</p>'
    + '<button class="knap sek" id="b-tilskud">Vurdér min kost</button>';
  $("b-tilskud").onclick = function(){ startTilskud(a); };
}
function startTilskud(a){
  S.tilskudStatus = "henter"; tegnTilskud(a);
  hentTilskud(a).then(function(r){
    S.tilskud = r; S.tilskudStatus = "klar";
    skriv(K_TILSKUD, JSON.stringify({ sign:tilskudSignatur(a), data:r }));
    tegnTilskud(a);
  }).catch(function(err){
    S.tilskudStatus = "fejl";
    S.tilskudFejl = (err && err.message) || "Kunne ikke vurdere kosten.";
    tegnTilskud(a);
  });

function bindVindue(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-vin]"), function(b){
    b.onclick = function(){
      S.vindue = Number(b.getAttribute("data-vin"));
      S.forslag = null; S.forslagStatus = "tom";
      S.tilskud = null; S.tilskudStatus = "tom";
      tegnTrends();
    };

}
/* Forslagene koster et API-kald, saa de gemmes og hentes kun paa opfordring */
/* Et gemt forslag maa kun vises, hvis alle de retter det naevner stadig
   findes i dagbogen. Ellers kan en slettet registrering leve videre i teksten. */
function forslagStadigGyldigt(data, a){
  if (!data || !Array.isArray(data.forslag)) return false;
  var kendte = {};
  a.toppe.forEach(function(t){ kendte[t.navn.toLowerCase().trim()] = 1; });
  a.gengangere.forEach(function(g){ kendte[g.navn.toLowerCase().trim()] = 1; });
  return data.forslag.every(function(x){
    return !x.fra || kendte[String(x.fra).toLowerCase().trim()];
  });
}
function tegnForslag(a){
  var boks = $("forslag"); if (!boks) return;
  if (S.forslagStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_FORSLAG) || "null");
      if (gemt && gemt.vindue === S.vindue && gemt.sign === signatur(a)
          && forslagStadigGyldigt(gemt.data, a)){
        S.forslag = gemt.data; S.forslagStatus = "klar";
      } else if (gemt){
        fjern(K_FORSLAG);
      }
    } catch(e){}
  }
  if (S.forslagStatus === "klar" && !forslagStadigGyldigt(S.forslag, a)){
    S.forslag = null; S.forslagStatus = "tom"; fjern(K_FORSLAG);
  }
  if (S.forslagStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)">Kigger dagbogen igennem …</p>';
    return;
  }
  if (S.forslagStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.forslagFejl) + '</div>'
      + '<button class="knap sek" id="b-forslag" style="margin-top:10px">Prøv igen</button>';
    $("b-forslag").onclick = function(){ startForslag(a); };
    return;
  }
  if (S.forslagStatus === "klar" && S.forslag){
    var f = S.forslag;
    var ud = f.overskrift ? '<p class="overskrift">' + esc(f.overskrift) + '</p>' : "";
    (f.forslag || []).forEach(function(x){
      ud += '<div class="kort">'
        + (x.spar ? '<span class="spar">−' + tal(x.spar) + '</span>' : "")
        + '<div class="fra">' + esc(x.fra) + '</div>'
        + '<div class="til">→ <b>' + esc(x.til) + '</b></div>'
        + (x.kommentar ? '<div class="kom">' + esc(x.kommentar) + '</div>' : "")
        + '</div>';
    });
    ud += '<button class="knap sek" id="b-forslag" style="margin-top:6px">Giv mig nogle nye</button>'
      + '<p class="fodnote">Forslagene er idéer, ikke en kostplan. Skal noget laves om, er det dig der bestemmer hvad.</p>';
    boks.innerHTML = ud;
    $("b-forslag").onclick = function(){ startForslag(a); };
    return;
  }
  boks.innerHTML = '<p style="color:var(--daempet);font-size:14px;margin:0 0 10px">'
    + 'Appen kan foreslå lettere alternativer til det, der fylder mest. Det koster ét API-kald.</p>'
    + '<button class="knap sek" id="b-forslag">Find lettere alternativer</button>';
  $("b-forslag").onclick = function(){ startForslag(a); };
}
function signatur(a){
  return a.toppe.map(function(t){ return t.navn + t.kcal; }).join("|")
    + "#" + a.gengangere.slice(0,3).map(function(g){ return g.navn + g.kcal; }).join("|");
}
function startForslag(a){
  S.forslagStatus = "henter"; tegnForslag(a);
  hentForslag(a).then(function(r){
    S.forslag = r; S.forslagStatus = "klar";
    skriv(K_FORSLAG, JSON.stringify({ vindue:S.vindue, sign:signatur(a), data:r }));
    tegnForslag(a);
  }).catch(function(err){
    S.forslagStatus = "fejl";
    S.forslagFejl = (err && err.message) || "Kunne ikke hente forslag.";
    tegnForslag(a);
  });
}

  function opdaterBudget(){

    if (!bb) return;
    var d = $("f-dato") ? $("f-dato").value : maalDag();
    var b = dagsbudget(d);
    bb.innerHTML = budgetTekst(b.spist, b.spist + (Number($("f-kcal").value) || 0))
      + (d !== S.iDag ? '<div class="rest">Registreres på ' + esc(kortDato(d)) + '</div>' : "");
  }
  bindPortioner("f-ant", ["f-kcal","f-pro","f-kul","f-fedt","f-gen"], opdaterBudget);
  var fd = $("f-dato"); if (fd) fd.onchange = opdaterBudget;
  var altListe = (a.r && Array.isArray(a.r.alternativer))
    ? a.r.alternativer.filter(function(x){ return x && x.til; }).slice(0,3) : [];
  Array.prototype.forEach.call(document.querySelectorAll("[data-alt]"), function(knap){
    knap.onclick = function(){
      var x = altListe[Number(knap.getAttribute("data-alt"))];
      if (!x) return;
      var kcal = Number($("f-kcal").value) || 0;
      /* Besparelsen gaelder én portion, saa den skal ganges op, hvis der er flere */
      var antal = laesKomma($("f-ant").value) || 1;
      var spar = Math.min((Number(x.spar) || 0) * antal, kcal);
      if (spar <= 0) return;
      var ny = kcal - spar, faktor = kcal > 0 ? ny / kcal : 0;
      $("f-kcal").value = Math.round(ny);
      ["f-pro","f-kul","f-fedt","f-gen"].forEach(function(id){
        var i = $(id); if (!i) return;
        var v = laesKomma(i.value) * faktor;
        i.value = id === "f-gen" ? Math.round(v * 10) / 10 : Math.round(v);
      });

      /* Teksten skal foelge tallene, saa registreringen beskriver det der faktisk blev spist */
      var nytNavn = (x.nyt_navn || "").trim();
      if (!nytNavn){
        var gammelt = ($("f-navn").value || "").trim();
        nytNavn = gammelt ? gammelt + " — " + x.til : x.til;
      }
      $("f-navn").value = nytNavn;
      a.r.navn = nytNavn;
      a.r.portion = (a.r.portion ? a.r.portion + " · " : "") + "ændret: " + x.til;
      a.r.kommentar = (x.ros || "").trim();
      var kl = $("kommentarlinje");
      if (kl){
        kl.textContent = a.r.kommentar;
        kl.style.display = a.r.kommentar ? "" : "none";
      }
      var nb = $("noteboks");
      if (nb){
        nb.innerHTML = '<div>Regnet som: ' + esc(a.r.portion) + '</div>';
        nb.style.display = "";
      }

      opdaterBudget();
      knap.textContent = "Regnet med"; knap.disabled = true;
    };
  });
  var bg = $("b-gem"); if (bg) bg.onclick = function(){
    var dag = ($("f-dato") && $("f-dato").value) || maalDag();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dag)) dag = S.iDag;
    var poster = hentDag(dag);
    poster.push(normaliser({
      id: String(Date.now()),
      tid: laesTid("f-tid") || standardTid(dag),
      navn: $("f-navn").value.trim() || "Måltid",
      kategori: $("f-kat").value,
      portion: (a.r && a.r.portion) || "",
      kommentar: (a.r && a.r.kommentar) || "",
      portioner: laesKomma($("f-ant").value) || 1,
      pr_portion: prPortion({
        kalorier: Number($("f-kcal").value) || 0,
        protein_g: Number($("f-pro").value) || 0,
        kulhydrat_g: Number($("f-kul").value) || 0,
        fedt_g: Number($("f-fedt").value) || 0,
        genstande: laesKomma($("f-gen").value)
      }, laesKomma($("f-ant").value) || 1),
      genstande: laesKomma($("f-gen").value),
      kalorier: Number($("f-kcal").value) || 0,
      protein_g: Number($("f-pro").value) || 0,
      kulhydrat_g: Number($("f-kul").value) || 0,
      fedt_g: Number($("f-fedt").value) || 0,
      billede: a.lille || null
    }, 0));
    gemDag(dag, poster);
    S.maalDag = null;
    nulstilAfledt();
    lukArk();
  };
}
function visResultat(a, r){
  S.ark = { status:"resultat", stor:a.stor, lille:a.lille, note:a.note,
            beskrivelse:a.beskrivelse, dag:a.dag, tid:a.tid, antal:a.antal, r:r };
  tegnArk();
}
function kaldAnalyse(stor, lille, note, svar, beskrivelse, dag, tid, antal){
  dag = dag || maalDag();
  tid = tid || standardTid(dag);
  S.ark = { status:"analyserer", stor:stor, lille:lille, note:note,
            beskrivelse:beskrivelse, dag:dag, tid:tid, antal:antal };
  tegnArk();
  analyser(stor, note, svar, beskrivelse, dag, tid).then(function(r){
    var basis = { stor:stor, lille:lille, note:note, beskrivelse:beskrivelse,
                  dag:dag, tid:tid, antal:antal };
    if (!r.er_mad){
      S.ark = Object.assign({ status:"fejl", besked: beskrivelse
        ? "Det lyder ikke som mad eller drikke. Prøv en anden formulering, eller indtast tallene selv."
        : "Der ser ikke ud til at være mad på billedet. Tag et nyt, eller indtast tallene selv." }, basis);
      tegnArk(); return;
    }
    var sp = Array.isArray(r.spoergsmaal) ? r.spoergsmaal.filter(function(x){
      return x && x.tekst && Array.isArray(x.valg) && x.valg.length;
    }).slice(0,3) : [];
    if (sp.length && !svar){
      S.ark = Object.assign({ status:"spoergsmaal", spoergsmaal:sp, svar:{}, r:r }, basis);
      /* portionsantallet foelger med gennem runden */
      tegnArk(); return;
    }
    visResultat(basis, r);
  }).catch(function(err){
    S.ark = { status:"fejl", stor:stor, lille:lille, note:note, beskrivelse:beskrivelse,
      dag:dag, tid:tid, antal:antal,
      besked:(err && err.message) || "Analysen gik i stå. Prøv igen, eller indtast tallene selv." };
    tegnArk();
  });
}
function lukArk(){
  S.ark = null;
  S.maalDag = null;
  lukBlodt("overlay", tegn);
}

function snapHtml(){
  var liste = snapListe();
  if (!liste.length) return '<div class="tom" style="padding:14px 16px">Der er ikke taget nogen kopi endnu.</div>';
  return liste.map(function(x){
    var d = new Date(x.tid);
    return '<div class="snap"><span class="n">'
      + d.toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + " kl. "
      + d.toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"})
      + '<span class="u">' + x.dage + ' dage · ' + x.maaltider + ' måltider · '
      + x.vejninger + ' vejninger' + (x.aarsag ? ' · ' + esc(x.aarsag) : "") + '</span></span>'
      + '<button data-snap="' + esc(x.noegle) + '">Gendan</button></div>';
  }).join("");
}

/* <details> lukker uden animation af sig selv — browseren river indholdet ud med det
   samme. Derfor styres hoejden herfra, saa den folder lige saa blodt sammen som ud. */
function bindFoldning(rod){
  var afsnit = (rod || document).querySelectorAll("details.afsnit");
  Array.prototype.forEach.call(afsnit, function(d){
    var sum = d.children[0], krop = d.children[1];
    if (!sum || !krop) return;
    sum.onclick = function(e){
      e.preventDefault();
      if (d.getAttribute("data-arbejder")) return;
      d.setAttribute("data-arbejder", "1");
      krop.style.overflow = "hidden";

      if (!d.open){
        d.open = true;
        krop.style.height = "0px";
        krop.style.opacity = "0";
        var maal = krop.scrollHeight;
        requestAnimationFrame(function(){
          krop.style.transition = "height .26s cubic-bezier(.22,.7,.3,1), opacity .2s ease-out";
          krop.style.height = maal + "px";
          krop.style.opacity = "1";
        });
        setTimeout(function(){
          krop.style.transition = ""; krop.style.height = "";
          krop.style.opacity = ""; krop.style.overflow = "";
          d.removeAttribute("data-arbejder");
        }, 280);
      } else {
        krop.style.height = krop.scrollHeight + "px";
        requestAnimationFrame(function(){
          krop.style.transition = "height .22s cubic-bezier(.4,0,.7,1), opacity .16s ease-in";
          krop.style.height = "0px";
          krop.style.opacity = "0";
        });
        setTimeout(function(){
          d.open = false;
          krop.style.transition = ""; krop.style.height = "";
          krop.style.opacity = ""; krop.style.overflow = "";
          d.removeAttribute("data-arbejder");
        }, 240);
      }
    };
  });
}

/* Ark skal ogsaa glide ud igen. Id-et fjernes med det samme, saa arket ikke
   kan findes to gange, mens udgangen spiller. */
function lukBlodt(id, naar){
  var o = $(id);
  if (!o){ if (naar) naar(); return; }
  o.removeAttribute("id");
  o.classList.add("lukker");
  setTimeout(function(){
    if (o.parentNode) o.parentNode.removeChild(o);
    if (naar) naar();
  }, 200);
}

   iOS kan holde fast i en gammel udgave af en hjemmeskaerms-app i lang tid.
   Appen henter derfor sin egen index.html udenom cachen, laeser versionsnummeret
   og genindlaeser paa en frisk adresse, hvis der ligger noget nyere paa GitHub. */

function versionsTal(v){
  return String(v).split(".").map(function(x){ return parseInt(x, 10) || 0; });
}
function erNyere(ny, gammel){
  var a = versionsTal(ny), b = versionsTal(gammel);
  for (var i = 0; i < Math.max(a.length, b.length); i++){
    var x = a[i] || 0, y = b[i] || 0;
    if (x !== y) return x > y;
  }
  return false;
}
function grundadresse(){
  return location.origin + location.pathname.replace(/[^/]*$/, "");
}
/* Noget i gang, som ikke maa afbrydes af en genindlaesning? */
function optaget(){
  return !!(S.ark || S.indst || $("v-overlay"));
}
function hentNyVersion(nu){
  location.replace(grundadresse() + "?v=" + encodeURIComponent(nu));
}
function visOpdatering(nu){
  if ($("opdater-bjaelke")) return;
  document.body.insertAdjacentHTML("afterbegin",
    '<div class="opdater" id="opdater-bjaelke"><span>Version ' + esc(nu) + ' er klar.</span>'
    + '<button id="b-opdater">Opdatér nu</button></div>');
  $("b-opdater").onclick = function(){ hentNyVersion(nu); };
}
function tjekOpdatering(tvunget){
  var nu = Date.now(), sidst = Number(laes(K_TJEK)) || 0;
  if (!tvunget && nu - sidst < 20 * 60 * 1000) return Promise.resolve(null);
  skriv(K_TJEK, String(nu));
  return fetch(grundadresse() + "index.html?tjek=" + nu, { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(t){
      if (!t) return null;
      /* Moenstret saettes sammen af stumper, saa det ikke kan finde sig selv i filen */
      var m = t.match(new RegExp("var APP" + "_VERSION = \"([^\"]+)\""));
      if (!m || !erNyere(m[1], APP_VERSION)) return null;
      if (optaget()) visOpdatering(m[1]); else hentNyVersion(m[1]);
      return m[1];
    })
    .catch(function(){ return null; });
}

/* --- Opret eller skift kode --- */
function opsaetKode(){
  var h = '<div class="overlay" id="k-overlay"><div class="panel">'
    + '<h3>Vælg en kode</h3>'
    + '<p class="grafnote" style="margin:-6px 0 0">4 til 8 cifre. Seks er mærkbart sværere at '
    + 'gætte end fire. Koden kan ikke gendannes, hvis du glemmer den — så skal der en ny '
    + 'API-nøgle til.</p>'
    + '<span class="lbl">Kode</span>'
    + '<input id="k-1" type="password" inputmode="numeric" autocomplete="off" placeholder="4–8 cifre">'
    + '<span class="lbl">Gentag koden</span>'
    + '<input id="k-2" type="password" inputmode="numeric" autocomplete="off" placeholder="Samme igen">'
    + '<div id="k-fejl"></div>'
    + '<button class="knap" id="k-gem" style="margin-top:16px">Slå kodelås til</button>'
    + '<button class="knap sek" id="k-luk" style="margin-top:8px">Fortryd</button></div></div>';
  var gl = $("k-overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);
  function luk(){ lukBlodt("k-overlay"); }
  $("k-luk").onclick = luk;
  $("k-overlay").onclick = function(e){ if (e.target.id === "k-overlay") luk(); };
  $("k-gem").onclick = function(){
    var a = $("k-1").value, b = $("k-2").value;
    if (!/^[0-9]{4,8}$/.test(a)){
      $("k-fejl").innerHTML = '<div class="note fejl">Koden skal være 4 til 8 cifre.</div>'; return;
    }
    if (a !== b){
      $("k-fejl").innerHTML = '<div class="note fejl">De to koder er ikke ens.</div>'; return;
    }
    var noegle = aktivNoegle || laes(K_NOEGLE);
    if (!noegle){ $("k-fejl").innerHTML = '<div class="note fejl">Der er ingen API-nøgle at beskytte.</div>'; return; }
    var kn = $("k-gem"); kn.textContent = "Krypterer …"; kn.disabled = true;
    krypter(a, noegle).then(function(pk){
      skriv(K_LAAS, JSON.stringify(pk));
      fjern(K_NOEGLE);                 /* den ukrypterede kopi fjernes */
      aktivNoegle = noegle; aktivKode = a;
      nulstilFejl();
      luk();
      S.indst = false;
      var o = $("ind-overlay"); if (o) o.remove();
      tegn();
      alert("Kodelåsen er slået til. Nøglen ligger nu krypteret.");
    }).catch(function(){
      $("k-fejl").innerHTML = '<div class="note fejl">Krypteringen mislykkedes. Prøv igen.</div>';
      var k = $("k-gem"); if (k){ k.textContent = "Slå kodelås til"; k.disabled = false; }
    });
  };
}
function laasTid(){
  var v = laes(K_LAASTID);
  return v === null ? 5 : Number(v);
}

/* ================= Haendelser ================= */

function skalerFil(file, maks, kvalitet){
  return new Promise(function(ok, fejl){
    var fr = new FileReader();
    fr.onerror = function(){ fejl(new Error("laesefejl")); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ fejl(new Error("billedfejl")); };
      img.onload = function(){
        var s = Math.min(1, maks / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", kvalitet));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

$("fil").onchange = function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  S.ark = { status:"klargoer" }; tegnArk();
  Promise.all([ skalerFil(file, 1100, 0.82), skalerFil(file, 170, 0.6) ]).then(function(r){
    S.ark = { status:"valgt", stor:r[0], lille:r[1], note:"" }; tegnArk();
  }).catch(function(){
    S.ark = { status:"fejl", besked:"Billedet kunne ikke åbnes. Prøv et andet." }; tegnArk();
  });
};

$("importfil").onchange = function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      if (!d || !d.dage) throw new Error("format");
      Object.keys(d.dage).forEach(function(k){
        if (!hentDag(k).length) gemDag(k, (d.dage[k] || []).map(normaliser));
      });
      if (d.maal){ S.maal = d.maal; skriv(K_MAAL, String(d.maal)); }
      if (d.navn && !laes(K_BRUGER)){ S.navn = d.navn; skriv(K_BRUGER, d.navn); }
      if (d.profil) gemProfil(d.profil);
      if (d.vaegte){
        var v = hentVaegte();
        Object.keys(d.vaegte).forEach(function(k){ if (!v[k]) v[k] = d.vaegte[k]; });
        skriv(K_VAEGT, JSON.stringify(v));
      }
      if (d.noegle && !laes(K_NOEGLE) && !harLaas()) skriv(K_NOEGLE, d.noegle);
      if (d.laas && !harLaas() && !laes(K_NOEGLE)) skriv(K_LAAS, JSON.stringify(d.laas));
      S.indst = false;
      var o = $("ind-overlay"); if (o) o.remove();
      tegn();
      alert("Sikkerhedskopien er indlæst.");
    } catch(err){ alert("Filen kunne ikke læses som en sikkerhedskopi."); }
  };
  fr.readAsText(file);
};

var skjultSiden = 0;
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden"){ skjultSiden = Date.now(); return; }
  if (harLaas() && aktivNoegle && skjultSiden){
    var minutter = (Date.now() - skjultSiden) / 60000;
    if (minutter >= laasTid()){ laasNu(); return; }
  }
  var d = dagKey(new Date());
  if (d !== S.iDag){ S.iDag = d; S.valgt = null; tegn(); }
  tjekOpdatering(false);
});

/* Service worker. Den serverer netvaerk foerst, saa appens eget versionstjek
   fungerer uaendret — cachen er kun en noedloesning, naar der ikke er net. */
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

/* Genveje fra hjemmeskaermen: tryk og hold paa ikonet */
function haandterGenvej(){
  var m = location.search.match(/[?&]handling=([a-z]+)/);
  if (!m) return;
  history.replaceState(null, "", location.pathname);
  if (m[1] === "maaltid"){ S.ark = { status:"skriv", tekst:"" }; tegnArk(); }
  if (m[1] === "vaegt"){ S.skaerm = "vaegt"; tegn(); aabnVejning(S.iDag); }
}

/* Naar forbindelsen falder ud, kan dagbogen stadig laeses og udfyldes i haanden */
function visForbindelse(){
  var b = $("offline-bar");
  if (navigator.onLine){ if (b) b.remove(); return; }
  if (b) return;
  document.body.insertAdjacentHTML("afterbegin",
    '<div class="offline" id="offline-bar" role="status" aria-live="polite">'
    + 'Ingen forbindelse — du kan skrive måltider ind i hånden</div>');
}
window.addEventListener("online", visForbindelse);
window.addEventListener("offline", visForbindelse);

migrer();
tagSnap("dagligt", false);
sendTilSky(false);
visForbindelse();
if (!harLaas()) aktivNoegle = laes(K_NOEGLE);
tegn();
haandterGenvej();
tjekOpdatering(false);
</script>
