<style>
:root{
  --papir:#E8E9E3; --kort:#FCFCFA; --blaek:#17211D; --daempet:#6C7873;
  --linje:#D2D5CC; --gron:#1F5D4C; --okker:#B98A1E; --ler:#A8442A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--papir); color:var(--blaek);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.indhold{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0;}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;}
.datolinje{font-size:13px;color:var(--daempet);}
.txtknap{background:none;border:none;padding:0;font:inherit;font-size:13px;
  color:var(--gron);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.hero{margin-top:16px;}
.stortal{font-family:Georgia,"Times New Roman",serif;font-size:64px;line-height:.95;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stortal.over{color:var(--ler);}
.maallinje{margin-top:6px;font-size:14px;color:var(--daempet);}
.baand{height:6px;background:#DADCD3;border-radius:3px;margin:16px 0 14px;overflow:hidden;}
.baand span{display:block;height:100%;background:var(--gron);
  transition:width .45s cubic-bezier(.2,.7,.3,1);}
.baand span.over{background:var(--ler);}
.rest{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--linje);padding-top:12px;margin-top:2px;}
.rest .txt{font-size:13px;color:var(--daempet);}
.rest .num{font-family:Georgia,serif;font-size:27px;font-variant-numeric:tabular-nums;}
.rest .num.over{color:var(--ler);}
.makro{display:flex;gap:22px;font-size:13px;color:var(--daempet);
  border-top:1px solid var(--linje);padding-top:12px;}
.makro b{font-weight:600;color:var(--blaek);font-variant-numeric:tabular-nums;}
h2.sek{font-size:13px;font-weight:600;color:var(--daempet);margin:26px 0 10px;}
.post{display:flex;gap:12px;align-items:center;background:var(--kort);
  border:1px solid var(--linje);border-radius:12px;padding:10px;margin-bottom:8px;}
.post img,.post .tom-foto{width:52px;height:52px;border-radius:8px;flex:none;
  object-fit:cover;background:#DDE0D8;}
.post .txt{flex:1;min-width:0;}
.post .navn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .meta{font-size:12.5px;color:var(--daempet);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .kcal{font-family:Georgia,serif;font-size:19px;font-variant-numeric:tabular-nums;}
.xknap{background:none;border:none;color:var(--daempet);font-size:22px;line-height:1;
  padding:4px 2px 4px 10px;cursor:pointer;}
.tom{border:1px dashed var(--linje);border-radius:12px;padding:22px 18px;
  color:var(--daempet);font-size:14px;}
.fodnote{font-size:12px;color:var(--daempet);margin:22px 2px 0;line-height:1.5;}
.bund{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--papir) 66%,rgba(232,233,227,0));}
.bundindhold{max-width:520px;margin:0 auto;display:flex;gap:8px;}
button.knap.smal{flex:none;width:122px;}
button.knap{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;
  font-size:16px;font-weight:600;background:var(--gron);color:#F4F6F2;cursor:pointer;}
button.knap:disabled{opacity:.45;}
button.knap.sek{background:none;color:var(--blaek);border:1px solid var(--linje);font-weight:500;}
button.knap.fare{background:none;color:var(--ler);border:1px solid var(--linje);font-weight:500;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;background:var(--kort);
  border:1px solid var(--linje);border-radius:10px;padding:11px 12px;color:var(--blaek);}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gron);outline-offset:2px;}
.lbl{display:block;font-size:12.5px;color:var(--daempet);margin:14px 0 5px;}
.gitter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(23,33,29,.42);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;}
.panel{background:var(--papir);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;}
.panel h3{margin:0 0 14px;font-size:17px;}
.foto{width:100%;border-radius:12px;display:block;background:#DDE0D8;}
.foto.venter{animation:aande 1.5s ease-in-out infinite;}

<body>

<div id="rod"></div>
<input type="file" id="fil" accept="image/*" capture="environment" class="skjul">
<input type="file" id="importfil" accept="application/json,.json" class="skjul">

<script>
"use strict";

var APP_VERSION = "14.0";
var SKEMA = 4;

var KATEGORIER = ["Kød & fisk","Grønt & salat","Brød & korn","Kartofler, ris & pasta",
  "Mejeri & æg","Snacks & slik","Kage & bagværk","Fastfood & takeaway",
  "Drikkevarer","Alkohol","Andet"];

/* ================= Lager ================= */

var P_DAG = "kd:dag:", K_NOEGLE = "kd:noegle", K_MAAL = "kd:maal",
    K_MODEL = "kd:model", K_SKEMA = "kd:skema", K_FORSLAG = "kd:forslag",
    K_BRUGER = "kd:navn", K_KAEK = "kd:kaek",
    K_PROFIL = "kd:profil", K_VAEGT = "kd:vaegte", K_TJEK = "kd:sidste-tjek",
    K_LAAS = "kd:laas", K_LAASTID = "kd:laastid", K_FEJL = "kd:fejl",
    K_FORBRUG = "kd:forbrug", K_SPISE = "kd:spiseforslag", K_TILSKUD = "kd:tilskud", P_OPSKRIFT = "kd:opskrift:", K_UNSPLASH = "kd:unsplash";
var reserve = {};

function laes(k){
  try { var v = localStorage.getItem(k); return v === null ? (k in reserve ? reserve[k] : null) : v; }
  catch(e){ return k in reserve ? reserve[k] : null; }
}
function skriv(k, v){
  try { localStorage.setItem(k, v); return "ok"; }
  catch(e){
    if (e && (e.name === "QuotaExceededError" || e.code === 22 || /quota/i.test(String(e)))) return "fuld";
    reserve[k] = v; return "reserve";
  }
}
function fjern(k){ try { localStorage.removeItem(k); } catch(e){} delete reserve[k]; }
function alleNoegler(){
  var ud = [];
  try { for (var i = 0; i < localStorage.length; i++) ud.push(localStorage.key(i)); } catch(e){}
  for (var k in reserve) if (ud.indexOf(k) < 0) ud.push(k);
  return ud;
}
function dagNoegler(){
  return alleNoegler().filter(function(k){ return k.indexOf(P_DAG) === 0; }).sort();
}
function normaliser(p, i){
  p = p && typeof p === "object" ? p : {};
  return {
    id: String(p.id != null ? p.id : "gl" + i),
    tid: typeof p.tid === "string" ? p.tid : "",
    navn: typeof p.navn === "string" && p.navn ? p.navn : "Måltid",
    portion: typeof p.portion === "string" ? p.portion : "",
    kommentar: typeof p.kommentar === "string" ? p.kommentar : "",
    genstande: Number(p.genstande) || 0,
    kategori: KATEGORIER.indexOf(p.kategori) >= 0 ? p.kategori : "Andet",
    kalorier: Number(p.kalorier) || 0,
    protein_g: Number(p.protein_g) || 0,
    kulhydrat_g: Number(p.kulhydrat_g) || 0,
    fedt_g: Number(p.fedt_g) || 0,
    billede: typeof p.billede === "string" ? p.billede : null
  };
}
function hentDag(noegle){
  var r;
  try { r = JSON.parse(laes(P_DAG + noegle) || "[]"); } catch(e){ return []; }
  return Array.isArray(r) ? r.map(normaliser) : [];
}
function frigoerPlads(){
  var dage = dagNoegler();
  for (var i = 0; i < Math.max(0, dage.length - 7); i++){
    var poster;
    try { poster = JSON.parse(laes(dage[i]) || "[]"); } catch(e){ continue; }
    if (Array.isArray(poster) && poster.some(function(p){ return p && p.billede; })){
      poster.forEach(function(p){ if (p) delete p.billede; });
      skriv(dage[i], JSON.stringify(poster));
      return true;
    }
  }
  return false;
}
function gemDag(noegle, poster){
  var svar = skriv(P_DAG + noegle, JSON.stringify(poster)), n = 0;
  while (svar === "fuld" && n++ < 60 && frigoerPlads()) svar = skriv(P_DAG + noegle, JSON.stringify(poster));
  if (svar === "fuld"){
    skriv(P_DAG + noegle, JSON.stringify(poster.map(function(p){
      var k = Object.assign({}, p); delete k.billede; return k;
    })));
  }
}
function migrer(){
  var fra = Number(laes(K_SKEMA)) || 1;
  if (fra < 4){
    dagNoegler().forEach(function(k){
      var n = k.slice(P_DAG.length);
      gemDag(n, hentDag(n));     /* faar bl.a. kategori paa gamle poster */
    });
  }
  if (fra !== SKEMA) skriv(K_SKEMA, String(SKEMA));
}

/* ================= Kodelaas =================
   Koden er ikke et gardin foran skaermen: API-noeglen bliver krypteret med den
   (PBKDF2 + AES-GCM), og uden koden ligger den ikke laesbart nogen steder paa
   telefonen. Selve dagbogen staar derimod ukrypteret — se noten i indstillinger. */

var ITERATIONER = 310000;
var aktivNoegle = null;   /* kun i hukommelsen, forsvinder ved genindlaesning */
var aktivKode = null;

function b64(buf){
  var u = new Uint8Array(buf), s = "";
  for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}
function fraB64(t){ return Uint8Array.from(atob(t), function(c){ return c.charCodeAt(0); }); }

function afledNoegle(kode, salt){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(kode), "PBKDF2", false, ["deriveKey"])
    .then(function(basis){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:ITERATIONER, hash:"SHA-256" },
        basis, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
    });
}
function krypter(kode, klartekst){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return afledNoegle(kode, salt).then(function(n){
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, n, new TextEncoder().encode(klartekst));
  }).then(function(ct){
    return { salt:b64(salt), iv:b64(iv), ct:b64(ct), iter:ITERATIONER };
  });
}
function dekrypter(kode, pakke){
  return afledNoegle(kode, fraB64(pakke.salt)).then(function(n){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:fraB64(pakke.iv) }, n, fraB64(pakke.ct));
  }).then(function(buf){ return new TextDecoder().decode(buf); });
}
function laasPakke(){
  try { return JSON.parse(laes(K_LAAS) || "null"); } catch(e){ return null; }
}
function harLaas(){ return !!laasPakke(); }

/* Ventetid efter gentagne fejlforsoeg — bremser den, der proever sig frem */
function fejlstand(){
  try { return JSON.parse(laes(K_FEJL) || '{"antal":0,"indtil":0}'); }
  catch(e){ return { antal:0, indtil:0 }; }
}
function noterFejl(){
  var f = fejlstand();
  f.antal++;
  if (f.antal >= 5) f.indtil = Date.now() + Math.min(15 * 60000, Math.pow(2, f.antal - 5) * 30000);
  skriv(K_FEJL, JSON.stringify(f));
  return f;
}
function nulstilFejl(){ fjern(K_FEJL); }
function spaerretI(){
  var f = fejlstand();
  return Math.max(0, Math.ceil((f.indtil - Date.now()) / 1000));
}
function laasNu(){
  aktivNoegle = null; aktivKode = null;
  S.ark = null; S.indst = false;
  ["overlay","ind-overlay","v-overlay"].forEach(function(i){ var o = $(i); if (o) o.remove(); });
  tegn();
}

/* ================= Datoer ================= */

function dagKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function tilDato(n){ var d = n.split("-").map(Number); return new Date(d[0], d[1]-1, d[2]); }
function langDato(n){ return tilDato(n).toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"}); }
function kortDato(n){ return tilDato(n).toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short"}); }
function tal(n){ return Math.round(n || 0).toLocaleString("da-DK"); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function $(id){ return document.getElementById(id); }
function mandag(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return t;
}
function ugeNr(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3);
  var jan4 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
}

/* ================= Tilstand ================= */

var S = {
  iDag: dagKey(new Date()),
  maal: Number(laes(K_MAAL)) || 2000,
  model: laes(K_MODEL) || "claude-sonnet-5",
  navn: laes(K_BRUGER) || "",
  profil: (function(){ try { return JSON.parse(laes(K_PROFIL) || "{}") || {}; } catch(e){ return {}; } })(),
  kaek: laes(K_KAEK) !== "0",
  skaerm: "idag",
  periode: "dag",
  vindue: 30,
  valgt: null,
  ark: null,
  indst: false,
  forslag: null,
  forslagStatus: "tom",
  spise: null,
  spiseStatus: "tom",
  aabenRet: null,
  opskrifter: {},
  tilskud: null,
  tilskudStatus: "tom"
};

/* ================= Historik ================= */

function dagSum(noegle){
  return hentDag(noegle).reduce(function(a,p){ return a + p.kalorier; }, 0);
}
function dageMedData(){
  return dagNoegler().map(function(k){ return k.slice(P_DAG.length); })
    .filter(function(n){ return hentDag(n).length; });
}
function byggPerioder(type){
  var dage = dageMedData();
  if (!dage.length) return [];
  var foerste = tilDato(dage[0]), idag = tilDato(S.iDag), ud = [];

  if (type === "dag"){
    var start = new Date(idag); start.setDate(start.getDate() - 29);
    if (start < foerste) start = new Date(foerste);
    for (var d = new Date(start); d <= idag; d.setDate(d.getDate() + 1)){
      var n = dagKey(d), s = dagSum(n), har = hentDag(n).length > 0;
      ud.push({ id:n, titel:kortDato(n), under:"", total:s, snit:s, antal:har?1:0, dage:har?[n]:[] });
    }
  } else if (type === "uge"){
    var u = mandag(idag); u.setDate(u.getDate() - 7 * 11);
    var fm = mandag(foerste); if (u < fm) u = fm;
    for (var w = new Date(u); w <= idag; w.setDate(w.getDate() + 7)){
      var med = [], sum = 0;
      for (var i = 0; i < 7; i++){
        var dd = new Date(w); dd.setDate(dd.getDate() + i);
        if (dd > idag) break;
        var nk = dagKey(dd);
        if (hentDag(nk).length){ med.push(nk); sum += dagSum(nk); }
      }
      var slut = new Date(w); slut.setDate(slut.getDate() + 6);
      ud.push({
        id: "u" + dagKey(w), titel: "Uge " + ugeNr(w),
        under: w.toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + " – "
             + slut.toLocaleDateString("da-DK",{day:"numeric",month:"short"}),
        total: sum, snit: med.length ? sum / med.length : 0, antal: med.length, dage: med
      });
    }
  } else {
    var m = new Date(idag.getFullYear(), idag.getMonth() - 11, 1);
    var fmn = new Date(foerste.getFullYear(), foerste.getMonth(), 1);
    if (m < fmn) m = fmn;
    for (var mm = new Date(m); mm <= idag; mm.setMonth(mm.getMonth() + 1)){
      var praefiks = mm.getFullYear() + "-" + String(mm.getMonth()+1).padStart(2,"0");
      var mdage = dage.filter(function(n){ return n.indexOf(praefiks) === 0; });
      var msum = mdage.reduce(function(a,n){ return a + dagSum(n); }, 0);
      ud.push({
        id: "m" + praefiks,
        titel: mm.toLocaleDateString("da-DK",{month:"long",year:"numeric"}),
        under: "", total: msum, snit: mdage.length ? msum / mdage.length : 0,
        antal: mdage.length, dage: mdage
      });
    }
  }
  return ud;
}
function graf(perioder){
  var B = 340, H = 150, top = 10, bund = 24, hoejde = H - top - bund;
  var maks = Math.max(S.maal || 0, 1);
  perioder.forEach(function(p){ if (p.snit > maks) maks = p.snit; });
  maks *= 1.1;
  var n = perioder.length, plads = B / n, bredde = Math.max(3, Math.min(26, plads * 0.62));
  var s = '<svg class="graf" viewBox="0 0 ' + B + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kalorier pr. dag i snit">';
  if (S.maal > 0){
    var y = top + hoejde - (S.maal / maks) * hoejde;
    s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + B + '" y2="' + y.toFixed(1)
       + '" stroke="#A9B0AA" stroke-width="1" stroke-dasharray="3 3"/>'
       + '<text x="' + B + '" y="' + (y - 4).toFixed(1) + '" text-anchor="end" font-size="9" fill="#6C7873">mål</text>';
  }
  perioder.forEach(function(p, i){
    var h = p.snit > 0 ? Math.max(2, (p.snit / maks) * hoejde) : 0;
    var x = i * plads + (plads - bredde) / 2, y2 = top + hoejde - h;
    var valgt = S.valgt === p.id;
    if (h > 0){
      s += '<rect x="' + x.toFixed(1) + '" y="' + y2.toFixed(1) + '" width="' + bredde.toFixed(1)
         + '" height="' + h.toFixed(1) + '" rx="2" fill="' + (valgt ? "#17211D" : "#1F5D4C") + '"/>';
    } else {
      s += '<rect x="' + x.toFixed(1) + '" y="' + (top + hoejde - 2) + '" width="' + bredde.toFixed(1)
         + '" height="2" rx="1" fill="#CDD1C8"/>';
    }
    var hvert = n > 16 ? 5 : (n > 8 ? 2 : 1);
    if (i % hvert === 0 || i === n - 1){
      var mrk = S.periode === "dag" ? tilDato(p.id).getDate()
              : (S.periode === "uge" ? ugeNr(tilDato(p.id.slice(1))) : p.titel.slice(0,3));
      s += '<text x="' + (x + bredde/2).toFixed(1) + '" y="' + (H - 8)
         + '" text-anchor="middle" font-size="9" fill="#6C7873">' + mrk + '</text>';
    }
  });
  return s + '</svg>';
}

/* ================= Vaegt og profil ================= */

var AKTIVITET = [
  ["1.2",   "Stillesiddende"],

function hentVaegte(){

  catch(e){ return {}; }
}
function vaegtListe(){

  return Object.keys(v).sort()
    .map(function(d){ return { dag:d, kg:Number(v[d]) || 0 }; })
    .filter(function(x){ return x.kg > 0; });
}
function gemVaegt(dag, kg){

/* Mifflin-St Jeor. Uden koen, hoejde eller alder giver den ingenting —
   den gaetter hellere ingenting end noget forkert. */
function kropstal(){
  var p = S.profil, liste = vaegtListe();
  var nu = liste.length ? liste[liste.length - 1].kg : 0;
  var foerste = liste.length ? liste[0] : null;
  var hoejde = Number(p.hoejde) || 0, alder = Number(p.alder) || 0;
  var bmi = (nu > 0 && hoejde > 0) ? nu / Math.pow(hoejde / 100, 2) : 0;
  var bmr = 0, tdee = 0;
  if (nu > 0 && hoejde > 0 && alder > 0 && (p.koen === "mand" || p.koen === "kvinde")){
    bmr = 10 * nu + 6.25 * hoejde - 5 * alder + (p.koen === "mand" ? 5 : -161);
    tdee = bmr * (Number(p.aktivitet) || 1.375);
  }
  var maal = Number(p.maalvaegt) || 0;
  return {
    liste: liste, nu: nu, foerste: foerste, bmi: bmi, bmr: bmr, tdee: tdee, maalvaegt: maal,
    tilMaal: (nu > 0 && maal > 0) ? nu - maal : null,
    aendring: (foerste && nu > 0) ? nu - foerste.kg : null,
    maalBmi: (maal > 0 && hoejde > 0) ? maal / Math.pow(hoejde / 100, 2) : 0
  };
}

/* Linjegraf over vaegten. X foelger den faktiske kalender, saa et hul
   paa tre uger ogsaa ser ud som tre uger. */
function vaegtgraf(liste, maalvaegt){
  var B = 340, H = 168, top = 12, bund = 22, venstre = 4, hoejre = 34;
  var bredde = B - venstre - hoejre, hoejdeP = H - top - bund;
  var vaerdier = liste.map(function(x){ return x.kg; });
  if (maalvaegt > 0) vaerdier = vaerdier.concat([maalvaegt]);
  var min = Math.min.apply(null, vaerdier), maks = Math.max.apply(null, vaerdier);
  var luft = Math.max(0.6, (maks - min) * 0.18);
  min -= luft; maks += luft;
  var t0 = tilDato(liste[0].dag).getTime();
  var t1 = tilDato(liste[liste.length - 1].dag).getTime();
  var spand = Math.max(1, t1 - t0);
  function X(d){ return venstre + (liste.length < 2 ? bredde / 2 : (tilDato(d).getTime() - t0) / spand * bredde); }
  function Y(kg){ return top + hoejdeP - (kg - min) / (maks - min) * hoejdeP; }

  var s = '<svg class="graf" viewBox="0 0 ' + B + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Vaegtudvikling">';
  if (maalvaegt > 0){
    var ym = Y(maalvaegt);
    s += '<line x1="' + venstre + '" y1="' + ym.toFixed(1) + '" x2="' + (venstre + bredde)
       + '" y2="' + ym.toFixed(1) + '" stroke="#B98A1E" stroke-width="1" stroke-dasharray="4 3"/>'
       + '<text x="' + (B - 2) + '" y="' + (ym + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="#B98A1E">mål</text>';
  }
  var punkter = liste.map(function(x){ return X(x.dag).toFixed(1) + "," + Y(x.kg).toFixed(1); });
  if (liste.length > 1){
    s += '<polyline points="' + punkter.join(" ") + '" fill="none" stroke="#1F5D4C" '
       + 'stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  liste.forEach(function(x, i){
    var sidste = i === liste.length - 1;
    s += '<circle cx="' + X(x.dag).toFixed(1) + '" cy="' + Y(x.kg).toFixed(1) + '" r="'
       + (sidste ? 4 : 2.4) + '" fill="' + (sidste ? "#17211D" : "#1F5D4C") + '"/>';
  });
  var sid = liste[liste.length - 1];
  s += '<text x="' + (B - 2) + '" y="' + (Y(sid.kg) - 9).toFixed(1) + '" text-anchor="end" '
     + 'font-size="10" fill="#17211D">' + kg(sid.kg) + '</text>'
     + '<text x="' + venstre + '" y="' + (H - 6) + '" font-size="9" fill="#6C7873">'
     + tilDato(liste[0].dag).toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + '</text>';
  if (liste.length > 1){
    s += '<text x="' + (venstre + bredde) + '" y="' + (H - 6) + '" text-anchor="end" font-size="9" fill="#6C7873">'
       + tilDato(sid.dag).toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + '</text>';
  }
  return s + '</svg>';
}
function kg(n){ return (Math.round(n * 10) / 10).toLocaleString("da-DK", {minimumFractionDigits:1, maximumFractionDigits:1}); }
function laesKomma(v){ return Number(String(v || "").replace(",", ".").trim()) || 0; }

/* ================= Trends ================= */

/* Alle poster i de seneste N dage, med dagen haeftet paa */
function posterIVindue(dage, forskyd){
  forskyd = forskyd || 0;
  var slut = tilDato(S.iDag); slut.setDate(slut.getDate() - forskyd);
  var start = new Date(slut); start.setDate(start.getDate() - (dage - 1));
  var ud = [];
  dageMedData().forEach(function(n){
    var d = tilDato(n);
    if (d >= start && d <= slut) hentDag(n).forEach(function(p){ ud.push({ dag:n, post:p }); });
  });
  return ud;
}
function analyseAfVindue(dage){
  var raekker = posterIVindue(dage);
  var poster = raekker.map(function(r){ return r.post; });
  var ialt = poster.reduce(function(a,p){ return a + p.kalorier; }, 0);
  var dageMed = {};
  raekker.forEach(function(r){ dageMed[r.dag] = 1; });
  var antalDage = Object.keys(dageMed).length;

  /* kategorier */
  var kat = {};
  poster.forEach(function(p){
    kat[p.kategori] = kat[p.kategori] || { navn:p.kategori, kcal:0, antal:0 };
    kat[p.kategori].kcal += p.kalorier;
    kat[p.kategori].antal++;
  });
  var kategorier = Object.keys(kat).map(function(k){ return kat[k]; })
    .sort(function(a,b){ return b.kcal - a.kcal; });

  /* gengangere: samme navn flere gange */
  var g = {};
  poster.forEach(function(p){
    var n = p.navn.toLowerCase().trim();
    g[n] = g[n] || { navn:p.navn, antal:0, kcal:0 };
    g[n].antal++; g[n].kcal += p.kalorier;
  });
  var gengangere = Object.keys(g).map(function(k){ return g[k]; })
    .filter(function(x){ return x.antal >= 2; })
    .sort(function(a,b){ return b.kcal - a.kcal; });

  /* hoejdespringere: enkeltmaaltider langt over dit eget normalniveau */
  var snitPost = poster.length ? ialt / poster.length : 0;
  var varians = poster.length
    ? poster.reduce(function(a,p){ return a + Math.pow(p.kalorier - snitPost, 2); }, 0) / poster.length : 0;
  var spred = Math.sqrt(varians);
  var graense = snitPost + 1.2 * spred;
  /* kun een raekke pr. ret — gaar den igen, hoerer den hjemme under Gengangere */
  var set = {}, toppe = [];
  raekker.slice().sort(function(a,b){ return b.post.kalorier - a.post.kalorier; })
    .forEach(function(r){
      var n = r.post.navn.toLowerCase().trim();
      if (set[n] || toppe.length >= 5) return;
      set[n] = 1;
      toppe.push({ navn:r.post.navn, kcal:r.post.kalorier, dag:r.dag,
                   kategori:r.post.kategori, ekstrem: spred > 0 && r.post.kalorier > graense });
    });

  /* retning: dette vindue mod det foregaaende af samme laengde */
  var tidl = posterIVindue(dage, dage);
  var tdage = {}; tidl.forEach(function(r){ tdage[r.dag] = 1; });
  var tAntal = Object.keys(tdage).length;
  var tIalt = tidl.reduce(function(a,r){ return a + r.post.kalorier; }, 0);
  var snitNu = antalDage ? ialt / antalDage : 0;
  var snitFoer = tAntal ? tIalt / tAntal : 0;
  var aendring = snitFoer > 0 ? (snitNu - snitFoer) / snitFoer * 100 : null;

  return { poster:poster, ialt:ialt, antalDage:antalDage, snit:snitNu,
           kategorier:kategorier, gengangere:gengangere, toppe:toppe,
           aendring:aendring, snitFoer:snitFoer };
}

/* Hvad er der spist indtil nu i dag — bruges som kontekst for vurderingen */
function budgetTekst(spist, efter){
  var rest = S.maal - efter;
  return '<b>' + tal(efter) + '</b> af ' + tal(S.maal) + ' kcal i dag'
    + '<div class="rest' + (rest < 0 ? " over" : "") + '">'
    + (rest >= 0 ? tal(rest) + ' kcal tilbage efter dette måltid'
                 : tal(-rest) + ' kcal over målet')
    + '</div>';
}
function dagsbudget(){
  var spist = hentDag(S.iDag).reduce(function(a,p){ return a + p.kalorier; }, 0);
  return { spist:spist, maal:S.maal, tilbage:S.maal - spist };
}

/* Taeller kald pr. maaned, saa et uventet spring kan ses uden at logge ind i konsollen */
function tael(){
  var m = S.iDag.slice(0, 7), f;
  try { f = JSON.parse(laes(K_FORBRUG) || "{}"); } catch(e){ f = {}; }
  f[m] = (f[m] || 0) + 1;
  Object.keys(f).sort().slice(0, -6).forEach(function(k){ delete f[k]; });
  skriv(K_FORBRUG, JSON.stringify(f));
}
function forbrugDenneMaaned(){
  try { return (JSON.parse(laes(K_FORBRUG) || "{}"))[S.iDag.slice(0, 7)] || 0; }
  catch(e){ return 0; }
}

function kald(krop){
  tael();
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": aktivNoegle || laes(K_NOEGLE) || "",
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(krop)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){
      if (!r.ok){
        var m = (data.error && data.error.message) || "";
        if (r.status === 401 || r.status === 403) throw new Error("Nøglen blev afvist. Ret den under Indstillinger.");
        if (r.status === 400 && /credit|balance/i.test(m)) throw new Error("Der er ikke mere kredit på API-kontoen. Fyld op på console.anthropic.com.");
        if (r.status === 429) throw new Error("For mange kald lige nu. Vent et minut og prøv igen.");
        if (r.status >= 500) throw new Error("Serveren svarede ikke. Prøv igen om lidt.");
        throw new Error(m || ("Fejl " + r.status));
      }
      var tekst = (data.content || []).map(function(b){ return b.type === "text" ? b.text : ""; }).join("");
      var a = tekst.indexOf("{"), b = tekst.lastIndexOf("}");
      if (a < 0 || b < 0) throw new Error("Svaret kunne ikke læses. Prøv igen.");
      return JSON.parse(tekst.slice(a, b + 1));
    });
  });
}

  return kald({ model:S.model, max_tokens:900, messages:[{ role:"user", content:p }] });
}

/* Opskrift til et forslag. Hentes foerst naar kortet aabnes, og gemmes bagefter. */
function opskriftNoegle(ret){

}
function hentOpskrift(ret, kcal){

    + 'Almindelige danske ingredienser fra et supermarked, ingen specialbutikker. '

    + 'hovedingrediensen, ikke en lang beskrivelse. Er retten saerligt dansk, saa brug det danske '
    + 'navn, hvis det er kendt, ellers hovedingrediensen paa engelsk.\n\n'

    + '"kcal_pr_portion": heltal, "kategori": "en af kategorierne", "billedsoeg": "engelske soegeord", '

    + '"tip": "et kort tip, max 18 ord"}';
  return kald({ model:S.model, max_tokens:1200, messages:[{ role:"user", content:p }] });
}

/* Billeder. Unsplash foerst, Wikimedia Commons som reserve, ellers en pæn tom plads.
   Unsplashs retningslinjer kraever tre ting, som alle er med herunder: at billedet
   hotlinkes fra deres egne URL'er, at fotografen krediteres med link og utm-parametre,
   og at download-endepunktet kaldes, naar billedet tages i brug. */
var UNSPLASH_STANDARD = "AKpIiZFYDYL7V_EvC6Jd6DVI1aFutfIhq6KkOYeu7mQ";
var UTM = "?utm_source=kaloriedagbog&utm_medium=referral";

function unsplashNoegle(){ return laes(K_UNSPLASH) || UNSPLASH_STANDARD; }

function hentFraUnsplash(soeg){
  var n = unsplashNoegle();
  if (!n) return Promise.resolve(null);
  var u = "https://api.unsplash.com/search/photos?per_page=1&orientation=landscape&content_filter=high"
    + "&query=" + encodeURIComponent(soeg) + "&client_id=" + encodeURIComponent(n);
  return fetch(u).then(function(r){
    if (!r.ok) return null;
    return r.json();
  }).then(function(d){
    var f = d && d.results && d.results[0];
    if (!f) return null;
    /* Paakraevet haendelseskald — taeller kun statistik, henter ikke billedet */
    if (f.links && f.links.download_location){
      fetch(f.links.download_location + "&client_id=" + encodeURIComponent(n)).catch(function(){});
    }
    return {
      url: (f.urls && (f.urls.regular || f.urls.small)) || null,
      fotograf: (f.user && f.user.name) || "Ukendt",
      profil: (f.user && f.user.links && f.user.links.html) || "https://unsplash.com",
      kilde: "unsplash"
    };
  }).catch(function(){ return null; });
}

function hentFraCommons(soeg){
  var u = "https://commons.wikimedia.org/w/api.php?action=query&generator=search"
    + "&gsrnamespace=6&gsrlimit=1&gsrsearch=" + encodeURIComponent("filetype:bitmap " + soeg)
    + "&prop=imageinfo&iiprop=url&iiurlwidth=760&format=json&origin=*";
  return fetch(u).then(function(r){ return r.json(); }).then(function(d){
    var sider = (d && d.query && d.query.pages) || {};
    var f = Object.keys(sider).map(function(k){ return sider[k]; })[0];
    var ii = f && f.imageinfo && f.imageinfo[0];
    if (!ii) return null;
    return { url: ii.thumburl || ii.url, titel: (f.title || "").replace(/^File:/, ""), kilde:"commons" };
  }).catch(function(){ return null; });
}

function hentBillede(soeg, reserve){
  return hentFraUnsplash(soeg).then(function(b){
    if (b && b.url) return b;
    return hentFraCommons(reserve || soeg);
  }).catch(function(){ return null; });
}

function billedKredit(b){
  if (!b) return "";
  if (b.kilde === "unsplash"){
    return 'Foto: <a href="' + esc(b.profil) + UTM + '" target="_blank" rel="noopener">'
      + esc(b.fotograf) + '</a> på <a href="https://unsplash.com' + UTM
      + '" target="_blank" rel="noopener">Unsplash</a>';
  }
  return 'Foto: ' + esc(b.titel) + ' · Wikimedia Commons';
}

/* Vurdering af kosten over tid og eventuelle tilskud. Bygger paa hvad der er

    + 'Om personen: ' + profiltekst() + '.\n'

    + 'en grov kategori pr. maaltid. Den indeholder INGEN maalinger af vitaminer eller mineraler. '
    + 'Du kan derfor kun tale om moenstre — at der sjaeldent registreres fisk, eller at groent '
    + 'fylder lidt — og aldrig konstatere en mangel. Kun en blodproeve hos laegen kan det. '
    + 'Sig det tydeligt, og vaer mere forbeholden jo faerre dage der er registreret: '
    + 'under 14 dage er et loest indtryk, over 60 dage er et rimeligt billede.\n\n'
    + 'Mad foerst, tilskud bagefter: peg paa hvad der kan spises i stedet, og naevn kun tilskud '
    + 'hvor det er relevant. Hold dig inden for de officielle danske anbefalinger og foreslaa '
    + 'aldrig hoeje doser. D-vitamin i vinterhalvaaret gaelder alle voksne uanset hvad der staar '

    + '"mad": "hvad der kan spises i stedet, max 16 ord", '
    + '"tilskud": "tilskudsraad hvis relevant, ellers tom tekst, max 16 ord"}]}';

  return kald({ model:S.model, max_tokens:1000, messages:[{ role:"user", content:p }] });
}

/* Forslag til lettere alternativer. Tonen er kaek, men gaar altid paa maden
   og aldrig paa personen — det er skrevet ind i selve instruktionen. */
function hentForslag(a){
  var emner = a.toppe.slice(0,4).map(function(t){
    return "- " + t.navn + " (" + Math.round(t.kcal) + " kcal, kategori " + t.kategori + ")";
  }).concat(a.gengangere.slice(0,3).map(function(g){
    return "- " + g.navn + " (" + g.antal + " gange, " + Math.round(g.kcal) + " kcal i alt)";
  })).join("\n");

  var p = 'Du skriver til ' + (S.navn || "brugeren") + 's kaloriedagbog. Her er de poster, der fylder mest '
    + 'i de seneste ' + S.vindue + ' dage:\n' + emner + '\n\n'
    + 'Snit pr. dag: ' + Math.round(a.snit) + ' kcal. Dagligt maal: ' + S.maal + ' kcal.\n\n'
    + 'Giv 3-4 konkrete, lettere alternativer til de tungeste poster. Alternativerne skal vaere '
    + 'realistisk dansk hverdagsmad, ikke asketiske. Anslaa hvor mange kalorier der spares.\n\n'
    + tone() + '\n\n'
    + 'Alternativerne er tilbud, ikke domme.\n\n'
    + 'Svar udelukkende med JSON, uden markdown:\n'
    + '{"overskrift": "en kaek linje paa max 14 ord til ' + (S.navn || "brugeren") + ' om hvad der fylder", '
    + '"forslag": [{"fra": "retten der er tung", "til": "det lettere alternativ", '
    + '"spar": heltal kalorier sparet, "kommentar": "kaek bemaerkning paa max 20 ord"}]}';

  return kald({ model:S.model, max_tokens:900, messages:[{ role:"user", content:p }] });
}

/* Tonen. Drillerierne maa gaa paa personen og hans vaner — det er hele pointen —
   men krop, vaegt og udseende er holdt udenfor, og mad bliver aldrig kaldt synd.
   Et vaerktoej man aabner hver dag maa gerne vaere fraekt, ikke nedgoerende. */
function tone(){
  var n = S.navn || "brugeren";
  return 'TONE: kaek, toer dansk hverdagshumor. Korte saetninger, gerne et billedligt sidespring. '
    + 'Du taler til ' + n + ' og bruger navnet. Du maa gerne drille ' + n + ' personligt: '
    + 'vaner, udflugter, optimistiske portionsvurderinger, gode intentioner der ikke holdt en uge, '
    + 'og de forklaringer folk giver sig selv klokken 23. Vaer frisk, ikke hoeflig.\n'
    + 'GRAENSER: ingen bemaerkninger om krop, vaegt, figur eller udseende. Ingen skam over hvad '
    + 'der er spist, og ingen mad kaldes synd, forbudt eller daarlig. Der drilles vaner og valg, '
    + 'aldrig hvordan nogen ser ud. Ingen loeftede pegefingre og ingen sundhedspraediken.';
}

/* De officielle danske kostraad og Sundhedsstyrelsens tilskudsanbefalinger.
   Samlet et sted, saa baade maaltidsforslag og tilskudsvurdering hviler paa
   samme grundlag i stedet for at improvisere. */
function kostgrundlag(){
  return 'GRUNDLAG — De officielle Kostraad (Foedevarestyrelsen): spis planterigt, varieret og '
    + 'ikke for meget. 600 g frugt og groent om dagen, heraf mindst halvdelen groentsager. '
    + '350 g fisk om ugen, gerne halvdelen fed fisk. Hoejst 350 g tilberedt oksekoed, lammekoed '
    + 'og svinekoed om ugen. 75 g fuldkorn om dagen. Vaelg planteolier og magre mejeriprodukter. '
    + 'Spis mindre af det soede, salte og fede. Sluk toersten i vand, hoejst en halv liter '
    + 'sodavand eller saft om ugen.\n'
    + 'Sundhedsstyrelsen og Foedevarestyrelsen anbefaler desuden 5-10 mikrogram D-vitamin dagligt '
    + 'til alle voksne fra oktober til april, 10 mikrogram hele aaret til personer med moerk hud, '
    + 'gravide og ammende samt folk der sjaeldent kommer udendoers, og 20 mikrogram plus 800-1000 mg '
    + 'calcium hele aaret til personer over 70 aar. Den oevre sikre graense for voksne er 100 mikrogram.';
}
function profiltekst(){
  var p = S.profil, d = [];
  if (p.alder) d.push(p.alder + " aar");
  if (p.koen) d.push(p.koen);
  if (p.hoejde) d.push(p.hoejde + " cm");
  var k = kropstal();
  if (k.nu) d.push(kg(k.nu) + " kg");
  if (k.maalvaegt) d.push("maalvaegt " + kg(k.maalvaegt) + " kg");
  d.push(p.hensigt === "holde" ? "vil holde vaegten stabil" : "vil tabe sig");
  return d.join(", ");
}

/* ================= Skaerme ================= */

/* --- I dag --- */
function tegnHoved(){
  var poster = hentDag(S.iDag);
  var sum = poster.reduce(function(a,p){
    return { kcal:a.kcal+p.kalorier, pro:a.pro+p.protein_g, kul:a.kul+p.kulhydrat_g, fedt:a.fedt+p.fedt_g };
  }, {kcal:0,pro:0,kul:0,fedt:0});
  var gen = poster.reduce(function(a,p){ return a + p.genstande; }, 0);
  var over = S.maal > 0 && sum.kcal > S.maal;
  var pct = S.maal > 0 ? Math.min(100, sum.kcal / S.maal * 100) : 0;

  var h = '<div class="indhold">' + hoved(langDato(S.iDag))
    + '<div class="hero"><div class="stortal' + (over ? " over" : "") + '">' + tal(sum.kcal) + '</div>'
    + '<div class="maallinje">kalorier i dag · <button class="txtknap" id="b-maal">mål ' + tal(S.maal) + '</button></div>'
    + '<div class="baand"><span class="' + (over ? "over" : "") + '" style="width:' + pct + '%"></span></div>'
    + '<div class="rest"><span class="txt">'
    + (S.maal - sum.kcal >= 0 ? 'tilbage af dagens mål' : 'over dagens mål') + '</span>'
    + '<span class="num' + (over ? " over" : "") + '">' + tal(Math.abs(S.maal - sum.kcal)) + '</span></div>'
    + '<div class="makro"><div>protein <b>' + tal(sum.pro) + ' g</b></div>'
    + '<div>kulhydrat <b>' + tal(sum.kul) + ' g</b></div>'
    + '<div>fedt <b>' + tal(sum.fedt) + ' g</b></div>'
    + (gen > 0 ? '<div>genstande <b>' + kg(gen).replace(",0","") + '</b></div>' : "")
    + '</div></div>'
    + '<h2 class="sek">Dagens måltider</h2>';

  if (!poster.length){
    h += '<div class="tom">Ingen måltider endnu. Tag et billede af det første, så regner appen resten ud.</div>';
  } else {
    poster.forEach(function(p){
      h += '<div class="post">'
        + (p.billede ? '<img src="' + p.billede + '" alt="">' : '<div class="tom-foto"></div>')
        + '<div class="txt"><div class="navn">' + esc(p.navn) + '</div>'
        + '<div class="meta">' + esc(p.tid) + " · " + esc(p.kategori) + '</div>'
        + (p.kommentar ? '<div class="kom">' + esc(p.kommentar) + '</div>' : "") + '</div>'
        + '<div class="kcal">' + tal(p.kalorier) + '</div>'
        + '<button class="xknap" data-slet="' + esc(p.id) + '" aria-label="Slet ' + esc(p.navn) + '">&times;</button></div>';
    });
  }
  h += '<h2 class="sek">Forslag til resten af dagen</h2><div id="spiseboks"></div>'
    + '<p class="fodnote">Tallene er estimater ud fra fotoet. De rammer typisk 20–30 % fra, '
    + 'og lavest ved sovs, olie og skjulte ingredienser. Ret dem, før du gemmer, når du ved bedre.</p></div>'
    + '<div class="bund"><div class="bundindhold">'
    + '<button class="knap" id="b-foto">Tag billede</button>'
    + '<button class="knap sek smal" id="b-skriv">Skriv det</button></div></div>';

  $("rod").innerHTML = h;

  $("b-foto").onclick = function(){ $("fil").click(); };
  $("b-skriv").onclick = function(){ S.ark = { status:"skriv", tekst:"" }; tegnArk(); };
  tegnSpiseforslag();
  Array.prototype.forEach.call(document.querySelectorAll("[data-slet]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-slet");
      gemDag(S.iDag, hentDag(S.iDag).filter(function(p){ return p.id !== id; }));
      tegn();
    };
  });
}

/* --- Forslag til resten af dagen --- */
function spiseSignatur(){
  var spist = hentDag(S.iDag).reduce(function(a, x){ return a + x.kalorier; }, 0);
  return S.iDag + ":" + spist + ":" + new Date().getHours();
}
function tegnSpiseforslag(){
  var boks = $("spiseboks"); if (!boks) return;
  if (S.spiseStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_SPISE) || "null");
      if (gemt && gemt.sign === spiseSignatur()){ S.spise = gemt.data; S.spiseStatus = "klar"; }
    } catch(e){}
  }
  if (S.spiseStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)">Kigger på resten af dagen …</p>';
    return;
  }
  if (S.spiseStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.spiseFejl) + '</div>'
      + '<button class="knap sek" id="b-spise" style="margin-top:10px">Prøv igen</button>';
    $("b-spise").onclick = startSpiseforslag;
    return;
  }
  if (S.spiseStatus === "klar" && S.spise){
    var f = S.spise, ud = f.linje ? '<p class="overskrift">' + esc(f.linje) + '</p>' : "";
    (f.forslag || []).slice(0,4).forEach(function(x, i){
      var aaben = S.aabenRet === i;
      ud += '<div class="kort klik" data-ret="' + i + '">'
        + '<span class="pil">' + (aaben ? "skjul" : "opskrift") + '</span>'
        + (x.kcal ? '<span class="spar" style="color:var(--blaek)">' + tal(x.kcal) + '</span>' : "")
        + '<div class="fra">' + esc(x.ret) + '</div>'
        + (x.hvornaar ? '<div class="til">' + esc(x.hvornaar) + '</div>' : "")
        + (x.hvorfor ? '<div class="kom">' + esc(x.hvorfor) + '</div>' : "")
        + (aaben ? opskriftHtml(i) : "")
        + '</div>';
    });
    ud += '<button class="knap sek" id="b-spise" style="margin-top:6px">Giv mig nogle nye</button>';
    boks.innerHTML = ud;
    $("b-spise").onclick = startSpiseforslag;
    Array.prototype.forEach.call(document.querySelectorAll("[data-ret]"), function(k){
      k.onclick = function(e){
        if (e.target.closest("button.mini")) return;
        var i = Number(k.getAttribute("data-ret"));
        S.aabenRet = S.aabenRet === i ? null : i;
        if (S.aabenRet !== null) aabnOpskrift(i);
        tegnSpiseforslag();
      };
    });
    var tf = $("b-tilfoej"); if (tf) tf.onclick = function(){
      var o = S.opskrifter[S.aabenRet];
      if (!o || !o.data) return;
      var d = o.data;
      var poster = hentDag(S.iDag);
      poster.push(normaliser({
        id: String(Date.now()),
        tid: new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}),
        navn: d.titel || (S.spise.forslag[S.aabenRet] || {}).ret || "Måltid",
        kategori: d.kategori,
        portion: "1 portion efter opskriften",
        kalorier: Number(d.kcal_pr_portion) || 0
      }, 0));
      gemDag(S.iDag, poster);
      S.aabenRet = null;
      S.spiseStatus = "tom"; S.spise = null;
      S.forslagStatus = "tom"; S.forslag = null;
      tegn();
    };
    return;
  }
  boks.innerHTML = '<p style="color:var(--daempet);font-size:14px;margin:0 0 10px">'
    + 'Appen kan foreslå, hvad der er plads til i resten af dagen. Det koster ét API-kald.</p>'
    + '<button class="knap sek" id="b-spise">Hvad kan jeg spise nu</button>';
  $("b-spise").onclick = startSpiseforslag;
}
function opskriftHtml(i){
  var o = S.opskrifter[i];
  if (!o || o.status === "henter") return '<div class="opskrift"><p style="color:var(--daempet);margin:0">Skriver opskriften …</p></div>';
  if (o.status === "fejl") return '<div class="opskrift"><div class="note fejl" style="margin:0">' + esc(o.fejl) + '</div></div>';
  var d = o.data;
  var h = '<div class="opskrift">';
  if (o.billede){
    h += '<img src="' + esc(o.billede.url) + '" alt="' + esc(d.titel || "") + '" loading="lazy">'
      + '<div class="kilde">' + billedKredit(o.billede) + '</div>';
  } else if (o.billedeStatus === "henter"){
    h += '<div class="foto-tom">Leder efter et billede …</div>';
  } else {
    h += '<div class="foto-tom">Der var ikke noget frit billede af netop denne ret</div>';
  }
  h += '<div class="fakta">'
    + (d.tid_min ? '<span><b>' + d.tid_min + '</b> min</span>' : "")
    + (d.portioner ? '<span><b>' + d.portioner + '</b> portioner</span>' : "")
    + (d.kcal_pr_portion ? '<span><b>' + tal(d.kcal_pr_portion) + '</b> kcal pr. portion</span>' : "")
    + '</div>';
  if (Array.isArray(d.ingredienser) && d.ingredienser.length){
    h += '<h4>Ingredienser</h4><ul>'
      + d.ingredienser.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
  }
  if (Array.isArray(d.fremgangsmaade) && d.fremgangsmaade.length){
    h += '<h4>Sådan gør du</h4><ol>'
      + d.fremgangsmaade.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ol>';
  }
  if (d.tip) h += '<div class="tip">' + esc(d.tip) + '</div>';
  h += '<div style="margin-top:14px">'
    + '<button class="mini" id="b-tilfoej">Tilføj til dagbogen</button>'
    + '<a class="mini" href="https://www.google.com/search?q='
    + encodeURIComponent("site:valdemarsro.dk " + (d.titel || ""))
    + '" target="_blank" rel="noopener">Søg på Valdemarsro</a></div>'
    + '<p class="kilde" style="margin-top:9px">Opskriften herover er skrevet til appen. '
    + 'Knappen søger efter noget lignende hos Valdemarsro og åbner deres egen side.</p>';
  return h + '</div>';
}

function aabnOpskrift(i){
  if (S.opskrifter[i]) return;
  var x = (S.spise.forslag || [])[i];
  if (!x) return;
  var gemt = null;
  try { gemt = JSON.parse(laes(opskriftNoegle(x.ret)) || "null"); } catch(e){}
  if (gemt){
    S.opskrifter[i] = { status:"klar", data:gemt.data, billede:gemt.billede };
    tegnSpiseforslag();
    return;
  }
  S.opskrifter[i] = { status:"henter" };
  hentOpskrift(x.ret, x.kcal).then(function(d){
    S.opskrifter[i] = { status:"klar", data:d, billede:null, billedeStatus:"henter" };
    tegnSpiseforslag();
    return hentBillede(d.billedsoeg || x.ret, x.ret).then(function(b){
      if (!S.opskrifter[i]) return;
      S.opskrifter[i].billede = b;
      S.opskrifter[i].billedeStatus = "klar";
      skriv(opskriftNoegle(x.ret), JSON.stringify({ data:d, billede:b }));
      ryddOpskrifter();
      if (S.aabenRet === i) tegnSpiseforslag();
    });
  }).catch(function(err){
    S.opskrifter[i] = { status:"fejl", fejl:(err && err.message) || "Opskriften kunne ikke hentes." };
    tegnSpiseforslag();
  });
}
/* Behold de 20 nyeste opskrifter, saa lageret ikke loeber fuldt */
function ryddOpskrifter(){
  var n = alleNoegler().filter(function(k){ return k.indexOf(P_OPSKRIFT) === 0; });
  if (n.length > 20) n.slice(0, n.length - 20).forEach(fjern);
}

function startSpiseforslag(){
  S.spiseStatus = "henter"; S.aabenRet = null; S.opskrifter = {};
  tegnSpiseforslag();
  hentSpiseforslag().then(function(r){
    S.spise = r; S.spiseStatus = "klar";
    skriv(K_SPISE, JSON.stringify({ sign:spiseSignatur(), data:r }));
    tegnSpiseforslag();
  }).catch(function(err){
    S.spiseStatus = "fejl";
    S.spiseFejl = (err && err.message) || "Kunne ikke hente forslag.";
    tegnSpiseforslag();
  });
}

/* --- Vaegt --- */
function tegnVaegt(){
  var k = kropstal();
  var h = '<div class="indhold">' + hoved("Vægt");

  if (!k.liste.length){
    h += '<div class="tom" style="margin-top:18px">Ingen vejninger endnu. Registrér den første, '
      + 'så tegnes kurven her. Én gang om ugen på samme tidspunkt siger mere end hver dag.</div>';
  } else {
    h += '<div class="hero"><div class="stortal mellem">' + kg(k.nu) + '</div>'
      + '<div class="maallinje">kg'
      + (k.maalvaegt > 0 ? ' · <button class="txtknap" id="b-profil">mål ' + kg(k.maalvaegt) + '</button>'
                         : ' · <button class="txtknap" id="b-profil">sæt et mål</button>') + '</div>';
    var linjer = [];
    if (k.aendring !== null && k.liste.length > 1){
      linjer.push((k.aendring > 0 ? "+" : "−") + kg(Math.abs(k.aendring)) + " kg siden "
        + tilDato(k.foerste.dag).toLocaleDateString("da-DK",{day:"numeric",month:"long"}));
    }
    if (k.tilMaal !== null && Math.abs(k.tilMaal) >= 0.1){
      linjer.push(kg(Math.abs(k.tilMaal)) + " kg " + (k.tilMaal > 0 ? "til målet" : "under målet"));
    } else if (k.tilMaal !== null){
      linjer.push("du er ved målet");
    }
    if (linjer.length) h += '<p class="grafnote" style="margin:10px 0 0">' + esc(linjer.join(" · ")) + '</p>';
    h += '</div>' + vaegtgraf(k.liste, k.maalvaegt);

    var celler = [];
    if (k.bmi > 0) celler.push('<div><b>' + kg(k.bmi) + '</b>BMI</div>');
    if (k.tdee > 0) celler.push('<div><b>' + tal(k.tdee) + '</b>anslået forbrug</div>');
    celler.push('<div><b>' + k.liste.length + '</b>vejninger</div>');
    h += '<div class="noegletal">' + celler.join("") + '</div>';

    if (k.tdee > 0){
      h += '<p class="grafnote" style="margin-top:10px">Anslået dagligt forbrug efter Mifflin-St Jeor, '
        + 'ikke en måling — regn med 10–15 % slør. '
        + '<button class="txtknap" id="b-brugtdee">brug som dagligt mål</button></p>';
    }
    if (k.maalBmi > 0 && k.maalBmi < 18.5){
      h += '<div class="note">Målvægten svarer til et BMI på ' + kg(k.maalBmi)
        + '. Under 18,5 regnes som undervægt. Det er dit valg — men det er værd at vende med en læge.</div>';
    }
    h += '<h2 class="sek">Vejninger</h2>';
    k.liste.slice().reverse().slice(0, 20).forEach(function(x, i, arr){
      var forrige = k.liste[k.liste.length - 2 - i];
      var diff = forrige ? x.kg - forrige.kg : null;
      h += '<button class="raekke" data-vdag="' + x.dag + '"><span class="h">'
        + '<span style="display:block">' + kortDato(x.dag) + '</span>'
        + (diff !== null && Math.abs(diff) >= 0.05
            ? '<span class="u">' + (diff > 0 ? "+" : "−") + kg(Math.abs(diff)) + ' kg</span>' : "")
        + '</span><span class="s">' + kg(x.kg) + '</span></button>';
    });
    h += '<p class="fodnote">Tryk på en vejning for at rette eller slette den. '
      + 'Vægten svinger et kilo eller to hen over døgnet, så det er linjen over uger der siger noget.</p>';
  }

  h += '</div><div class="bund"><div class="bundindhold">'
    + '<button class="knap" id="b-vejning">Registrér vægt</button></div></div>';
  $("rod").innerHTML = h;
  bindHoved();
  var bp = $("b-profil"); if (bp) bp.onclick = function(){ S.indst = true; tegn(); };
  var bt = $("b-brugtdee"); if (bt) bt.onclick = function(){
    S.maal = Math.round(k.tdee); skriv(K_MAAL, String(S.maal)); tegn();
  };
  $("b-vejning").onclick = function(){ aabnVejning(S.iDag); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-vdag]"), function(b){
    b.onclick = function(){ aabnVejning(b.getAttribute("data-vdag")); };
  });
}

function aabnVejning(dag){
  var v = hentVaegte(), nu = v[dag] || (vaegtListe().length ? vaegtListe()[vaegtListe().length-1].kg : "");
  var h = '<div class="overlay" id="v-overlay"><div class="panel">'
    + '<h3>Vejning ' + kortDato(dag) + '</h3>'
    + '<span class="lbl">Vægt i kilo</span>'
    + '<input id="v-kg" type="text" inputmode="decimal" value="' + (nu || "") + '" placeholder="fx 84,2">'
    + '<button class="knap" id="v-gem" style="margin-top:16px">Gem</button>'
    + (v[dag] ? '<button class="knap fare" id="v-slet" style="margin-top:8px">Slet denne vejning</button>' : "")
    + '<button class="knap sek" id="v-luk" style="margin-top:8px">Fortryd</button></div></div>';
  var gl = $("v-overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);
  function luk(){ var o = $("v-overlay"); if (o) o.remove(); }
  $("v-overlay").onclick = function(e){ if (e.target.id === "v-overlay") luk(); };
  $("v-luk").onclick = luk;
  $("v-gem").onclick = function(){
    var kgv = laesKomma($("v-kg").value);
    if (kgv < 20 || kgv > 400){
      alert("Skriv vægten i kilo, fx 84,2.");
      return;
    }
    gemVaegt(dag, kgv); luk(); tegnVaegt();
  };
  var vs = $("v-slet"); if (vs) vs.onclick = function(){
    gemVaegt(dag, 0); luk(); tegnVaegt();
  };
}

/* --- Historik --- */
function tegnHistorik(){
  var perioder = byggPerioder(S.periode);
  var medData = perioder.filter(function(p){ return p.antal > 0; });
  var ialt = medData.reduce(function(a,p){ return a + p.total; }, 0);
  var dageIalt = medData.reduce(function(a,p){ return a + p.antal; }, 0);
  var snit = dageIalt ? ialt / dageIalt : 0;
  var navn = { dag:"30 dage", uge:"12 uger", maaned:"12 måneder" }[S.periode];

  var h = '<div class="indhold">' + hoved("Historik")
    + '<div class="valg" style="margin-top:8px">'
    + ['dag','uge','maaned'].map(function(t){
        return '<button data-per="' + t + '" class="' + (S.periode === t ? "aktiv" : "") + '">'
          + {dag:"Dag",uge:"Uge",maaned:"Måned"}[t] + '</button>';
      }).join("") + '</div>';

  if (!perioder.length){
    h += '<div class="tom" style="margin-top:16px">Der er ikke registreret måltider endnu. Så snart du gemmer det første, tegnes kurven her.</div></div>';
    $("rod").innerHTML = h; bindHoved(); bindPeriode(); return;
  }

  h += '<div class="noegletal"><div><b>' + tal(snit) + '</b>snit pr. dag</div>'
    + '<div><b>' + tal(ialt) + '</b>i alt</div>'
    + '<div><b>' + dageIalt + '</b>dage registreret</div></div>'
    + graf(perioder)
    + '<p class="grafnote">Søjlerne viser snit pr. dag, så målet betyder det samme i alle tre visninger. Seneste ' + navn + '.</p>';

  perioder.slice().reverse().forEach(function(p){
    if (!p.antal && S.periode !== "dag") return;
    h += '<button class="raekke" data-valg="' + esc(p.id) + '">'
      + '<span class="h"><span style="display:block">' + esc(p.titel) + '</span>'
      + (p.under || p.antal > 1 ? '<span class="u">' + esc(p.under)
          + (p.under && p.antal > 1 ? " · " : "")
          + (p.antal > 1 ? p.antal + " dage · snit " + tal(p.snit) : "") + '</span>' : "")
      + '</span><span class="s">' + (p.antal ? tal(p.total) : "–") + '</span></button>';
    if (S.valgt === p.id && p.antal){
      h += '<div class="detalje">';
      if (S.periode === "dag"){
        hentDag(p.dage[0]).forEach(function(m){
          h += '<div><span>' + esc(m.navn) + '</span><span>' + tal(m.kalorier) + '</span></div>';
        });
      } else {
        p.dage.slice().reverse().forEach(function(n){
          h += '<div><span>' + kortDato(n) + '</span><span>' + tal(dagSum(n)) + '</span></div>';
        });
      }
      h += '</div>';
    }
  });
  h += '</div>';
  $("rod").innerHTML = h;
  bindHoved(); bindPeriode();
  Array.prototype.forEach.call(document.querySelectorAll("[data-valg]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-valg");
      S.valgt = S.valgt === id ? null : id;
      tegnHistorik();
    };
  });
}
function bindPeriode(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-per]"), function(b){
    b.onclick = function(){ S.periode = b.getAttribute("data-per"); S.valgt = null; tegnHistorik(); };
  });
}

/* --- Trends --- */
function tegnTrends(){
  var a = analyseAfVindue(S.vindue);
  var h = '<div class="indhold">' + hoved("Trends")
    + '<div class="valg" style="margin-top:8px">'
    + [7,30,90].map(function(v){
        return '<button data-vin="' + v + '" class="' + (S.vindue === v ? "aktiv" : "") + '">' + v + ' dage</button>';
      }).join("") + '</div>';

  if (!a.poster.length){
    h += '<div class="tom" style="margin-top:16px">Ingen måltider i perioden. Registrér nogle dage, så finder appen mønstrene.</div></div>';
    $("rod").innerHTML = h; bindHoved(); bindVindue(); return;
  }

  var retning = "";
  if (a.aendring !== null && Math.abs(a.aendring) >= 3){
    retning = (a.aendring > 0 ? "↑ " : "↓ ") + Math.abs(Math.round(a.aendring)) + " %";
  }
  h += '<div class="noegletal"><div><b>' + tal(a.snit) + '</b>snit pr. dag</div>'
    + '<div><b>' + a.antalDage + '</b>dage registreret</div>'
    + (retning ? '<div><b>' + retning + '</b>mod forrige periode</div>' : '')
    + '</div>';

  /* kategorier */
  h += '<h2 class="sek">Hvad kalorierne kommer fra</h2>';
  var maks = a.kategorier[0] ? a.kategorier[0].kcal : 1;
  a.kategorier.forEach(function(k, i){
    var pct = Math.round(k.kcal / a.ialt * 100);
    h += '<div class="katraekke' + (i === 0 ? " top" : "") + '">'
      + '<div class="kattop"><span class="katnavn">' + esc(k.navn)
      + (i === 0 ? '<span class="maerke">største post</span>' : "")
      + ' <em>' + k.antal + ' måltider · ' + pct + ' %</em></span>'
      + '<span class="kattal">' + tal(k.kcal) + '</span></div>'
      + '<div class="katbar"><span style="width:' + (k.kcal / maks * 100).toFixed(1) + '%"></span></div></div>';
  });

  /* hoejdespringere */
  h += '<h2 class="sek">Højdespringere</h2>';
  a.toppe.forEach(function(t){
    h += '<div class="raekke" style="cursor:default"><span class="h">'
      + '<span style="display:block">' + esc(t.navn)
      + (t.ekstrem ? '<span class="maerke varm">stikker ud</span>' : "") + '</span>'
      + '<span class="u">' + kortDato(t.dag) + ' · ' + esc(t.kategori) + '</span></span>'
      + '<span class="s">' + tal(t.kcal) + '</span></div>';
  });
  h += '<p class="grafnote" style="margin-top:8px">“Stikker ud” betyder, at måltidet ligger tydeligt over dit eget gennemsnit i perioden — ikke at der er noget galt med det.</p>';

  /* gengangere */
  if (a.gengangere.length){
    h += '<h2 class="sek">Gengangere</h2>';
    a.gengangere.slice(0,5).forEach(function(g){
      h += '<div class="raekke" style="cursor:default"><span class="h">'
        + '<span style="display:block">' + esc(g.navn) + '</span>'
        + '<span class="u">' + g.antal + ' gange · snit ' + tal(g.kcal / g.antal) + '</span></span>'
        + '<span class="s">' + tal(g.kcal) + '</span></div>';
    });
  }

  /* forslag */
  h += '<h2 class="sek">Lettere alternativer</h2><div id="forslag"></div>'
    + '<h2 class="sek">Kost og tilskud</h2><div id="tilskudsboks"></div></div>';
  $("rod").innerHTML = h;
  bindHoved(); bindVindue();
  tegnForslag(a);
  tegnTilskud(a);
}
function tilskudSignatur(a){
  return S.vindue + ":" + a.antalDage + ":" + a.poster.length + ":"
    + a.kategorier.map(function(k){ return k.navn + Math.round(k.kcal / 100); }).join("|");
}
function tegnTilskud(a){
  var boks = $("tilskudsboks"); if (!boks) return;
  if (S.tilskudStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_TILSKUD) || "null");
      if (gemt && gemt.sign === tilskudSignatur(a)){ S.tilskud = gemt.data; S.tilskudStatus = "klar"; }
    } catch(e){}
  }
  if (S.tilskudStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)">Gennemgår kosten …</p>'; return;
  }
  if (S.tilskudStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.tilskudFejl) + '</div>'
      + '<button class="knap sek" id="b-tilskud" style="margin-top:10px">Prøv igen</button>';
    $("b-tilskud").onclick = function(){ startTilskud(a); };
    return;
  }
  if (S.tilskudStatus === "klar" && S.tilskud){
    var t = S.tilskud;
    var mrk = { "loest indtryk":"Løst indtryk", "nogenlunde":"Nogenlunde grundlag",
                "rimeligt billede":"Rimeligt billede" }[t.sikkerhed] || "Løst indtryk";
    var ud = '<span class="maerke stor">' + esc(mrk) + ' · ' + a.antalDage + ' dage</span>'
      + (t.opsummering ? '<p class="overskrift" style="margin-top:12px">' + esc(t.opsummering) + '</p>' : "");
    (t.moenstre || []).slice(0,5).forEach(function(m){
      ud += '<div class="kort"><div class="fra">' + esc(m.emne) + '</div>'
        + (m.set ? '<div class="kom" style="font-style:normal">' + esc(m.set) + '</div>' : "")
        + (m.mad ? '<div class="til">→ <b>' + esc(m.mad) + '</b></div>' : "")
        + (m.tilskud ? '<div class="kom">Tilskud: ' + esc(m.tilskud) + '</div>' : "")
        + '</div>';
    });
    ud += '<button class="knap sek" id="b-tilskud" style="margin-top:6px">Vurdér igen</button>'
      + '<p class="fodnote">Dagbogen måler kalorier og kategorier, ikke vitaminer. Det her er mønstre '
      + 'i det, du har registreret — ikke en konstatering af mangel. Kun en blodprøve hos lægen '
      + 'kan afgøre det, og tal med lægen eller apoteket, før du lægger tilskud til fast medicin.</p>';
    boks.innerHTML = ud;
    $("b-tilskud").onclick = function(){ startTilskud(a); };
    return;
  }
  boks.innerHTML = '<p style="color:var(--daempet);font-size:14px;margin:0 0 10px">'
    + 'Appen kan se på, hvad kosten peger på over tid, og om et tilskud giver mening. '
    + 'Vurderingen bliver skarpere, jo flere dage du registrerer. Det koster ét API-kald.</p>'
    + '<button class="knap sek" id="b-tilskud">Vurdér min kost</button>';
  $("b-tilskud").onclick = function(){ startTilskud(a); };
}
function startTilskud(a){
  S.tilskudStatus = "henter"; tegnTilskud(a);
  hentTilskud(a).then(function(r){
    S.tilskud = r; S.tilskudStatus = "klar";
    skriv(K_TILSKUD, JSON.stringify({ sign:tilskudSignatur(a), data:r }));
    tegnTilskud(a);
  }).catch(function(err){
    S.tilskudStatus = "fejl";
    S.tilskudFejl = (err && err.message) || "Kunne ikke vurdere kosten.";
    tegnTilskud(a);
  });
}

function bindVindue(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-vin]"), function(b){
    b.onclick = function(){
      S.vindue = Number(b.getAttribute("data-vin"));
      S.forslag = null; S.forslagStatus = "tom";
      S.tilskud = null; S.tilskudStatus = "tom";
      tegnTrends();
    };
  });
}
/* Forslagene koster et API-kald, saa de gemmes og hentes kun paa opfordring */
function tegnForslag(a){
  var boks = $("forslag"); if (!boks) return;
  if (S.forslagStatus === "tom"){
    try {
      var gemt = JSON.parse(laes(K_FORSLAG) || "null");
      if (gemt && gemt.vindue === S.vindue && gemt.sign === signatur(a)){
        S.forslag = gemt.data; S.forslagStatus = "klar";
      }
    } catch(e){}
  }
  if (S.forslagStatus === "henter"){
    boks.innerHTML = '<p style="color:var(--daempet)">Kigger dagbogen igennem …</p>';
    return;
  }
  if (S.forslagStatus === "fejl"){
    boks.innerHTML = '<div class="note fejl">' + esc(S.forslagFejl) + '</div>'
      + '<button class="knap sek" id="b-forslag" style="margin-top:10px">Prøv igen</button>';
    $("b-forslag").onclick = function(){ startForslag(a); };
    return;
  }
  if (S.forslagStatus === "klar" && S.forslag){
    var f = S.forslag;
    var ud = f.overskrift ? '<p class="overskrift">' + esc(f.overskrift) + '</p>' : "";
    (f.forslag || []).forEach(function(x){
      ud += '<div class="kort">'
        + (x.spar ? '<span class="spar">−' + tal(x.spar) + '</span>' : "")
        + '<div class="fra">' + esc(x.fra) + '</div>'
        + '<div class="til">→ <b>' + esc(x.til) + '</b></div>'
        + (x.kommentar ? '<div class="kom">' + esc(x.kommentar) + '</div>' : "")
        + '</div>';
    });
    ud += '<button class="knap sek" id="b-forslag" style="margin-top:6px">Giv mig nogle nye</button>'
      + '<p class="fodnote">Forslagene er idéer, ikke en kostplan. Skal noget laves om, er det dig der bestemmer hvad.</p>';
    boks.innerHTML = ud;
    $("b-forslag").onclick = function(){ startForslag(a); };
    return;
  }
  boks.innerHTML = '<p style="color:var(--daempet);font-size:14px;margin:0 0 10px">'
    + 'Appen kan foreslå lettere alternativer til det, der fylder mest. Det koster ét API-kald.</p>'
    + '<button class="knap sek" id="b-forslag">Find lettere alternativer</button>';
  $("b-forslag").onclick = function(){ startForslag(a); };
}
function signatur(a){
  return a.toppe.map(function(t){ return t.navn + t.kcal; }).join("|")
    + "#" + a.gengangere.slice(0,3).map(function(g){ return g.navn + g.kcal; }).join("|");
}
function startForslag(a){
  S.forslagStatus = "henter"; tegnForslag(a);
  hentForslag(a).then(function(r){
    S.forslag = r; S.forslagStatus = "klar";
    skriv(K_FORSLAG, JSON.stringify({ vindue:S.vindue, sign:signatur(a), data:r }));
    tegnForslag(a);
  }).catch(function(err){
    S.forslagStatus = "fejl";
    S.forslagFejl = (err && err.message) || "Kunne ikke hente forslag.";
    tegnForslag(a);
  });
}

      + '<input id="f-kcal" type="number" inputmode="numeric" value="' + (Number(r.kalorier)||0) + '">'
      + '<span class="lbl">Protein · kulhydrat · fedt (g)</span><div class="gitter">'
      + '<input id="f-pro" type="number" inputmode="numeric" value="' + (Number(r.protein_g)||0) + '">'
      + '<input id="f-kul" type="number" inputmode="numeric" value="' + (Number(r.kulhydrat_g)||0) + '">'
      + '<input id="f-fedt" type="number" inputmode="numeric" value="' + (Number(r.fedt_g)||0) + '"></div>';
    var b = dagsbudget();
    var efter = b.spist + (Number(r.kalorier) || 0);
    var rest = S.maal - efter;
    var maerker = { godt:["god","Godt valg"], tungt:["varm","Tungt for i dag"], fint:["","Passer ind"] };
    var mk = maerker[r.status] || maerker.fint;
    h += '<span class="maerke stor ' + mk[0] + '">' + mk[1] + '</span>'
      + '<div class="budget" id="budgetboks">' + budgetTekst(b.spist, efter) + '</div>';
    if (r.kommentar) h += '<p class="overskrift" style="font-size:17px;margin:14px 0 0">' + esc(r.kommentar) + '</p>';
    var alt = (Array.isArray(r.alternativer) ? r.alternativer.filter(function(x){ return x && x.til; }) : []).slice(0,3);
    var nu = alt.filter(function(x){ return x.naar !== "naeste"; });
    var senere = alt.filter(function(x){ return x.naar === "naeste"; });
    function kortet(x, i, medKnap){
      return '<div class="kort">'
        + (x.spar ? '<span class="spar">−' + tal(x.spar) + '</span>' : "")
        + '<div class="fra">' + esc(x.til) + '</div>'

      h += '<div class="note">'

  }
  h += '</div></div>';
  var gl = $("overlay"); if (gl) gl.remove();

  $("overlay").onclick = function(e){

  var bm = $("b-manuel"); if (bm) bm.onclick = function(){
    var st = $("s-tekst");
    S.ark = { status:"resultat", stor:a.stor, lille:a.lille, note:a.note || "",
      beskrivelse: st ? st.value.trim() : a.beskrivelse,
      r:{ navn: st ? st.value.trim().slice(0,60) : "", kategori:"Andet", portion:"",
          kalorier:0, protein_g:0, kulhydrat_g:0, fedt_g:0, genstande:0,
          usikkerhed:"hoej", note:"Indtastet manuelt" } };
    tegnArk();
  };
  var bb = $("b-beregn"); if (bb) bb.onclick = function(){
    var t = $("s-tekst").value.trim();
    if (t.length < 2){ $("s-tekst").focus(); return; }
    kaldAnalyse(null, null, "", null, t);
  };
  var ba = $("b-analyser"); if (ba) ba.onclick = function(){
    kaldAnalyse(a.stor, a.lille, $("in-note").value.trim(), null, null);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-sp]"), function(b){
    b.onclick = function(){
      var i = Number(b.getAttribute("data-sp")), v = b.getAttribute("data-v");
      S.ark.svar[i] = S.ark.svar[i] === v ? null : v;
      tegnArk();
    };
  });
  var bs = $("b-svar"); if (bs) bs.onclick = function(){
    var svar = [];
    a.spoergsmaal.forEach(function(sp, i){
      if (a.svar[i] && a.svar[i] !== "Ved ikke") svar.push({ q: sp.tekst, a: a.svar[i] });
    });
    if (!svar.length){ visResultat(a, a.r); return; }
    kaldAnalyse(a.stor, a.lille, a.note, svar, a.beskrivelse);
  };
  var bsp = $("b-spring"); if (bsp) bsp.onclick = function(){ visResultat(a, a.r); };
  var altListe = (a.r && Array.isArray(a.r.alternativer))
    ? a.r.alternativer.filter(function(x){ return x && x.til; }).slice(0,3) : [];
  Array.prototype.forEach.call(document.querySelectorAll("[data-alt]"), function(knap){
    knap.onclick = function(){
      var x = altListe[Number(knap.getAttribute("data-alt"))];
      if (!x) return;
      var kcal = Number($("f-kcal").value) || 0;
      var spar = Math.min(Number(x.spar) || 0, kcal);
      if (spar <= 0) return;
      var ny = kcal - spar, faktor = kcal > 0 ? ny / kcal : 0;
      $("f-kcal").value = Math.round(ny);
      ["f-pro","f-kul","f-fedt"].forEach(function(id){
        $(id).value = Math.round((Number($(id).value) || 0) * faktor);
      });
      var bb = $("budgetboks");
      if (bb) bb.innerHTML = budgetTekst(dagsbudget().spist, dagsbudget().spist + Math.round(ny));
      knap.textContent = "Regnet med"; knap.disabled = true;
    };

      id: String(Date.now()),

      genstande: (a.r && Number(a.r.genstande)) || 0,

      protein_g: Number($("f-pro").value) || 0,

      fedt_g: Number($("f-fedt").value) || 0,
      billede: a.lille || null
    }, 0));
    gemDag(S.iDag, poster);

    S.spiseStatus = "tom"; S.spise = null;
    S.tilskudStatus = "tom"; S.tilskud = null;
    lukArk();
  };
}
function visResultat(a, r){
  S.ark = { status:"resultat", stor:a.stor, lille:a.lille, note:a.note,
            beskrivelse:a.beskrivelse, r:r };
  tegnArk();
}
function kaldAnalyse(stor, lille, note, svar, beskrivelse){
  S.ark = { status:"analyserer", stor:stor, lille:lille, note:note, beskrivelse:beskrivelse };
  tegnArk();
  analyser(stor, note, svar, beskrivelse).then(function(r){
    var basis = { stor:stor, lille:lille, note:note, beskrivelse:beskrivelse };
    if (!r.er_mad){
      S.ark = Object.assign({ status:"fejl", besked: beskrivelse
        ? "Det lyder ikke som mad eller drikke. Prøv en anden formulering, eller indtast tallene selv."
        : "Der ser ikke ud til at være mad på billedet. Tag et nyt, eller indtast tallene selv." }, basis);
      tegnArk(); return;
    }
    var sp = Array.isArray(r.spoergsmaal) ? r.spoergsmaal.filter(function(x){
      return x && x.tekst && Array.isArray(x.valg) && x.valg.length;
    }).slice(0,3) : [];
    if (sp.length && !svar){
      S.ark = Object.assign({ status:"spoergsmaal", spoergsmaal:sp, svar:{}, r:r }, basis);
      tegnArk(); return;
    }
    visResultat(basis, r);
  }).catch(function(err){
    S.ark = { status:"fejl", stor:stor, lille:lille, note:note, beskrivelse:beskrivelse,
      besked:(err && err.message) || "Analysen gik i stå. Prøv igen, eller indtast tallene selv." };
    tegnArk();
  });
}
function lukArk(){
  S.ark = null;
  var o = $("overlay"); if (o) o.remove();
  tegn();
}
