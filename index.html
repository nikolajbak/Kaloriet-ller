<style>
:root{
  --papir:#E8E9E3; --kort:#FCFCFA; --blaek:#17211D; --daempet:#5A655F;
  --linje:#D2D5CC; --gron:#1F5D4C; --okker:#7A5810; --ler:#A8442A;
  --graf-maal:#8A6412;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--papir); color:var(--blaek);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.indhold{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0;}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;}
.datolinje{font-size:13px;color:var(--daempet);}
.txtknap{background:none;border:none;padding:0;font:inherit;font-size:13px;
  color:var(--gron);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.hero{margin-top:16px;}
.stortal{font-family:Georgia,"Times New Roman",serif;font-size:64px;line-height:.95;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stortal.over{color:var(--ler);}
.maallinje{margin-top:6px;font-size:14px;color:var(--daempet);}
.baand{height:6px;background:#DADCD3;border-radius:3px;margin:16px 0 14px;overflow:hidden;}
.baand span{display:block;height:100%;background:var(--gron);
  transition:width .45s cubic-bezier(.2,.7,.3,1);}
.baand span.over{background:var(--ler);}
.rest{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--linje);padding-top:12px;margin-top:2px;}
.rest .txt{font-size:13px;color:var(--daempet);}
.rest .num{font-family:Georgia,serif;font-size:30px;font-variant-numeric:tabular-nums;}
.rest .num.over{color:var(--ler);}
.makro{display:flex;gap:22px;font-size:13px;color:var(--daempet);
  border-top:1px solid var(--linje);padding-top:12px;}
.makro b{font-weight:600;color:var(--blaek);font-variant-numeric:tabular-nums;}
h2.sek{font-size:13px;font-weight:600;color:var(--daempet);margin:26px 0 10px;}
.post{display:flex;gap:12px;align-items:center;background:var(--kort);
  border:1px solid var(--linje);border-radius:12px;padding:10px;margin-bottom:8px;}
.post img,.post .tom-foto{width:52px;height:52px;border-radius:8px;flex:none;
  object-fit:cover;background:#DDE0D8;}
.post .txt{flex:1;min-width:0;}
.post .navn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .meta{font-size:13px;color:var(--daempet);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .kcal{font-family:Georgia,serif;font-size:20px;font-variant-numeric:tabular-nums;}
.xknap{background:none;border:none;color:var(--daempet);font-size:20px;line-height:1;
  padding:4px 2px 4px 10px;cursor:pointer;}
.tom{border:1px dashed var(--linje);border-radius:12px;padding:22px 18px;
  color:var(--daempet);font-size:14px;}
.fodnote{font-size:12px;color:var(--daempet);margin:22px 2px 0;line-height:1.5;}
.bund{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--papir) 66%,rgba(232,233,227,0));}
.bundindhold{max-width:520px;margin:0 auto;display:flex;gap:8px;}
button.knap.smal{flex:none;width:122px;}
button.knap{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;
  font-size:16px;font-weight:600;background:var(--gron);color:#F4F6F2;cursor:pointer;}
button.knap:disabled{opacity:.45;}
button.knap.sek{background:none;color:var(--blaek);border:1px solid var(--linje);font-weight:500;}
button.knap.fare{background:none;color:var(--ler);border:1px solid var(--linje);font-weight:500;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;background:var(--kort);
  border:1px solid var(--linje);border-radius:10px;padding:11px 12px;color:var(--blaek);}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gron);outline-offset:2px;}
.lbl{display:block;font-size:13px;color:var(--daempet);margin:14px 0 5px;}
.gitter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(23,33,29,.42);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
  animation:doer .22s ease-out;}
.overlay.lukker{animation:doerud .2s ease-in forwards;}
.overlay.lukker > .panel{animation:glidned .2s ease-in forwards;}
@keyframes doerud{to{opacity:0}}
@keyframes glidned{to{transform:translateY(30px)}}
.panel{background:var(--papir);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
  animation:glidop .3s cubic-bezier(.22,.7,.3,1);}
@keyframes doer{from{opacity:0}to{opacity:1}}
@keyframes glidop{from{transform:translateY(28px)}to{transform:none}}
@keyframes fold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

<body>

<h1 class="skjul">Kaloriedagbog</h1>
<div id="rod"></div>
<input type="file" id="fil" accept="image/*" capture="environment" class="skjul">
<input type="file" id="importfil" accept="application/json,.json" class="skjul">

<script>
"use strict";

var APP_VERSION = "26.1";
var SKEMA = 5;

var KATEGORIER = ["Kød & fisk","Grønt & salat","Brød & korn","Kartofler, ris & pasta",
  "Mejeri & æg","Snacks & slik","Kage & bagværk","Fastfood & takeaway",
  "Drikkevarer","Alkohol","Andet"];

/* ================= Lager ================= */

var P_DAG = "kd:dag:", K_NOEGLE = "kd:noegle", K_MAAL = "kd:maal",
    K_MODEL = "kd:model", K_SKEMA = "kd:skema", K_FORSLAG = "kd:forslag",
    K_BRUGER = "kd:navn", K_KAEK = "kd:kaek",
    K_PROFIL = "kd:profil", K_VAEGT = "kd:vaegte", K_TJEK = "kd:sidste-tjek",
    K_LAAS = "kd:laas", K_LAASTID = "kd:laastid", K_FEJL = "kd:fejl",
    K_FORBRUG = "kd:forbrug", K_SPISE = "kd:spiseforslag", K_TILSKUD = "kd:tilskud", P_OPSKRIFT = "kd:opskrift:", K_UNSPLASH = "kd:unsplash",
    P_SNAP = "kd:snap:", K_EKSPORT = "kd:sidste-eksport",
    K_SKYURL = "kd:sky-url", K_SKYTID = "kd:sky-tid", K_SKYSTAND = "kd:sky-stand";
var reserve = {};

function laes(k){
  try { var v = localStorage.getItem(k); return v === null ? (k in reserve ? reserve[k] : null) : v; }
  catch(e){ return k in reserve ? reserve[k] : null; }
}
function skriv(k, v){
  try { localStorage.setItem(k, v); return "ok"; }
  catch(e){
    if (e && (e.name === "QuotaExceededError" || e.code === 22 || /quota/i.test(String(e)))) return "fuld";
    reserve[k] = v; return "reserve";
  }
}
function fjern(k){ try { localStorage.removeItem(k); } catch(e){} delete reserve[k]; }
function alleNoegler(){
  var ud = [];
  try { for (var i = 0; i < localStorage.length; i++) ud.push(localStorage.key(i)); } catch(e){}
  for (var k in reserve) if (ud.indexOf(k) < 0) ud.push(k);
  return ud;
}
function dagNoegler(){
  return alleNoegler().filter(function(k){ return k.indexOf(P_DAG) === 0; }).sort();
}
function normaliser(p, i){
  p = p && typeof p === "object" ? p : {};
  var ant = Number(p.portioner);
  if (!(ant > 0)) ant = 1;
  var tal = {
    kalorier: Number(p.kalorier) || 0,
    protein_g: Number(p.protein_g) || 0,
    kulhydrat_g: Number(p.kulhydrat_g) || 0,
    fedt_g: Number(p.fedt_g) || 0,
    genstande: Number(p.genstande) || 0
  };
  /* pr_portion er grundlaget, saa antallet kan aendres igen senere uden at tallene
     skrider. Mangler det — en post fra en aeldre version — udledes det af totalen. */
  var pr = (p.pr_portion && typeof p.pr_portion === "object") ? p.pr_portion : null;
  if (!pr){
    pr = {};
    Object.keys(tal).forEach(function(k){ pr[k] = tal[k] / ant; });
  }
  return {
    id: String(p.id != null ? p.id : "gl" + i),
    tid: typeof p.tid === "string" ? p.tid : "",
    navn: typeof p.navn === "string" && p.navn ? p.navn : "Måltid",
    portion: typeof p.portion === "string" ? p.portion : "",
    kommentar: typeof p.kommentar === "string" ? p.kommentar : "",
    kategori: KATEGORIER.indexOf(p.kategori) >= 0 ? p.kategori : "Andet",
    portioner: ant,
    pr_portion: {
      kalorier: Number(pr.kalorier) || 0,
      protein_g: Number(pr.protein_g) || 0,
      kulhydrat_g: Number(pr.kulhydrat_g) || 0,
      fedt_g: Number(pr.fedt_g) || 0,
      genstande: Number(pr.genstande) || 0
    },
    genstande: tal.genstande,
    kalorier: tal.kalorier,
    protein_g: tal.protein_g,
    kulhydrat_g: tal.kulhydrat_g,
    fedt_g: tal.fedt_g,
    billede: typeof p.billede === "string" ? p.billede : null
  };
}

/* Faelles opfoersel for portionsfeltet i begge ark: aendres antallet, skaleres de
   tal der staar i felterne — ogsaa dem brugeren selv har rettet. */
function bindPortioner(idAntal, felter, efter){
  var el = $(idAntal);
  if (!el) return;
  var forrige = laesKomma(el.value) || 1;
  el.onchange = function(){
    var ny = laesKomma(el.value);
    if (!(ny > 0)){ el.value = forrige; return; }
    var f = ny / forrige;
    felter.forEach(function(id){
      var i = $(id);
      if (!i) return;
      var v = laesKomma(i.value) * f;
      i.value = id.slice(-4) === "-gen" ? Math.round(v * 10) / 10 : Math.round(v);
    });
    forrige = ny;
    if (efter) efter();
  };
}
function prPortion(totaler, antal){
  var ud = {};
  Object.keys(totaler).forEach(function(k){ ud[k] = (Number(totaler[k]) || 0) / (antal || 1); });
  return ud;
}
function portionsTekst(p){
  if (!p.portioner || p.portioner === 1) return "";
  return kg(p.portioner).replace(",0", "") + " portioner";
}
function hentDag(noegle){
  var r;
  try { r = JSON.parse(laes(P_DAG + noegle) || "[]"); } catch(e){ return []; }
  return Array.isArray(r) ? r.map(normaliser) : [];
}
function frigoerPlads(){
  var dage = dagNoegler();
  for (var i = 0; i < Math.max(0, dage.length - 7); i++){
    var poster;
    try { poster = JSON.parse(laes(dage[i]) || "[]"); } catch(e){ continue; }
    if (Array.isArray(poster) && poster.some(function(p){ return p && p.billede; })){
      poster.forEach(function(p){ if (p) delete p.billede; });
      skriv(dage[i], JSON.stringify(poster));
      return true;
    }
  }
  return false;
}
function gemDag(noegle, poster){
  if (!poster || !poster.length){ fjern(P_DAG + noegle); return; }
  var svar = skriv(P_DAG + noegle, JSON.stringify(poster)), n = 0;
  while (svar === "fuld" && n++ < 60 && frigoerPlads()) svar = skriv(P_DAG + noegle, JSON.stringify(poster));
  if (svar === "fuld"){
    skriv(P_DAG + noegle, JSON.stringify(poster.map(function(p){
      var k = Object.assign({}, p); delete k.billede; return k;
    })));
  }
}
/* ================= Sikkerhedskopier =================
   Automatiske oejebliksbilleder i browserens eget lager. De redder mod fejlklik og
   fejl i appen, men ikke mod at lageret ryddes eller telefonen gaar tabt — dertil
   skal filen ud af telefonen. Billeder gemmes ikke med, da de fylder alt. */

var MAKS_SNAP = 6;

function snapNoegler(){
  return alleNoegler().filter(function(k){ return k.indexOf(P_SNAP) === 0; })
    .sort(function(a, b){ return Number(a.slice(P_SNAP.length)) - Number(b.slice(P_SNAP.length)); });
}
function snapListe(){
  return snapNoegler().map(function(k){
    var d = null;
    try { d = JSON.parse(laes(k) || "null"); } catch(e){}
    if (!d) return null;
    var dage = Object.keys(d.dage || {});
    var maaltider = dage.reduce(function(a, n){ return a + (d.dage[n] || []).length; }, 0);
    return { noegle:k, tid:Number(k.slice(P_SNAP.length)), aarsag:d.aarsag || "",
             dage:dage.length, maaltider:maaltider, vejninger:Object.keys(d.vaegte || {}).length };
  }).filter(Boolean).reverse();
}

/* Naar der ryddes ud, fjernes den kopi der ligger taettest paa sin nabo i tid.
   Saa beholdes automatisk baade en helt frisk og nogle aeldre. */
function ryddSnaps(){
  var n = snapNoegler();
  while (n.length > MAKS_SNAP){
    var bedst = 1, mindst = Infinity;
    for (var i = 1; i < n.length - 1; i++){
      var afstand = Number(n[i+1].slice(P_SNAP.length)) - Number(n[i-1].slice(P_SNAP.length));
      if (afstand < mindst){ mindst = afstand; bedst = i; }
    }
    fjern(n[bedst]);
    n.splice(bedst, 1);
  }
}
function tagSnap(aarsag, tvunget){
  var n = snapNoegler();
  var nyeste = n.length ? Number(n[n.length-1].slice(P_SNAP.length)) : 0;
  if (!tvunget && Date.now() - nyeste < 20 * 3600 * 1000) return false;

  var dage = {}, antal = 0;
  dagNoegler().forEach(function(k){
    var d = k.slice(P_DAG.length);
    dage[d] = hentDag(d).map(function(p){
      var kopi = Object.assign({}, p);
      delete kopi.billede;
      return kopi;
    });
    antal += dage[d].length;
  });
  if (!antal && !tvunget) return false;

  var pakke = { v:SKEMA, aarsag:aarsag || "", maal:S.maal, navn:S.navn,
                profil:S.profil, vaegte:hentVaegte(), dage:dage };
  var svar = skriv(P_SNAP + Date.now(), JSON.stringify(pakke));
  if (svar === "fuld"){
    var gamle = snapNoegler();
    if (gamle.length){ fjern(gamle[0]); return tagSnap(aarsag, tvunget); }
    return false;
  }
  ryddSnaps();
  return true;
}
function gendanSnap(noegle){
  var d;
  try { d = JSON.parse(laes(noegle) || "null"); } catch(e){ return false; }
  if (!d || !d.dage) return false;
  tagSnap("før gendannelse", true);
  dagNoegler().forEach(fjern);
  Object.keys(d.dage).forEach(function(n){ gemDag(n, (d.dage[n] || []).map(normaliser)); });
  if (d.vaegte) skriv(K_VAEGT, JSON.stringify(d.vaegte));
  if (d.profil){ S.profil = d.profil; skriv(K_PROFIL, JSON.stringify(d.profil)); }
  if (d.maal){ S.maal = d.maal; skriv(K_MAAL, String(d.maal)); }
  if (d.navn){ S.navn = d.navn; skriv(K_BRUGER, d.navn); }
  return true;
}
/* Hele dagbogen som en pakke — bruges baade til filen og til afsendelsen */
function backuppakke(){
  var ud = { type:"kaloriedagbog", skema:SKEMA, tid:new Date().toISOString(),
             maal:S.maal, navn:S.navn, profil:S.profil, vaegte:hentVaegte(), dage:{} };
  dageMedData().forEach(function(n){
    ud.dage[n] = hentDag(n).map(function(p){
      var k = Object.assign({}, p); delete k.billede; return k;
    });
  });
  return ud;
}

/* Automatisk kopi ud af telefonen. Safari kan ikke skrive en fil af sig selv —
   Apple understoetter ikke File System Access API — saa kopien sendes i stedet
   til en adresse, brugeren selv opretter. */
function sendTilSky(tvunget){
  var url = laes(K_SKYURL);
  if (!url) return Promise.resolve(null);
  var sidst = Number(laes(K_SKYTID)) || 0;
  if (!tvunget && Date.now() - sidst < 20 * 3600 * 1000) return Promise.resolve(null);

  var krop = JSON.stringify(backuppakke());
  function noter(stand){
    skriv(K_SKYTID, String(Date.now()));
    skriv(K_SKYSTAND, stand);
    return stand;
  }
  /* Foerst et almindeligt kald, saa svaret kan laeses. Svarer modtageren uden
     CORS-hoveder, sendes det i blinde bagefter — det naar frem, men kan ikke bekraeftes. */
  return fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:krop })
    .then(function(r){ return noter(r.ok ? "bekraeftet" : "afvist"); })
    .catch(function(){
      return fetch(url, { method:"POST", mode:"no-cors",
                          headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:krop })
        .then(function(){ return noter("ubekraeftet"); })
        .catch(function(){ return noter("fejlet"); });
    });
}
function skyTekst(){
  if (!laes(K_SKYURL)) return "";
  var stand = laes(K_SKYSTAND), t = Number(laes(K_SKYTID)) || 0;
  if (!t) return "Endnu ikke sendt.";
  var d = new Date(t);
  var naar = d.toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + " kl. "
           + d.toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});
  if (stand === "bekraeftet") return "Sendt og bekræftet " + naar + ".";
  if (stand === "ubekraeftet") return "Sendt " + naar + ", men modtageren svarer ikke tilbage. Tjek mappen den første gang.";
  if (stand === "afvist") return "Modtageren afviste kopien " + naar + ".";
  return "Afsendelsen fejlede " + naar + ".";
}

function dageSidenEksport(){
  var t = Number(laes(K_EKSPORT)) || 0;
  return t ? Math.floor((Date.now() - t) / 86400000) : null;
}

function migrer(){
  var fra = Number(laes(K_SKEMA)) || 1;
  if (fra !== SKEMA) tagSnap("før opdatering af dataformat", true);
  if (fra < 5){
    dagNoegler().forEach(function(k){
      var n = k.slice(P_DAG.length);
      gemDag(n, hentDag(n));     /* faar bl.a. kategori paa gamle poster */
    });
  }
  if (fra !== SKEMA) skriv(K_SKEMA, String(SKEMA));
}

/* ================= Kodelaas =================
   Koden er ikke et gardin foran skaermen: API-noeglen bliver krypteret med den
   (PBKDF2 + AES-GCM), og uden koden ligger den ikke laesbart nogen steder paa
   telefonen. Selve dagbogen staar derimod ukrypteret — se noten i indstillinger. */

var ITERATIONER = 310000;
var aktivNoegle = null;   /* kun i hukommelsen, forsvinder ved genindlaesning */
var aktivKode = null;

function b64(buf){
  var u = new Uint8Array(buf), s = "";
  for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}
function fraB64(t){ return Uint8Array.from(atob(t), function(c){ return c.charCodeAt(0); }); }

function afledNoegle(kode, salt){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(kode), "PBKDF2", false, ["deriveKey"])
    .then(function(basis){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:ITERATIONER, hash:"SHA-256" },
        basis, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
    });
}
function krypter(kode, klartekst){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return afledNoegle(kode, salt).then(function(n){
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, n, new TextEncoder().encode(klartekst));
  }).then(function(ct){
    return { salt:b64(salt), iv:b64(iv), ct:b64(ct), iter:ITERATIONER };
  });
}
function dekrypter(kode, pakke){
  return afledNoegle(kode, fraB64(pakke.salt)).then(function(n){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:fraB64(pakke.iv) }, n, fraB64(pakke.ct));
  }).then(function(buf){ return new TextDecoder().decode(buf); });
}
function laasPakke(){
  try { return JSON.parse(laes(K_LAAS) || "null"); } catch(e){ return null; }
}
function harLaas(){ return !!laasPakke(); }

/* Ventetid efter gentagne fejlforsoeg — bremser den, der proever sig frem */
function fejlstand(){

}
function noterFejl(){

function spaerretI(){

}

/* ================= Datoer ================= */

function dagKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function tilDato(n){ var d = n.split("-").map(Number); return new Date(d[0], d[1]-1, d[2]); }
function langDato(n){ return tilDato(n).toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"}); }
function kortDato(n){ return tilDato(n).toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short"}); }
function tal(n){ return Math.round(n || 0).toLocaleString("da-DK"); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function $(id){ return document.getElementById(id); }
function mandag(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return t;
}
function ugeNr(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3);
  var jan4 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
}

/* ================= Historik ================= */

function dagSum(noegle){
  return hentDag(noegle).reduce(function(a,p){ return a + p.kalorier; }, 0);
}
function dageMedData(){
  return dagNoegler().map(function(k){ return k.slice(P_DAG.length); })
    .filter(function(n){ return hentDag(n).length; });
}
function byggPerioder(type){
  var dage = dageMedData();
  if (!dage.length) return [];
  var foerste = tilDato(dage[0]), idag = tilDato(S.iDag), ud = [];

  if (type === "dag"){
    var start = new Date(idag); start.setDate(start.getDate() - 29);
    if (start < foerste) start = new Date(foerste);
    for (var d = new Date(start); d <= idag; d.setDate(d.getDate() + 1)){
      var n = dagKey(d), s = dagSum(n), har = hentDag(n).length > 0;
      ud.push({ id:n, titel:kortDato(n), under:"", total:s, snit:s, antal:har?1:0, dage:har?[n]:[] });
    }
  } else if (type === "uge"){
    var u = mandag(idag); u.setDate(u.getDate() - 7 * 11);
    var fm = mandag(foerste); if (u < fm) u = fm;
    for (var w = new Date(u); w <= idag; w.setDate(w.getDate() + 7)){
      var med = [], sum = 0;
      for (var i = 0; i < 7; i++){
        var dd = new Date(w); dd.setDate(dd.getDate() + i);
        if (dd > idag) break;
        var nk = dagKey(dd);
        if (hentDag(nk).length){ med.push(nk); sum += dagSum(nk); }
      }
      var slut = new Date(w); slut.setDate(slut.getDate() + 6);
      ud.push({
        id: "u" + dagKey(w), titel: "Uge " + ugeNr(w),
        under: w.toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + " – "
             + slut.toLocaleDateString("da-DK",{day:"numeric",month:"short"}),
        total: sum, snit: med.length ? sum / med.length : 0, antal: med.length, dage: med
      });
    }
  } else {
    var m = new Date(idag.getFullYear(), idag.getMonth() - 11, 1);
    var fmn = new Date(foerste.getFullYear(), foerste.getMonth(), 1);
    if (m < fmn) m = fmn;
    for (var mm = new Date(m); mm <= idag; mm.setMonth(mm.getMonth() + 1)){
      var praefiks = mm.getFullYear() + "-" + String(mm.getMonth()+1).padStart(2,"0");
      var mdage = dage.filter(function(n){ return n.indexOf(praefiks) === 0; });
      var msum = mdage.reduce(function(a,n){ return a + dagSum(n); }, 0);
      ud.push({
        id: "m" + praefiks,
        titel: mm.toLocaleDateString("da-DK",{month:"long",year:"numeric"}),
        under: "", total: msum, snit: mdage.length ? msum / mdage.length : 0,
        antal: mdage.length, dage: mdage
      });
    }
  }
  return ud;
}
function graf(perioder){
  var B = 340, H = 150, top = 10, bund = 24, hoejde = H - top - bund;
  var maks = Math.max(S.maal || 0, 1);
  perioder.forEach(function(p){ if (p.snit > maks) maks = p.snit; });
  maks *= 1.1;
  var n = perioder.length, plads = B / n, bredde = Math.max(3, Math.min(26, plads * 0.62));
  var s = '<svg class="graf" viewBox="0 0 ' + B + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kalorier pr. dag i snit">';
  if (S.maal > 0){
    var y = top + hoejde - (S.maal / maks) * hoejde;
    s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + B + '" y2="' + y.toFixed(1)
       + '" stroke="#A9B0AA" stroke-width="1" stroke-dasharray="3 3"/>'
       + '<text x="' + B + '" y="' + (y - 4).toFixed(1) + '" text-anchor="end" font-size="9" fill="#5A655F">mål</text>';
  }
  perioder.forEach(function(p, i){
    var h = p.snit > 0 ? Math.max(2, (p.snit / maks) * hoejde) : 0;
    var x = i * plads + (plads - bredde) / 2, y2 = top + hoejde - h;
    var valgt = S.valgt === p.id;
    if (h > 0){
      s += '<rect x="' + x.toFixed(1) + '" y="' + y2.toFixed(1) + '" width="' + bredde.toFixed(1)
         + '" height="' + h.toFixed(1) + '" rx="2" fill="' + (valgt ? "#17211D" : "#1F5D4C") + '"/>';
    } else {
      s += '<rect x="' + x.toFixed(1) + '" y="' + (top + hoejde - 2) + '" width="' + bredde.toFixed(1)
         + '" height="2" rx="1" fill="#CDD1C8"/>';
    }
    var hvert = n > 16 ? 5 : (n > 8 ? 2 : 1);
    if (i % hvert === 0 || i === n - 1){
      var mrk = S.periode === "dag" ? tilDato(p.id).getDate()
              : (S.periode === "uge" ? ugeNr(tilDato(p.id.slice(1))) : p.titel.slice(0,3));
      s += '<text x="' + (x + bredde/2).toFixed(1) + '" y="' + (H - 8)
         + '" text-anchor="middle" font-size="9" fill="#5A655F">' + mrk + '</text>';
    }
  });
  return s + '</svg>';
}

/* ================= Vaegt og profil ================= */

var AKTIVITET = [
  ["1.2",   "Stillesiddende"],
  ["1.375", "Let aktiv — lidt motion"],
  ["1.55",  "Moderat aktiv"],
  ["1.725", "Meget aktiv"]
];

function hentVaegte(){
  try { var o = JSON.parse(laes(K_VAEGT) || "{}"); return (o && typeof o === "object") ? o : {}; }
  catch(e){ return {}; }
}
function vaegtListe(){
  var v = hentVaegte();
  return Object.keys(v).sort()
    .map(function(d){ return { dag:d, kg:Number(v[d]) || 0 }; })
    .filter(function(x){ return x.kg > 0; });
}
function gemVaegt(dag, kg){
  var v = hentVaegte();
  if (kg > 0) v[dag] = Math.round(kg * 10) / 10; else delete v[dag];
  skriv(K_VAEGT, JSON.stringify(v));
}
function gemProfil(aendring){
  S.profil = Object.assign({}, S.profil, aendring);
  skriv(K_PROFIL, JSON.stringify(S.profil));
}
/* Mifflin-St Jeor. Uden koen, hoejde eller alder giver den ingenting —
   den gaetter hellere ingenting end noget forkert. */
function kropstal(){
  var p = S.profil, liste = vaegtListe();
  var nu = liste.length ? liste[liste.length - 1].kg : 0;
  var foerste = liste.length ? liste[0] : null;
  var hoejde = Number(p.hoejde) || 0, alder = Number(p.alder) || 0;
  var bmi = (nu > 0 && hoejde > 0) ? nu / Math.pow(hoejde / 100, 2) : 0;
  var bmr = 0, tdee = 0;
  if (nu > 0 && hoejde > 0 && alder > 0 && (p.koen === "mand" || p.koen === "kvinde")){
    bmr = 10 * nu + 6.25 * hoejde - 5 * alder + (p.koen === "mand" ? 5 : -161);
    tdee = bmr * (Number(p.aktivitet) || 1.375);
  }
  var maal = Number(p.maalvaegt) || 0;
  return {
    liste: liste, nu: nu, foerste: foerste, bmi: bmi, bmr: bmr, tdee: tdee, maalvaegt: maal,
    tilMaal: (nu > 0 && maal > 0) ? nu - maal : null,
    aendring: (foerste && nu > 0) ? nu - foerste.kg : null,
    maalBmi: (maal > 0 && hoejde > 0) ? maal / Math.pow(hoejde / 100, 2) : 0
  };
}

/* Linjegraf over vaegten. X foelger den faktiske kalender, saa et hul
   paa tre uger ogsaa ser ud som tre uger. */
function vaegtgraf(liste, maalvaegt){
  var B = 340, H = 168, top = 12, bund = 22, venstre = 4, hoejre = 34;
  var bredde = B - venstre - hoejre, hoejdeP = H - top - bund;
  var vaerdier = liste.map(function(x){ return x.kg; });
  if (maalvaegt > 0) vaerdier = vaerdier.concat([maalvaegt]);
  var min = Math.min.apply(null, vaerdier), maks = Math.max.apply(null, vaerdier);
  var luft = Math.max(0.6, (maks - min) * 0.18);
  min -= luft; maks += luft;
  var t0 = tilDato(liste[0].dag).getTime();
  var t1 = tilDato(liste[liste.length - 1].dag).getTime();
  var spand = Math.max(1, t1 - t0);
  function X(d){ return venstre + (liste.length < 2 ? bredde / 2 : (tilDato(d).getTime() - t0) / spand * bredde); }
  function Y(kg){ return top + hoejdeP - (kg - min) / (maks - min) * hoejdeP; }

  var s = '<svg class="graf" viewBox="0 0 ' + B + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Vaegtudvikling">';
  if (maalvaegt > 0){
    var ym = Y(maalvaegt);
    s += '<line x1="' + venstre + '" y1="' + ym.toFixed(1) + '" x2="' + (venstre + bredde)
       + '" y2="' + ym.toFixed(1) + '" stroke="var(--graf-maal)" stroke-width="1" stroke-dasharray="4 3"/>'
       + '<text x="' + (B - 2) + '" y="' + (ym + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--graf-maal)">mål</text>';
  }
  var punkter = liste.map(function(x){ return X(x.dag).toFixed(1) + "," + Y(x.kg).toFixed(1); });
  if (liste.length > 1){
    s += '<polyline points="' + punkter.join(" ") + '" fill="none" stroke="#1F5D4C" '
       + 'stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  liste.forEach(function(x, i){
    var sidste = i === liste.length - 1;
    s += '<circle cx="' + X(x.dag).toFixed(1) + '" cy="' + Y(x.kg).toFixed(1) + '" r="'
       + (sidste ? 4 : 2.4) + '" fill="' + (sidste ? "#17211D" : "#1F5D4C") + '"/>';
  });
  var sid = liste[liste.length - 1];
  s += '<text x="' + (B - 2) + '" y="' + (Y(sid.kg) - 9).toFixed(1) + '" text-anchor="end" '
     + 'font-size="10" fill="#17211D">' + kg(sid.kg) + '</text>'
     + '<text x="' + venstre + '" y="' + (H - 6) + '" font-size="9" fill="#5A655F">'
     + tilDato(liste[0].dag).toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + '</text>';
  if (liste.length > 1){
    s += '<text x="' + (venstre + bredde) + '" y="' + (H - 6) + '" text-anchor="end" font-size="9" fill="#5A655F">'
       + tilDato(sid.dag).toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + '</text>';
  }
  return s + '</svg>';
}
function kg(n){ return (Math.round(n * 10) / 10).toLocaleString("da-DK", {minimumFractionDigits:1, maximumFractionDigits:1}); }
function laesKomma(v){ return Number(String(v || "").replace(",", ".").trim()) || 0; }

/* ================= Trends ================= */

/* Alle poster i de seneste N dage, med dagen haeftet paa */
function posterIVindue(dage, forskyd){
  forskyd = forskyd || 0;
  var slut = tilDato(S.iDag); slut.setDate(slut.getDate() - forskyd);
  var start = new Date(slut); start.setDate(start.getDate() - (dage - 1));
  var ud = [];
  dageMedData().forEach(function(n){
    var d = tilDato(n);
    if (d >= start && d <= slut) hentDag(n).forEach(function(p){ ud.push({ dag:n, post:p }); });
  });
  return ud;
}
function analyseAfVindue(dage){
  var raekker = posterIVindue(dage);
  var poster = raekker.map(function(r){ return r.post; });
  var ialt = poster.reduce(function(a,p){ return a + p.kalorier; }, 0);
  var dageMed = {};
  raekker.forEach(function(r){ dageMed[r.dag] = 1; });
  var antalDage = Object.keys(dageMed).length;

  /* kategorier */
  var kat = {};
  poster.forEach(function(p){
    kat[p.kategori] = kat[p.kategori] || { navn:p.kategori, kcal:0, antal:0 };
    kat[p.kategori].kcal += p.kalorier;
    kat[p.kategori].antal++;
  });
  var kategorier = Object.keys(kat).map(function(k){ return kat[k]; })
    .sort(function(a,b){ return b.kcal - a.kcal; });

  /* gengangere: samme navn flere gange */
  var g = {};
  poster.forEach(function(p){
    var n = p.navn.toLowerCase().trim();
    g[n] = g[n] || { navn:p.navn, antal:0, kcal:0 };
    g[n].antal++; g[n].kcal += p.kalorier;
  });
  var gengangere = Object.keys(g).map(function(k){ return g[k]; })
    .filter(function(x){ return x.antal >= 2; })
    .sort(function(a,b){ return b.kcal - a.kcal; });

  /* hoejdespringere: enkeltmaaltider langt over dit eget normalniveau */
  var snitPost = poster.length ? ialt / poster.length : 0;
  var varians = poster.length
    ? poster.reduce(function(a,p){ return a + Math.pow(p.kalorier - snitPost, 2); }, 0) / poster.length : 0;
  var spred = Math.sqrt(varians);
  var graense = snitPost + 1.2 * spred;
  /* kun een raekke pr. ret — gaar den igen, hoerer den hjemme under Gengangere */
  var set = {}, toppe = [];
  raekker.slice().sort(function(a,b){ return b.post.kalorier - a.post.kalorier; })
    .forEach(function(r){
      var n = r.post.navn.toLowerCase().trim();
      if (set[n] || toppe.length >= 5) return;
      set[n] = 1;
      toppe.push({ navn:r.post.navn, kcal:r.post.kalorier, dag:r.dag,
                   kategori:r.post.kategori, ekstrem: spred > 0 && r.post.kalorier > graense });
    });

  /* retning: dette vindue mod det foregaaende af samme laengde */
  var tidl = posterIVindue(dage, dage);
  var tdage = {}; tidl.forEach(function(r){ tdage[r.dag] = 1; });
  var tAntal = Object.keys(tdage).length;
  var tIalt = tidl.reduce(function(a,r){ return a + r.post.kalorier; }, 0);
  var snitNu = antalDage ? ialt / antalDage : 0;
  var snitFoer = tAntal ? tIalt / tAntal : 0;
  var aendring = snitFoer > 0 ? (snitNu - snitFoer) / snitFoer * 100 : null;

  return { poster:poster, ialt:ialt, antalDage:antalDage, snit:snitNu,
           kategorier:kategorier, gengangere:gengangere, toppe:toppe,
           aendring:aendring, snitFoer:snitFoer };
}

/* Hvad er der spist indtil nu i dag — bruges som kontekst for vurderingen */
function budgetTekst(spist, efter){
  var rest = S.maal - efter;
  return '<b>' + tal(efter) + '</b> af ' + tal(S.maal) + ' kcal i dag'
    + '<div class="rest' + (rest < 0 ? " over" : "") + '">'
    + (rest >= 0 ? tal(rest) + ' kcal tilbage efter dette måltid'
                 : tal(-rest) + ' kcal over målet')
    + '</div>';
}
/* Alt hvad der er regnet ud fra dagbogen. Kaldes hver gang en registrering
   tilfoejes, rettes eller slettes, saa intet analyseret bygger paa gamle tal. */
/* Fortryd. Alt der sletter en registrering eller en vejning gaar gennem her,
   saa der altid er en vej tilbage — ogsaa ved et fejltryk paa krydset. */
var fortrydUr = null;
function visFortryd(tekst, tilbage){
  skjulFortryd();
  document.body.insertAdjacentHTML("beforeend",
    '<div class="fortryd" id="fortryd-bar" role="status" aria-live="polite"><div class="indre">'
    + '<span class="tekst">' + esc(tekst) + '</span>'
    + '<button id="b-fortryd">Fortryd</button></div></div>');
  $("b-fortryd").onclick = function(){
    skjulFortryd();
    tilbage();
    nulstilAfledt();
    tegn();
  };
  fortrydUr = setTimeout(skjulFortryd, 7000);
}
function skjulFortryd(){
  if (fortrydUr){ clearTimeout(fortrydUr); fortrydUr = null; }
  var b = $("fortryd-bar"); if (b) b.remove();
}
/* Sletter en registrering og husker baade posten og dens plads i raekken */
function sletPost(dag, id){
  var poster = hentDag(dag);
  var plads = -1, post = null;
  poster.forEach(function(p, i){ if (p.id === id){ plads = i; post = p; } });
  if (!post) return;
  gemDag(dag, poster.filter(function(p){ return p.id !== id; }));
  nulstilAfledt();
  visFortryd("“" + post.navn + "” er slettet", function(){
    var nu = hentDag(dag);
    nu.splice(Math.min(plads, nu.length), 0, post);
    gemDag(dag, nu);
  });
}

function nulstilAfledt(){
  S.forslag = null; S.forslagStatus = "tom";
  S.spise = null; S.spiseStatus = "tom";
  S.tilskud = null; S.tilskudStatus = "tom";
  fjern(K_FORSLAG); fjern(K_SPISE); fjern(K_TILSKUD);
}

function dagsbudget(dag){
  var spist = hentDag(dag || S.iDag).reduce(function(a,p){ return a + p.kalorier; }, 0);
  return { spist:spist, maal:S.maal, tilbage:S.maal - spist };
}
/* Den dag nye registreringer havner paa. Normalt i dag, men kan saettes fra historikken. */
function maalDag(){ return S.maalDag || S.iDag; }
function nuKlokken(){
  return new Date().toLocaleTimeString("da-DK", { hour:"2-digit", minute:"2-digit" });
}
/* Til en tidligere dag giver "nu" ingen mening — der foreslaas et neutralt tidspunkt */
function standardTid(dag){ return dag === S.iDag ? nuKlokken() : "12.00"; }
/* To felter side om side: hvornaar blev det spist */
function naarFelter(idDato, idTid, dag, tid){

    + '<div style="display:flex;gap:8px">'
    + '<input id="' + idDato + '" type="date" style="flex:1.4" value="' + esc(dag) + '" max="' + esc(S.iDag) + '">'
    + '<input id="' + idTid + '" type="time" style="flex:1" value="' + esc(String(tid).replace(".", ":")) + '">'
    + '</div>';
}
function laesTid(id){

}

/* ================= API ================= */

/* Taeller kald pr. maaned, saa et uventet spring kan ses uden at logge ind i konsollen */
function tael(){
  var m = S.iDag.slice(0, 7), f;
  try { f = JSON.parse(laes(K_FORBRUG) || "{}"); } catch(e){ f = {}; }
  f[m] = (f[m] || 0) + 1;
  Object.keys(f).sort().slice(0, -6).forEach(function(k){ delete f[k]; });
  skriv(K_FORBRUG, JSON.stringify(f));
}
function forbrugDenneMaaned(){
  try { return (JSON.parse(laes(K_FORBRUG) || "{}"))[S.iDag.slice(0, 7)] || 0; }
  catch(e){ return 0; }
}

function kald(krop){
  tael();
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": aktivNoegle || laes(K_NOEGLE) || "",
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(krop)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){
      if (!r.ok){
        var m = (data.error && data.error.message) || "";
        if (r.status === 401 || r.status === 403) throw new Error("Nøglen blev afvist. Ret den under Indstillinger.");
        if (r.status === 400 && /credit|balance/i.test(m)) throw new Error("Der er ikke mere kredit på API-kontoen. Fyld op på console.anthropic.com.");
        if (r.status === 429) throw new Error("For mange kald lige nu. Vent et minut og prøv igen.");
        if (r.status >= 500) throw new Error("Serveren svarede ikke. Prøv igen om lidt.");
        throw new Error(m || ("Fejl " + r.status));
      }
      var tekst = (data.content || []).map(function(b){ return b.type === "text" ? b.text : ""; }).join("");
      var a = tekst.indexOf("{"), b = tekst.lastIndexOf("}");
      if (a < 0 || b < 0) throw new Error("Svaret kunne ikke læses. Prøv igen.");
      return JSON.parse(tekst.slice(a, b + 1));
    });
  });
}

/* Vurderingen maales mod dagens budget, ikke mod maden i sig selv. Det samme
   maaltid kan vaere rigeligt plads klokken tolv og trangt klokken ni om aftenen. */
function vurderingsdel(dag, tid){
  dag = dag || S.iDag;

  var hensigt = S.profil.hensigt === "holde"
    ? "holde vægten stabil"

  return (efter ? 'STATUS FOR ' + kortDato(dag) : 'DAGENS STATUS')
    + ': målet er ' + b.maal + ' kcal. Før dette måltid er der spist '
    + b.spist + ' kcal, så der var ' + b.tilbage + ' kcal tilbage. '
    + (efter
        ? 'Måltidet blev spist ' + kortDato(dag) + (tid ? ' klokken ' + tid : "") + '. '
        : 'Klokken er ' + (tid || new Date().toLocaleTimeString("da-DK", {hour:"2-digit", minute:"2-digit"})) + '. ')
    + 'Brugerens hensigt med appen er at ' + hensigt + '.\n\n'
    + (efter
        ? 'EFTERREGISTRERING: måltidet er spist for længst og bliver først skrevet ind nu. Se tilbage '
          + 'på dagen, som den var. Kommenter aldrig på hvornår registreringen sker, og skriv aldrig '
          + 'noget der forudsætter, at maden står foran brugeren — ingen bemærkninger om at det er '
          + 'sent, om hvad der kan nås i dag, eller om aftensmaden der venter. '
        : 'Måltidet er ikke spist endnu, så vurderingen er en melding før første bid, ikke en dom bagefter. ')
    + 'Vurder det i forhold til dagens budget og tidspunktet — ikke i forhold til maden i sig selv. '
    + 'Et stort måltid midt på dagen med rigelig plads tilbage er fint. Det samme måltid oven i en dag, '
    + 'der allerede er fyldt, er noget andet. Sæt status til "godt", når måltidet passer godt ind eller '
    + 'er et fornuftigt valg, "fint" når det er hverken eller, og "tungt" når det bruger en stor del af '
    + 'det, der var tilbage. Er budgettet allerede overskredet, så vær saglig og fremadrettet frem for '
    + 'bebrejdende — dagen er som den er, og i morgen er en ny.\n\n'
    + (efter
        ? 'VIGTIGT OM TIDSPUNKTET: måltidet er allerede spist, og der er intet at ændre ved det. '
          + 'Alle forslag gælder næste gang retten står på bordet. Sæt "naar" til "naeste" på dem alle.\n\n'
        : 'VIGTIGT OM TIDSPUNKTET: måltidet står foran brugeren og er endnu ikke spist — det er '
          + 'derfor der kan tages et billede af det. Dine forslag skal først og fremmest være noget, '
          + 'der kan nås lige nu med det, der står på bordet: lade sovsen stå, spise halvdelen af '
          + 'risene, droppe det andet stykke brød, tage vand i stedet for den næste øl, skrabe '
          + 'dressingen af. Sæt "naar" til "nu" på den slags.\n'
          + 'Kan der intet gøres ved lige dette måltid, må du give et forslag til næste gang samme '
          + 'ret står på bordet, og sætte "naar" til "naeste".\n\n')
    + 'Giv 1-3 forslag, men kun når der reelt er mindst 75 kcal at spare, og måltidet ligger i '
    + 'den tunge ende af dagens budget. Ellers en tom liste: er valget godt, står rosen fint '
    + 'alene, og gode råd til en skål havregryn er spild af begges tid. Hold forslagene til '
    + 'realistisk dansk hverdagsmad, og skriv dem som noget man kan gøre, ikke som noget man burde.\n'
    + 'Feltet nyt_navn skal være det navn, registreringen bør have, hvis forslaget bliver fulgt — '
    + 'altså en beskrivelse af hvad der så reelt blev spist. Er retten "Pasta med flødesovs" og '
    + 'forslaget er at lade sovsen stå, er nyt_navn "Pasta uden flødesovs". Feltet ros er en kort '
    + 'kæk bemærkning, der kun bliver vist, hvis forslaget faktisk bliver fulgt.';

function byggPrompt(note, svar, beskrivelse, dag, tid){
  var t = beskrivelse

    + '"status": "godt"/"fint"/"tungt", '

    + (S.kaek ? '"kommentar": "en kæk bemærkning på max 15 ord til ' + (S.navn || "brugeren") + ' om lige dette måltid", ' : '')
    + '"spoergsmaal": [{"tekst": "spørgsmålet", "valg": ["mulighed", "mulighed"]}]}\n\n'
    + (beskrivelse
        ? 'Handler beskrivelsen hverken om mad eller drikkevarer, sættes er_mad til false. '

function analyser(dataUrl, note, svar, beskrivelse, dag, tid){
  var indhold = [];

  }

/* Hvad kan der spises for resten af dagen. Kender dagens maaltider, klokkeslaet,
   resten af budgettet og profilen. */
function hentSpiseforslag(){

    + ' på en ' + t.toLocaleDateString("da-DK",{weekday:"long"}) + '.\n'
    + 'Dagligt mål: ' + S.maal + ' kcal. Spist indtil nu: ' + spist + ' kcal, heraf '
    + Math.round(pro) + ' g protein. Tilbage: ' + rest + ' kcal.\n'
    + 'Dagens måltider:\n' + liste + '\n'
    + 'Om personen: ' + profiltekst() + '.\n\n'
    + kostgrundlag() + '\n\n'
    + 'Giv 3 konkrete forslag til hvad der kan spises og drikkes i resten af dagen. Realistisk '
    + 'dansk hverdagsmad, ting man har eller kan nå at købe. Hvert forslag med et anslået '
    + 'kalorietal, der passer i det der er tilbage, og som dækker de måltider der mangler '
    + 'inden sengetid — er klokken 10, skal der både være frokost og aftensmad; er klokken 20, '
    + 'er det højst en aftensnack. Skæv efter det kostrådene peger på, som personen mangler i dag: '
    + 'grøntsager, fisk, fuldkorn, bælgfrugter, vand.\n\n'
    + 'VIGTIGT: foreslå aldrig at springe et måltid over, at faste resten af dagen eller at gå '
    + 'sulten i seng. Er der lidt eller ingenting tilbage af budgettet, så foreslå noget mættende '
    + 'og let alligevel, og skriv roligt at en enkelt dag ikke afgør noget. Ingen skræmmekampagne '
    + 'og ingen moralisering.\n\n'
    + 'Svar udelukkende med JSON, uden markdown:\n'

    + '"hvorfor": "kort begrundelse, max 14 ord"}]}';

function opskriftNoegle(ret){
