<style>
:root{
  --papir:#E8E9E3; --kort:#FCFCFA; --blaek:#17211D; --daempet:#6C7873;
  --linje:#D2D5CC; --gron:#1F5D4C; --okker:#B98A1E; --ler:#A8442A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--papir); color:var(--blaek);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.indhold{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0;}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.datolinje{font-size:13px;color:var(--daempet);}
.txtknap{background:none;border:none;padding:0;font:inherit;font-size:13px;
  color:var(--gron);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.hero{margin-top:14px;}
.stortal{font-family:Georgia,"Times New Roman",serif;font-size:64px;line-height:.95;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stortal.over{color:var(--ler);}
.maallinje{margin-top:6px;font-size:14px;color:var(--daempet);}
.baand{height:6px;background:#DADCD3;border-radius:3px;margin:16px 0 14px;overflow:hidden;}
.baand span{display:block;height:100%;background:var(--gron);
  transition:width .45s cubic-bezier(.2,.7,.3,1);}
.baand span.over{background:var(--ler);}
.makro{display:flex;gap:22px;font-size:13px;color:var(--daempet);
  border-top:1px solid var(--linje);padding-top:12px;}
.makro b{font-weight:600;color:var(--blaek);font-variant-numeric:tabular-nums;}
h2.sek{font-size:13px;font-weight:600;color:var(--daempet);margin:26px 0 10px;}
.post{display:flex;gap:12px;align-items:center;background:var(--kort);
  border:1px solid var(--linje);border-radius:12px;padding:10px;margin-bottom:8px;}
.post img,.post .tom-foto{width:52px;height:52px;border-radius:8px;flex:none;
  object-fit:cover;background:#DDE0D8;}
.post .txt{flex:1;min-width:0;}
.post .navn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .meta{font-size:12.5px;color:var(--daempet);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post .kcal{font-family:Georgia,serif;font-size:19px;font-variant-numeric:tabular-nums;}
.xknap{background:none;border:none;color:var(--daempet);font-size:22px;line-height:1;
  padding:4px 2px 4px 10px;cursor:pointer;}
.tom{border:1px dashed var(--linje);border-radius:12px;padding:22px 18px;
  color:var(--daempet);font-size:14px;}
.histrk{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--linje);
  display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 2px;font:inherit;cursor:pointer;color:var(--blaek);}
.histrk .s{font-family:Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums;}
.histdetalje{font-size:13px;color:var(--daempet);padding:8px 2px 12px;
  border-bottom:1px solid var(--linje);}
.histdetalje div{display:flex;justify-content:space-between;padding:2px 0;}
.fodnote{font-size:12px;color:var(--daempet);margin:22px 2px 0;line-height:1.5;}
.bund{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--papir) 66%,rgba(232,233,227,0));}
.bundindhold{max-width:520px;margin:0 auto;}
button.knap{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;
  font-size:16px;font-weight:600;background:var(--gron);color:#F4F6F2;cursor:pointer;}
button.knap:disabled{opacity:.45;}
button.knap.sek{background:none;color:var(--blaek);border:1px solid var(--linje);font-weight:500;}
button.knap.fare{background:none;color:var(--ler);border:1px solid var(--linje);font-weight:500;}
input,textarea{font-family:inherit;font-size:16px;width:100%;background:var(--kort);
  border:1px solid var(--linje);border-radius:10px;padding:11px 12px;color:var(--blaek);}
select{font-family:inherit;font-size:16px;width:100%;background:var(--kort);
  border:1px solid var(--linje);border-radius:10px;padding:11px 12px;color:var(--blaek);}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gron);outline-offset:2px;}
.lbl{display:block;font-size:12.5px;color:var(--daempet);margin:14px 0 5px;}
.gitter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(23,33,29,.42);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;}
.panel{background:var(--papir);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;}
.panel h3{margin:0 0 14px;font-size:17px;}
.foto{width:100%;border-radius:12px;display:block;background:#DDE0D8;}
.foto.venter{animation:aande 1.5s ease-in-out infinite;}
@keyframes aande{0%,100%{opacity:1}50%{opacity:.5}}
.note{background:#F4EEDF;border:1px solid #E1D4B2;border-radius:10px;
  padding:11px 12px;font-size:13.5px;margin-top:14px;}
.note.fejl{background:#F6E5DF;border-color:#E0C0B4;}
.opsaet{max-width:520px;margin:0 auto;
  padding:calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));}
.opsaet h1{font-family:Georgia,serif;font-size:30px;font-weight:400;line-height:1.15;margin:0 0 12px;}
.opsaet p{color:var(--daempet);font-size:14.5px;margin:0 0 14px;}
.skjul{display:none;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="rod"></div>
<input type="file" id="fil" accept="image/*" capture="environment" class="skjul">
<input type="file" id="importfil" accept="application/json,.json" class="skjul">

<script>
"use strict";

/* ================= Lager ================= */
/* Alt ligger lokalt i browseren pa denne telefon. Intet sendes andre steder hen
   end til Anthropics API, nar et billede skal analyseres. */

var P_DAG = "kd:dag:", K_NOEGLE = "kd:noegle", K_MAAL = "kd:maal", K_MODEL = "kd:model";
var reserve = {};

function laes(k){
  try { var v = localStorage.getItem(k); return v === null ? (k in reserve ? reserve[k] : null) : v; }
  catch(e){ return k in reserve ? reserve[k] : null; }
}
function skriv(k, v){
  try { localStorage.setItem(k, v); return "ok"; }
  catch(e){
    if (e && (e.name === "QuotaExceededError" || e.code === 22 || /quota/i.test(String(e)))) return "fuld";
    reserve[k] = v; return "reserve";
  }
}
function fjern(k){ try { localStorage.removeItem(k); } catch(e){} delete reserve[k]; }
function alleNoegler(){
  var ud = [];
  try { for (var i = 0; i < localStorage.length; i++) ud.push(localStorage.key(i)); } catch(e){}
  for (var k in reserve) if (ud.indexOf(k) < 0) ud.push(k);
  return ud;
}
function dagNoegler(){
  return alleNoegler().filter(function(k){ return k.indexOf(P_DAG) === 0; }).sort();
}
function hentDag(noegle){
  try { return JSON.parse(laes(P_DAG + noegle) || "[]"); } catch(e){ return []; }
}
/* Naar lageret er fyldt: smid billederne vaek fra de aeldste dage. Tallene bliver staaende. */
function frigoerPlads(){
  var dage = dagNoegler();
  for (var i = 0; i < Math.max(0, dage.length - 7); i++){
    var poster;
    try { poster = JSON.parse(laes(dage[i]) || "[]"); } catch(e){ continue; }
    if (poster.some(function(p){ return p.billede; })){
      poster.forEach(function(p){ delete p.billede; });
      skriv(dage[i], JSON.stringify(poster));
      return true;
    }
  }
  return false;
}
function gemDag(noegle, poster){
  var svar = skriv(P_DAG + noegle, JSON.stringify(poster));
  var forsoeg = 0;
  while (svar === "fuld" && forsoeg < 40 && frigoerPlads()){
    svar = skriv(P_DAG + noegle, JSON.stringify(poster));
    forsoeg++;
  }
  if (svar === "fuld"){
    var uden = poster.map(function(p){ var k = Object.assign({}, p); delete k.billede; return k; });
    skriv(P_DAG + noegle, JSON.stringify(uden));
  }
}

/* ================= Smaating ================= */

function dagKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function tilDato(n){ var d = n.split("-").map(Number); return new Date(d[0], d[1]-1, d[2]); }
function langDato(n){
  return tilDato(n).toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"});
}
function kortDato(n){
  return tilDato(n).toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short"});
}
function tal(n){ return Math.round(n || 0).toLocaleString("da-DK"); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function $(id){ return document.getElementById(id); }

/* Skalerer et valgt billede ned, saa uploadet er lille og hurtigt */
function skaler(file, maks, kvalitet){
  return new Promise(function(ok, fejl){
    var fr = new FileReader();
    fr.onerror = function(){ fejl(new Error("laesefejl")); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ fejl(new Error("billedfejl")); };
      img.onload = function(){
        var s = Math.min(1, maks / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", kvalitet));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= Tilstand ================= */

var S = {
  iDag: dagKey(new Date()),
  maal: Number(laes(K_MAAL)) || 2000,
  model: laes(K_MODEL) || "claude-sonnet-5",
  aabenDag: null,
  visHistorik: false,
  ark: null,
  indst: false
};

/* ================= Analyse ================= */

function byggPrompt(note){
  return 'Du er ernaeringsfaglig og vurderer et maaltid ud fra et foto.\n\n'
    + 'Estimer portionsstoerrelsen ud fra synlige holdepunkter: tallerken, bestik, haender, emballage. '
    + 'Er der flere retter paa billedet, laegges de sammen til et maaltid. '
    + 'Husk synligt fedtstof, dressing og sovs.'
    + (note ? '\n\nBrugerens egen note om maaltidet: "' + note + '". Vaegt den hoejere end dit eget gaet.' : '')
    + '\n\nSvar udelukkende med et JSON-objekt, uden markdown og uden indledning:\n'
    + '{"er_mad": true/false, "navn": "kort dansk navn", "portion": "kort beskrivelse af den maengde du har regnet med", '
    + '"kalorier": heltal, "protein_g": heltal, "kulhydrat_g": heltal, "fedt_g": heltal, '
    + '"usikkerhed": "lav"/"middel"/"hoej", "note": "en kort saetning om det vaesentligste forbehold"}\n\n'
    + 'Er der hverken mad eller drikke paa billedet, saettes er_mad til false og resten til 0 eller tom tekst.';
}

function analyser(dataUrl, note){
  var krop = {
    model: S.model,
    max_tokens: 700,
    messages: [{
      role: "user",
      content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: dataUrl.split(",")[1] } },
        { type: "text", text: byggPrompt(note) }
      ]
    }]
  };
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": laes(K_NOEGLE) || "",
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(krop)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){
      if (!r.ok){
        var m = (data.error && data.error.message) || "";
        if (r.status === 401 || r.status === 403) throw new Error("Nøglen blev afvist. Ret den under Indstillinger.");
        if (r.status === 400 && /credit|balance/i.test(m)) throw new Error("Der er ikke mere kredit på API-kontoen. Fyld op på console.anthropic.com.");
        if (r.status === 429) throw new Error("For mange kald lige nu. Vent et minut og prøv igen.");
        if (r.status >= 500) throw new Error("Serveren svarede ikke. Prøv igen om lidt.");
        throw new Error(m || ("Fejl " + r.status));
      }
      var tekst = (data.content || []).map(function(b){ return b.type === "text" ? b.text : ""; }).join("");
      var a = tekst.indexOf("{"), b = tekst.lastIndexOf("}");
      if (a < 0 || b < 0) throw new Error("Svaret kunne ikke læses. Prøv igen.");
      return JSON.parse(tekst.slice(a, b + 1));
    });
  });
}

/* ================= Skaerme ================= */

function tegn(){
  if (!laes(K_NOEGLE)) return tegnOpsaet();
  tegnHoved();
  if (S.ark) tegnArk();
  if (S.indst) tegnIndstillinger();
}

/* --- Foerste gang --- */
function tegnOpsaet(){
  $("rod").innerHTML =
    '<div class="opsaet">'
    + '<h1>Kaloriedagbog</h1>'
    + '<p>Appen bruger din egen API-nøgle til at læse billeder af mad. Nøglen bliver liggende på denne telefon og sendes kun til Anthropic, når du analyserer et måltid.</p>'
    + '<span class="lbl">API-nøgle</span>'
    + '<input id="in-noegle" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-...">'
    + '<div id="opsaet-fejl"></div>'
    + '<button class="knap" id="b-gem-noegle" style="margin-top:16px">Tag appen i brug</button>'
    + '<p style="margin-top:18px;font-size:13px">Nøglen hentes på console.anthropic.com under API keys. Du kan skifte den bagefter.</p>'
    + '</div>';
  $("b-gem-noegle").onclick = function(){
    var v = $("in-noegle").value.trim();
    if (v.length < 20){
      $("opsaet-fejl").innerHTML = '<div class="note fejl">Det ligner ikke en hel nøgle. Kopiér hele teksten, der begynder med sk-ant-.</div>';
      return;
    }
    skriv(K_NOEGLE, v);
    tegn();
  };
}

/* --- Hovedskaerm --- */
function tegnHoved(){
  var poster = hentDag(S.iDag);
  var sum = poster.reduce(function(a,p){
    return { kcal:a.kcal+(p.kalorier||0), pro:a.pro+(p.protein_g||0),
             kul:a.kul+(p.kulhydrat_g||0), fedt:a.fedt+(p.fedt_g||0) };
  }, {kcal:0,pro:0,kul:0,fedt:0});
  var over = S.maal > 0 && sum.kcal > S.maal;
  var pct = S.maal > 0 ? Math.min(100, sum.kcal / S.maal * 100) : 0;

  var h = '<div class="indhold">'
    + '<div class="top"><span class="datolinje">' + langDato(S.iDag) + '</span>'
    + '<button class="txtknap" id="b-indst">Indstillinger</button></div>'
    + '<div class="hero">'
    + '<div class="stortal' + (over ? " over" : "") + '">' + tal(sum.kcal) + '</div>'
    + '<div class="maallinje">kalorier i dag · <button class="txtknap" id="b-maal">mål ' + tal(S.maal) + '</button></div>'
    + '<div class="baand"><span class="' + (over ? "over" : "") + '" style="width:' + pct + '%"></span></div>'
    + '<div class="makro"><div>protein <b>' + tal(sum.pro) + ' g</b></div>'
    + '<div>kulhydrat <b>' + tal(sum.kul) + ' g</b></div>'
    + '<div>fedt <b>' + tal(sum.fedt) + ' g</b></div></div></div>'
    + '<h2 class="sek">Dagens måltider</h2>';

  if (!poster.length){
    h += '<div class="tom">Ingen måltider endnu. Tag et billede af det første, så regner appen resten ud.</div>';
  } else {
    poster.forEach(function(p){
      h += '<div class="post">'
        + (p.billede ? '<img src="' + p.billede + '" alt="">' : '<div class="tom-foto"></div>')
        + '<div class="txt"><div class="navn">' + esc(p.navn) + '</div>'
        + '<div class="meta">' + esc(p.tid) + (p.portion ? " · " + esc(p.portion) : "") + '</div></div>'
        + '<div class="kcal">' + tal(p.kalorier) + '</div>'
        + '<button class="xknap" data-slet="' + esc(p.id) + '" aria-label="Slet ' + esc(p.navn) + '">&times;</button></div>';
    });
  }

  var tidligere = dagNoegler().map(function(k){ return k.slice(P_DAG.length); })
    .filter(function(k){ return k !== S.iDag && hentDag(k).length; }).reverse();

  if (tidligere.length){
    h += '<h2 class="sek">Tidligere dage <button class="txtknap" id="b-hist">'
      + (S.visHistorik ? "skjul" : "vis " + tidligere.length) + '</button></h2>';
    if (S.visHistorik){
      tidligere.forEach(function(k){
        var pk = hentDag(k);
        var s = pk.reduce(function(a,p){ return a + (p.kalorier||0); }, 0);
        h += '<button class="histrk" data-dag="' + k + '"><span>' + kortDato(k) + '</span>'
          + '<span class="s">' + tal(s) + ' kcal</span></button>';
        if (S.aabenDag === k){
          h += '<div class="histdetalje">';
          pk.forEach(function(p){
            h += '<div><span>' + esc(p.navn) + '</span><span>' + tal(p.kalorier) + '</span></div>';
          });
          h += '</div>';
        }
      });
    }
  }

  h += '<p class="fodnote">Tallene er estimater ud fra fotoet. De rammer typisk 20–30 % fra, '
    + 'og lavest ved sovs, olie og skjulte ingredienser. Ret dem, før du gemmer, når du ved bedre.</p>'
    + '</div>'
    + '<div class="bund"><div class="bundindhold">'
    + '<button class="knap" id="b-foto">Tag billede</button></div></div>';

  $("rod").innerHTML = h;

  $("b-indst").onclick = function(){ S.indst = true; tegn(); };
  $("b-maal").onclick = function(){ S.indst = true; tegn(); };
  $("b-foto").onclick = function(){ $("fil").click(); };
  var bh = $("b-hist"); if (bh) bh.onclick = function(){ S.visHistorik = !S.visHistorik; tegn(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-slet]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-slet");
      gemDag(S.iDag, hentDag(S.iDag).filter(function(p){ return String(p.id) !== id; }));
      tegn();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-dag]"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-dag");
      S.aabenDag = S.aabenDag === k ? null : k;
      tegn();
    };
  });
}

/* --- Billedark --- */
function tegnArk(){
  var a = S.ark, h = '<div class="overlay" id="overlay"><div class="panel" id="panel">';

  if (a.status === "klargoer") h += '<h3>Klargør billedet …</h3>';
  if (a.stor) h += '<img class="foto' + (a.status === "analyserer" ? " venter" : "") + '" src="' + a.stor + '" alt="Det valgte måltid">';

  if (a.status === "valgt"){
    h += '<span class="lbl">Note (valgfri) — fx “stor portion” eller “stegt i smør”</span>'
      + '<input id="in-note" placeholder="Skriv det, billedet ikke viser" value="' + esc(a.note || "") + '">'
      + '<button class="knap" id="b-analyser" style="margin-top:14px">Analysér måltidet</button>'
      + '<button class="knap sek" id="b-manuel" style="margin-top:8px">Skriv ind selv</button>';
  }
  if (a.status === "analyserer"){
    h += '<p style="margin-top:16px;color:var(--daempet)">Vurderer portion og kalorier …</p>';
  }
  if (a.status === "fejl"){
    h += '<div class="note fejl">' + esc(a.besked) + '</div>'
      + '<button class="knap" id="b-luk" style="margin-top:14px">Luk</button>'
      + (a.stor ? '<button class="knap sek" id="b-manuel" style="margin-top:8px">Skriv ind selv</button>' : '');
  }
  if (a.status === "resultat"){
    var r = a.r;
    h += '<span class="lbl">Måltid</span>'
      + '<input id="f-navn" placeholder="Navn på måltidet" value="' + esc(r.navn || "") + '">'
      + '<span class="lbl">Kalorier</span>'
      + '<input id="f-kcal" type="number" inputmode="numeric" value="' + (Number(r.kalorier)||0) + '">'
      + '<span class="lbl">Protein · kulhydrat · fedt (g)</span>'
      + '<div class="gitter">'
      + '<input id="f-pro" type="number" inputmode="numeric" value="' + (Number(r.protein_g)||0) + '">'
      + '<input id="f-kul" type="number" inputmode="numeric" value="' + (Number(r.kulhydrat_g)||0) + '">'
      + '<input id="f-fedt" type="number" inputmode="numeric" value="' + (Number(r.fedt_g)||0) + '">'
      + '</div>';
    if (r.portion || r.note || r.usikkerhed === "hoej"){
      h += '<div class="note">'
        + (r.portion ? '<div>Regnet som: ' + esc(r.portion) + '</div>' : '')
        + (r.note ? '<div style="margin-top:4px">' + esc(r.note) + '</div>' : '')
        + (r.usikkerhed === "hoej" ? '<div style="margin-top:4px">Usikkert gæt — ret gerne tallet.</div>' : '')
        + '</div>';
    }
    h += '<button class="knap" id="b-gem" style="margin-top:16px">Gem i dagbogen</button>'
      + '<button class="knap sek" id="b-luk" style="margin-top:8px">Kassér</button>';
  }

  h += '</div></div>';
  var gl = $("overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);

  $("overlay").onclick = function(e){ if (e.target.id === "overlay" && a.status !== "analyserer") lukArk(); };
  var bl = $("b-luk"); if (bl) bl.onclick = lukArk;
  var bm = $("b-manuel"); if (bm) bm.onclick = function(){
    S.ark = { status:"resultat", stor:a.stor, lille:a.lille, note:a.note || "",
      r:{ navn:"", portion:"", kalorier:0, protein_g:0, kulhydrat_g:0, fedt_g:0,
          usikkerhed:"hoej", note:"Indtastet manuelt" } };
    tegnArk();
  };
  var ba = $("b-analyser"); if (ba) ba.onclick = function(){
    var note = $("in-note").value.trim();
    S.ark = { status:"analyserer", stor:a.stor, lille:a.lille, note:note };
    tegnArk();
    analyser(a.stor, note).then(function(r){
      if (!r.er_mad){
        S.ark = { status:"fejl", stor:a.stor, lille:a.lille, note:note,
          besked:"Der ser ikke ud til at være mad på billedet. Tag et nyt, eller skriv måltidet ind selv." };
      } else {
        S.ark = { status:"resultat", stor:a.stor, lille:a.lille, note:note, r:r };
      }
      tegnArk();
    }).catch(function(err){
      S.ark = { status:"fejl", stor:a.stor, lille:a.lille, note:note,
        besked: (err && err.message) || "Analysen gik i stå. Prøv igen, eller skriv måltidet ind selv." };
      tegnArk();
    });
  };
  var bg = $("b-gem"); if (bg) bg.onclick = function(){
    var poster = hentDag(S.iDag);
    poster.push({
      id: String(Date.now()),
      tid: new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}),
      navn: ($("f-navn").value.trim() || "Måltid"),
      portion: (a.r && a.r.portion) || "",
      kalorier: Number($("f-kcal").value) || 0,
      protein_g: Number($("f-pro").value) || 0,
      kulhydrat_g: Number($("f-kul").value) || 0,
      fedt_g: Number($("f-fedt").value) || 0,
      billede: a.lille || null
    });
    gemDag(S.iDag, poster);
    lukArk();
  };
}
function lukArk(){
  S.ark = null;
  var o = $("overlay"); if (o) o.remove();
  tegnHoved();
}

/* --- Indstillinger --- */
function tegnIndstillinger(){
  var h = '<div class="overlay" id="ind-overlay"><div class="panel">'
    + '<h3>Indstillinger</h3>'
    + '<span class="lbl">Dagligt mål (kalorier)</span>'
    + '<input id="s-maal" type="number" inputmode="numeric" value="' + S.maal + '">'
    + '<span class="lbl">Model</span>'
    + '<select id="s-model">'
    + '<option value="claude-sonnet-5"' + (S.model === "claude-sonnet-5" ? " selected" : "") + '>Sonnet 5 — bedst til mad</option>'
    + '<option value="claude-haiku-4-5-20251001"' + (S.model === "claude-haiku-4-5-20251001" ? " selected" : "") + '>Haiku 4.5 — billigst</option>'
    + '</select>'
    + '<span class="lbl">API-nøgle</span>'
    + '<input id="s-noegle" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Uændret">'
    + '<div class="note">Dagbogen ligger kun i denne browser. Tag en sikkerhedskopi en gang imellem — så kan du også flytte den til en ny telefon.</div>'
    + '<button class="knap" id="s-gem" style="margin-top:16px">Gem</button>'
    + '<button class="knap sek" id="s-eksport" style="margin-top:8px">Gem sikkerhedskopi</button>'
    + '<button class="knap sek" id="s-import" style="margin-top:8px">Indlæs sikkerhedskopi</button>'
    + '<button class="knap fare" id="s-nulstil" style="margin-top:8px">Slet alle data</button>'
    + '</div></div>';
  var gl = $("ind-overlay"); if (gl) gl.remove();
  document.body.insertAdjacentHTML("beforeend", h);

  function luk(){ S.indst = false; var o = $("ind-overlay"); if (o) o.remove(); tegnHoved(); }
  $("ind-overlay").onclick = function(e){ if (e.target.id === "ind-overlay") luk(); };
  $("s-gem").onclick = function(){
    S.maal = Number($("s-maal").value) || 0;
    S.model = $("s-model").value;
    skriv(K_MAAL, String(S.maal));
    skriv(K_MODEL, S.model);
    var n = $("s-noegle").value.trim();
    if (n) skriv(K_NOEGLE, n);
    luk();
  };
  $("s-eksport").onclick = function(){
    var ud = { type:"kaloriedagbog", maal:S.maal, dage:{} };
    dagNoegler().forEach(function(k){ ud.dage[k.slice(P_DAG.length)] = hentDag(k.slice(P_DAG.length)); });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(ud)], {type:"application/json"}));
    a.download = "kaloriedagbog-" + S.iDag + ".json";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  };
  $("s-import").onclick = function(){ $("importfil").click(); };
  $("s-nulstil").onclick = function(){
    if (!confirm("Slet alle måltider og indstillinger på denne telefon? Det kan ikke fortrydes.")) return;
    alleNoegler().filter(function(k){ return k.indexOf("kd:") === 0; }).forEach(fjern);
    S.maal = 2000; S.visHistorik = false;
    var o = $("ind-overlay"); if (o) o.remove();
    S.indst = false;
    tegn();
  };
}

/* ================= Hændelser ================= */

$("fil").onchange = function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  S.ark = { status:"klargoer" };
  tegnArk();
  Promise.all([ skaler(file, 1100, 0.82), skaler(file, 170, 0.6) ]).then(function(r){
    S.ark = { status:"valgt", stor:r[0], lille:r[1], note:"" };
    tegnArk();
  }).catch(function(){
    S.ark = { status:"fejl", besked:"Billedet kunne ikke åbnes. Prøv et andet." };
    tegnArk();
  });
};

$("importfil").onchange = function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      if (!d || !d.dage) throw new Error("format");
      Object.keys(d.dage).forEach(function(k){ gemDag(k, d.dage[k]); });
      if (d.maal){ S.maal = d.maal; skriv(K_MAAL, String(d.maal)); }
      S.indst = false;
      var o = $("ind-overlay"); if (o) o.remove();
      tegn();
      alert("Sikkerhedskopien er indlæst.");
    } catch(err){ alert("Filen kunne ikke læses som en sikkerhedskopi."); }
  };
  fr.readAsText(file);
};

/* Ny dag, mens appen ligger aaben i baggrunden */
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible"){
    var d = dagKey(new Date());
    if (d !== S.iDag){ S.iDag = d; S.aabenDag = null; tegn(); }
  }
});

/* Manifest, saa Android og desktop ogsaa kan installere den */
try {
  var man = { name:"Kaloriedagbog", short_name:"Kalorier", display:"standalone",
    background_color:"#E8E9E3", theme_color:"#E8E9E3", start_url:"." };
  var l = document.createElement("link");
  l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:"application/manifest+json"}));
  document.head.appendChild(l);
} catch(e){}

tegn();
</script>
